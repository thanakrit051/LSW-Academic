<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบฝึกข้อสอบระดับชาติ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Thai+Looped:wght@400;500;600&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>
<style>
/* หน้าตาตาม mockup v19 (ระบบจริง/ออกแบบ/mockup):
   หน้านักเรียนและหน้าครูเป็นคอลัมน์มือถือ ปุ่มหลักติดล่างจอ · หน้าผู้ดูแลเป็นจอคอมมีเมนูด้านซ้าย */
:root {
  --canvas: #e9ecf1; --bg: #f2f4f7; --surface: #ffffff; --surface-2: #f9fafb;
  --line: #e4e7ec; --line-2: #eaecf0; --line-strong: #d0d5dd;
  --ink: #101828; --ink-2: #344054; --muted: #475467; --faint: #98a2b3; --mute: #667085;
  --brand: #173f8a; --brand-ink: #ffffff; --brand-soft: #eef3fb; --brand-line: #c9d8f2;
  --hero: #173f8a; --hero-ink: #ffffff; --hero-sub: #c9d8f2; --hero-cell: rgba(255,255,255,.1); --hero-rule: rgba(255,255,255,.16);
  --good: #067647; --good-soft: #ecfdf3;
  --warn: #b54708; --warn-ink: #93370d; --warn-soft: #fffaeb;
  --bad: #b42318; --bad-bar: #d92d20; --bad-soft: #fef3f2;
  --font: "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  --font-read: "Noto Sans Thai Looped", "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #070b14; --bg: #0c111d; --surface: #161b26; --surface-2: #1b2130;
  --line: #2a303c; --line-2: #232936; --line-strong: #3a4250;
  --ink: #f2f4f7; --ink-2: #d0d5dd; --muted: #a4acb9; --faint: #6b7383; --mute: #8c94a3;
  --brand: #8fb0ec; --brand-ink: #0c111d; --brand-soft: #1b2a4a; --brand-line: #2c4475;
  --hero: #13274f; --hero-ink: #ffffff; --hero-sub: #b8c9ec;
  --good: #47cd89; --good-soft: #0e2a1d; --warn: #f7b155; --warn-ink: #f7b155; --warn-soft: #33230e;
  --bad: #f97066; --bad-bar: #f97066; --bad-soft: #3a1714; color-scheme: dark; } }
:root[data-theme="dark"] {
  --canvas: #070b14; --bg: #0c111d; --surface: #161b26; --surface-2: #1b2130;
  --line: #2a303c; --line-2: #232936; --line-strong: #3a4250;
  --ink: #f2f4f7; --ink-2: #d0d5dd; --muted: #a4acb9; --faint: #6b7383; --mute: #8c94a3;
  --brand: #8fb0ec; --brand-ink: #0c111d; --brand-soft: #1b2a4a; --brand-line: #2c4475;
  --hero: #13274f; --hero-ink: #ffffff; --hero-sub: #b8c9ec;
  --good: #47cd89; --good-soft: #0e2a1d; --warn: #f7b155; --warn-ink: #f7b155; --warn-soft: #33230e;
  --bad: #f97066; --bad-bar: #f97066; --bad-soft: #3a1714; color-scheme: dark; }
::selection { background: #c9d8f2; color: #101828; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.read { font-family: var(--font-read); }
/* โจทย์/คำอธิบายจากคลังข้อสอบ: ขึ้นบรรทัดใหม่ตามข้อความในชีต (บทอ่าน บทสนทนา ข้อความหลายบรรทัด) */
#q-stem, .stem, .fs-q, div.q, p.q, .stu h1.sm, span.read, p.read { white-space: pre-line; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { flex: none; }

/* ===== คอลัมน์มือถือ (นักเรียน ครู เข้าสู่ระบบ) ===== */
.app { max-width: 480px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; }
.app.white { background: var(--surface); }
@media (min-width: 520px) { .app { box-shadow: 0 0 0 1px var(--line-strong); } }
.app > main { flex-grow: 1; }
.bar { display: flex; align-items: center; gap: 8px; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: max(14px, env(safe-area-inset-top)); }
.bar .t { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.bar .t b { font-size: 16px; font-weight: 600; }
.bar .t span { font-size: 13px; color: var(--muted); }
.bar .t span.lg { font-size: 13px; }
.bar .end { margin-left: auto; white-space: nowrap; }
.ibtn { width: 40px; height: 40px; margin: -4px 0 -4px -10px; border: 0; background: transparent; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
.ibtn:hover { background: var(--bg); }
.dock { position: sticky; bottom: 0; z-index: 4; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 14px; padding-bottom: max(26px, calc(12px + env(safe-area-inset-bottom))); display: flex; flex-direction: column; gap: 6px; }
.dock .cap { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }
.dock .cap.strong { font-size: 15px; color: var(--ink); font-weight: 600; }
.dock .cap.left { text-align: left; font-size: 13px; }
.dock .two { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; }
.pad { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

/* ปุ่ม */
.btn-p { width: 100%; height: 52px; border-radius: 12px; border: 0; background: var(--brand); color: var(--brand-ink); font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; padding: 0 16px; text-align: center; }
.btn-p:hover { background: color-mix(in srgb, var(--brand) 88%, #000); }
.btn-p.arm { background: var(--bad); color: #fff; }
.btn-s { height: 52px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; padding: 0 16px; }
.btn-s:hover, .btn:hover { background: var(--surface-2); }
.btn { height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; white-space: nowrap; }
.btn.sm { height: 40px; padding: 0 14px; }
.btn.pri { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.pri:hover { background: color-mix(in srgb, var(--brand) 88%, #000); }
.btn.red { color: var(--bad); }
button:disabled, .btn-p:disabled { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 600; font-size: 14px; text-decoration: none; cursor: pointer; }
.link.mute { color: var(--muted); font-weight: 500; }
#stu-fix, #rp-edit, #q-all, #ov-usage { min-height: 44px; min-width: 44px; margin: -12px 0; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center; }
.hero-top .side #t-menu { min-width: 48px; justify-content: center; }
.link.warn { color: var(--warn); }

/* ป้ายและสถานะ */
.ctag { display: inline-flex; align-items: center; font-size: 13px; font-weight: 600; color: var(--brand); border: 1px solid var(--brand-line); background: var(--brand-soft); border-radius: 6px; padding: 0 6px; white-space: nowrap; line-height: 1.6; }
.ctag.on-white { background: var(--surface); }
.ctag.solid { color: var(--brand-ink); background: var(--brand); border-color: var(--brand); font-weight: 700; padding: 1px 8px; }
.ctag.big { font-size: 15px; font-weight: 700; color: var(--brand-ink); background: var(--brand); border-color: var(--brand); border-radius: 8px; padding: 2px 10px; }
.etag { font-size: 13px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border: 1px solid var(--brand-line); border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.ok { color: var(--good); } .wait { color: var(--warn); } .bad { color: var(--bad); } .info { color: var(--brand); } .mute { color: var(--mute); }
.diff { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); }
.diff::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--faint)); }
.now-tag { font-size: 13px; font-weight: 600; color: var(--brand-ink); background: var(--brand); border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
.now-tag.soft { color: var(--brand); background: var(--brand-soft); }
.now-tag.warn { color: var(--warn); background: var(--warn-soft); }

/* แถบความคืบหน้า */
.track { height: 8px; background: var(--line-2); border-radius: 4px; overflow: hidden; }
.track > span { display: block; height: 100%; background: var(--good); border-radius: inherit; transition: width .4s; }
.track.thin { height: 6px; border-radius: 3px; }
.track.blue > span { background: var(--brand); }
.track.low > span { background: var(--bad-bar); }

/* ===== หน้าครู: ห้องเรียนวันนี้ ===== */
.hero { background: var(--hero); color: var(--hero-ink); padding: 18px 18px 16px; padding-top: max(18px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 14px; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hero-top .who { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.hero-top .who span { font-size: 13px; color: var(--hero-sub); }
.hero-top .who b { font-size: 20px; font-weight: 600; }
.hero-top .side { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.35; flex: none; }
.hero-top .side span { font-size: 13px; color: var(--hero-sub); }
.hero-top .side button { background: none; border: 0; min-height: 44px; padding: 0 0 0 12px; margin: -10px 0; color: var(--hero-ink); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--hero-cell); border-radius: 12px; }
.stats > div { padding: 10px 12px; display: flex; flex-direction: column; min-width: 0; }
.stats > div + div { border-left: 1px solid var(--hero-rule); }
.stats span { font-size: 13px; color: var(--hero-sub); }
.stats b { font-size: 18px; font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border-radius: 16px; }
.focus { padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: inset 0 0 0 2px var(--brand); }
.focus-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.focus-head .t { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.focus-head .t > span:first-child { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.focus-head b { font-size: 18px; }
.focus-head .sub { font-size: 13px; color: var(--muted); }
.mini { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
.mini .q { font-family: var(--font-read); font-size: 15px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mini .tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.focus .links { display: flex; gap: 4px 18px; flex-wrap: wrap; }
.focus .links button { min-height: 44px; }
.wk { font-size: 13px; line-height: 1.5; color: var(--warn-ink); padding: 8px 12px; border-radius: 10px; background: var(--warn-soft); }
.wk.ok { color: var(--good); background: var(--good-soft); }
.focus .count { display: flex; flex-direction: column; gap: 8px; }
.focus .count .r { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--ink-2); }
.focus .count .r b { font-size: 20px; color: var(--ink); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-size: 13px; line-height: 1.4; }
.steps li { display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
.steps li::before { content: ""; height: 4px; border-radius: 2px; background: var(--line); }
.steps li.done::before { background: var(--brand); opacity: .45; }
.steps li.now { color: var(--brand); font-weight: 600; }
.steps li.now::before { background: var(--brand); }

.rows { display: flex; flex-direction: column; overflow: hidden; }
.row { width: 100%; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: transparent; text-align: left; color: var(--ink); }
.row + .row { border-top: 1px solid var(--line-2); }
button.row:hover { background: var(--surface-2); }
.row .t { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.row .t b { font-size: 16px; }
.row .t b small { font-size: 13px; font-weight: 500; color: var(--muted); }
.row .t span { font-size: 13px; }
.row .act { font-size: 14px; font-weight: 600; color: var(--brand); white-space: nowrap; }
.sec-label { font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 4px 4px 0; }
.empty { padding: 18px 16px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }

/* การ์ดแบบประเมิน (ครูประจำชั้น) หน้าตาเดียวกับการ์ดใน LINE */
.bubble { background: var(--surface); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.bubble .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.bubble .body .k { font-size: 13px; color: var(--muted); }
.bubble .body .h { font-weight: 600; font-size: 16px; }
.bubble .body .d { font-size: 14px; color: var(--ink-2); line-height: 1.55; }
.bubble .body .n { font-size: 15px; } .bubble .body .n b { font-size: 22px; font-variant-numeric: tabular-nums; }
.bubble .ba { display: flex; align-items: center; justify-content: center; min-height: 48px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--brand); font-weight: 600; font-size: 15px; text-decoration: none; width: 100%; }
.bubble .ba.sub { min-height: 44px; color: var(--ink-2); font-weight: 500; font-size: 14px; }

/* ===== หน้าครู: เลือกข้อสอบ ===== */
.filters { padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.fgroup { display: flex; flex-direction: column; gap: 6px; }
.fgroup > .lab { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.fgroup > .lab span { font-weight: 400; color: var(--muted); }
.fgroup > .hint { font-size: 13px; color: var(--muted); }
.exams { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.exams button { height: 44px; border-radius: 10px; font-size: 14px; font-weight: 600; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 0 4px; }
.exams button[aria-checked="true"] { border-color: var(--brand); background: var(--brand); color: var(--brand-ink); }
.exams button[aria-disabled="true"] { border: 1px dashed var(--line-strong); background: var(--surface-2); color: var(--faint); cursor: not-allowed; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin-right: -14px; padding-right: 14px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap; flex: none; }
.chips.scroll .chip { height: 44px; }
.chip[aria-checked="true"], .chip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.chip[aria-checked="true"]::before, .chip[aria-pressed="true"]::before { content: "✓ "; }
.selectbox { position: relative; height: 52px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.selectbox .v { font-size: 16px; font-weight: 600; flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selectbox .n { font-size: 13px; color: var(--muted); white-space: nowrap; }
.selectbox select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; }
.selectbox:focus-within { outline: 3px solid var(--brand); outline-offset: 2px; }
.qlist { background: var(--surface); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
.qi { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border: 0; background: transparent; text-align: left; color: var(--ink); width: 100%; }
.qi + .qi { border-top: 1px solid var(--line-2); }
.qi[aria-checked="true"] { background: var(--brand-soft); gap: 10px; }
.qi .h { display: flex; align-items: center; gap: 6px; }
.qi .radio { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; display: flex; align-items: center; justify-content: center; }
.qi[aria-checked="true"] .radio { border: 2px solid var(--brand); }
.qi[aria-checked="true"] .radio::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); }
.qi .stem { font-family: var(--font-read); font-size: 15px; line-height: 1.55; }
.qi .foot { font-size: 13px; color: var(--muted); }
.qi .foot .wait { font-weight: 600; }
.qi img { max-width: 100%; max-height: 180px; object-fit: contain; border-radius: 8px; background: #fff; align-self: flex-start; }
.ans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; font-size: 14px; font-variant-numeric: tabular-nums; }
.ans.one { grid-template-columns: minmax(0, 1fr); }
.ans span { padding: 6px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); line-height: 1.45; }
.ans span.key { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 600; }

/* ===== หน้าครู: QR รับคำตอบ ===== */
.live { padding: 28px 24px 24px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
.qrbox { padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
.qrbox canvas, .qrbox img { display: block; width: 200px; height: 200px; image-rendering: pixelated; }
.code { display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.code span { font-size: 13px; color: var(--muted); }
.code b { font-size: 34px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.answered { align-self: stretch; display: flex; flex-direction: column; gap: 8px; }
.answered .r { display: flex; justify-content: space-between; align-items: baseline; }
.answered .r > span:first-child { font-size: 15px; color: var(--ink-2); }
.answered .r b { font-size: 24px; } .answered .r small { font-size: 15px; color: var(--muted); }
.acts3 { align-self: stretch; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.acts3 > * { height: 72px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; text-align: center; line-height: 1.3; padding: 0 4px; }
.acts3 > *:hover { background: var(--surface-2); }
.acts3 svg { stroke: var(--brand); }

/* ===== หน้าครู: ผลคาบและรายงาน ===== */
.result { background: var(--surface); padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 20px; }
.result section + section { padding-top: 18px; border-top: 1px solid var(--line); }
.result .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.result .meta span:last-child { font-size: 14px; color: var(--muted); }

<script>
/* =====================================================================
   ชั้นข้อมูล: หน้าเว็บอยู่บน GitHub Pages เรียกฟังก์ชันใน Code.gs ผ่าน doPost ของเว็บแอป
   ไม่ส่งคุกกี้ Google ไปด้วย (credentials: 'omit') จึงไม่ติดปัญหาเบราว์เซอร์ที่ล็อกอิน Google หลายบัญชี
   ส่งเป็น text/plain เพื่อไม่ให้เบราว์เซอร์ถามสิทธิ์ CORS ก่อน (Apps Script ตอบคำถามนั้นไม่ได้)
   ข้อความ error ที่ขึ้นต้นด้วย E: คือข้อความสำหรับผู้ใช้ (ไม่ส่งซ้ำ)
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxev61VIerkQDKF5mAa5nnDB8isE1y81qAkTpkpCsdhxDscurG0xnTtvgRcrWnn9u7l/exec';
async function run(fn, ...a) {
  let j;
  try {
    const r = await fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args: a }) });
    j = await r.json();
  } catch (e) { throw new Error('NET'); }
  if (!j || !j.ok) throw new Error((j && j.error) || 'NET');
  return j.data;
}
const userMsg = (e) => { const m = String((e && e.message) || e || '').match(/E:([\s\S]*)$/); return m ? m[1].trim() : null; };
const NET_MSG = 'ไม่สามารถเชื่อมต่อระบบได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง';
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtCode = (c) => String(c || '').replace(/^(\d{3})(\d{3})$/, '$1 $2');

/* สมการในโจทย์และตัวเลือก: พิมพ์ในชีตเป็น LaTeX ครอบด้วย $…$ (ในบรรทัด) หรือ $$…$$ (แยกบรรทัด)
   หน้าเว็บแปลงเป็นสมการด้วย KaTeX ทุกครั้งที่มีเนื้อหาใหม่ขึ้นจอ ถ้าโหลด KaTeX ไม่ได้ จะเห็นเป็นข้อความ LaTeX เดิม
   ไม่แปลงในช่องกรอก (input/textarea) และกล่องข้อความสำหรับคัดลอกส่ง LINE (.msg) */
const TEX_OPT = {
  delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }, { left: '\\(', right: '\\)', display: false }],
  ignoredClasses: ['katex', 'msg', 'no-tex'], throwOnError: false, strict: 'ignore'
};
/* การแปลงสมการเองก็แก้ DOM ด้วย (เช่น $ ตัวเดียวที่ไม่มีตัวปิด ถูกแยกเป็นข้อความใหม่ทุกครั้ง)
   จึงทิ้งการเปลี่ยนแปลงที่เกิดจากการแปลงด้วย takeRecords() ไม่ให้วนแปลงซ้ำไม่รู้จบ */
const texObs = new MutationObserver(ms => {
  for (const m of ms) {
    if (m.type === 'characterData') { texIn(m.target.parentElement); continue; }
    for (const n of m.addedNodes) texIn(n.nodeType === 3 ? n.parentElement : n);
  }
});
function texIn(el) {
  if (!window.renderMathInElement || !el || el.nodeType !== 1 || el.closest('.katex, .msg, .no-tex')) return;
  if (!/\$|\\\(/.test(el.textContent)) return;
  try { renderMathInElement(el, TEX_OPT); } catch (e) {}
  texObs.takeRecords();
}
texObs.observe(document.body, { childList: true, subtree: true, characterData: true });
document.addEventListener('DOMContentLoaded', () => texIn(document.body));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const pct = (a, b) => b ? Math.min(100, Math.round(a / b * 100)) : 0;
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
}
function failMsg(e) { const m = userMsg(e); return m ? m.replace(/^LOGIN:/, '') : NET_MSG; }
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg || 'คัดลอกแล้ว'); }
  catch (e) { prompt('คัดลอกข้อความด้านล่าง', text); }
}
const lineShare = (msg) => 'https://line.me/R/share?text=' + encodeURIComponent(msg);
// ไลบรารี QR โหลดแบบ defer (ไม่ขวางหน้าแรกของนักเรียน) ถ้ายังโหลดไม่เสร็จ รอจนเสร็จแล้ววาด
function drawQr(el, text, size) {
  if (typeof QRCode === 'undefined') {
    if (document.readyState !== 'complete') { window.addEventListener('load', () => document.contains(el) && drawQr(el, text, size), { once: true }); return true; }
    el.textContent = 'ไม่สามารถสร้าง QR Code ได้ กรุณาใช้รหัสห้องหรือลิงก์แทน'; return false;
  }
  try { new QRCode(el, { text, width: size || 720, height: size || 720, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); return true; }
  catch (e) { el.textContent = 'ไม่สามารถสร้าง QR Code ได้ กรุณาใช้รหัสห้องหรือลิงก์แทน'; return false; }
}

const OPT_L = ['ก', 'ข', 'ค', 'ง', 'จ'];

/* ----- ชนิดคำตอบ: choice เลือกตอบ · number เติมตัวเลข · multi เลือกหลายคำตอบ · yesno ใช่/ไม่ใช่ · order เรียงลำดับ ----- */
// คำตอบเก็บเป็นข้อความ: multi "2,4" · order "3,1,2" · yesno "1,2,1" (1 = ใช่ 2 = ไม่ใช่ ช่องว่าง = ยังไม่ตอบ)
const aParts = v => (v === null || v === undefined ? '' : String(v)).split(',').filter(Boolean);
const YN_TXT = { 1: 'ใช่', 2: 'ไม่ใช่' };
// ตอบครบพอจะส่งได้หรือยัง
function ansReady(it, v) {
  if (v === null || v === undefined || v === '') return false;
  if (it.type === 'yesno') { const a = String(v).split(','); return it.opts.every((o, j) => a[j] === '1' || a[j] === '2'); }
  if ((it.type === 'multi' || it.type === 'order') && it.need) return aParts(v).length === it.need;
  return true;
}
function ansRight(it, v, key) {
  if (!ansReady(it, v)) return false;
  if (it.type === 'number') return Number(String(v).replace(/,/g, '')) === Number(String(key).replace(/,/g, ''));
  if (it.type === 'multi') return aParts(v).sort().join(',') === String(key);
  return String(v) === String(key);
}
const isKey = (it, j) => it.type === 'multi' ? aParts(it.ans).includes(String(j + 1)) : String(j + 1) === String(it.ans);
// แสดงคำตอบเป็นข้อความ (full = ใส่ข้อความตัวเลือกด้วย)
function ansText(it, v, full) {
  if (v === null || v === undefined || v === '') return 'ไม่ได้ตอบ';
  const opt = k => `${OPT_L[k - 1] || k}${full && it.opts[k - 1] ? ' ' + it.opts[k - 1] : ''}`;
  if (it.type === 'number') return String(v);
  if (it.type === 'choice') return opt(Number(v));
  if (it.type === 'multi') return aParts(v).map(k => opt(Number(k))).join(' และ ');
  if (it.type === 'order') return aParts(v).map(k => opt(Number(k))).join(' → ');
  if (it.type === 'yesno') return String(v).split(',').map((x, j) => `${j + 1}) ${YN_TXT[x] || '—'}`).join(' · ');
  return String(v);
}
// ช่องตอบตามชนิดข้อ · ord = ลำดับตัวเลือกที่แสดง (แบบประเมินสลับตัวเลือกได้) · ปุ่มคำตอบมี data-k หรือ data-yn
function ansBox(it, pick, ord) {
  const order = ord && ord.length ? ord : it.opts.map((o, j) => j), long = it.opts.some(o => o.length > 40) ? ' long' : '';
  if (it.type === 'number') return `<div class="field"><label for="q-num">คำตอบ (ตัวเลข)</label><input id="q-num" class="input id-in" inputmode="decimal" autocomplete="off" maxlength="20" value="${esc(pick ?? '')}" placeholder="พิมพ์ตัวเลข"></div>`;
  if (it.type === 'yesno') {

function dtHint(v) {
  if (!v) return '';
  const d = new Date(v);
  if (isNaN(d)) return '';
  try { return d.toLocaleString('th-TH', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' น.'; }
  catch (e) { return ''; }
}
document.addEventListener('input', e => {
  const t = e.target;
  if (!t || t.type !== 'datetime-local' || !t.id) return;
  const h = document.querySelector(`.date-hint[data-for="${t.id}"]`);
  if (h) h.textContent = dtHint(t.value);
});

const sheetHead = (title, sub) => `<div class="sh-head"><div class="t"><b id="sh-title">${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</div>
  <button class="ibtn" type="button" data-x aria-label="ปิด" style="margin:-6px -8px 0 0">${IC.close}</button></div>`;
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#fs').hidden && !PARAMS.screen) closeFs(); else if (!$('#scrim').hidden) closeSheet();
    return;
  }
  // แผ่นล่างเปิดอยู่: Tab วนอยู่ในแผ่น ไม่หลุดไปหน้าหลังฉาก
  if (e.key === 'Tab' && !$('#scrim').hidden) {
    const f = $$('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])', $('#sheet')).filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!$('#sheet').contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  // ปุ่มลูกศรในกลุ่มตัวเลือก (radiogroup) และแท็บ (tablist): เลื่อนและเลือกทันที
  const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  const me = document.activeElement;
  if (!step || !me || !me.matches('[role=radio], [role=tab]')) return;
  const group = me.closest('[role=radiogroup], [role=tablist]');
  if (!group) return;
  const items = $$(me.matches('[role=tab]') ? '[role=tab]' : '[role=radio]', group).filter(x => !x.disabled);
  const i = items.indexOf(me);
  if (i < 0) return;
  e.preventDefault();
  const next = items[(i + step + items.length) % items.length];
  const sel = next.matches('[role=tab]') ? 'data-tab' : null;
  next.click();
  // ปุ่มถูกวาดใหม่หลังคลิก: หาตัวที่ถูกเลือกในกลุ่มเดิมแล้วโฟกัส
  requestAnimationFrame(() => {
    const live = document.contains(next) ? next
      : $$('[role=radiogroup] [aria-checked="true"], [role=tablist] [aria-selected="true"]').find(x => x.textContent === next.textContent);
    live && live.focus();
  });
});

const TK = {

  set(t, remember) { try { (remember ? localStorage : sessionStorage).setItem('tk', t); } catch (e) {} },
  clear() { try { localStorage.removeItem('tk'); sessionStorage.removeItem('tk'); } catch (e) {} }
};
async function api(fn, ...a) {

  catch (e) {

const STU = { info: null, roundId: null, step: 'loading', no: '', pick: null, result: null, err: '', code: '', reviewTimer: null, review: null };

async function stuInit() {
  if (PARAMS.r) return stuLoad({ r: PARAMS.r });
  if (PARAMS.code) return stuLoad({ code: PARAMS.code });
  STU.step = 'code'; stuRender();
}

async function stuLoad(arg) {
  STU.step = 'loading'; STU.err = ''; stuRender();
  try { STU.info = await run('studentOpen', arg); }
  catch (e) { STU.err = failMsg(e); STU.step = arg.code ? 'code' : 'error'; STU.retry = () => stuLoad(arg); return stuRender(); }
  const I = STU.info;
  STU.roundId = I.roundId; STU.review = null;
  // เข้าด้วยรหัสห้อง: จำรอบไว้ เผื่อกดรีเฟรชหลังครูปิดรับ จะได้กลับมาดูเฉลยได้
  store.set('lastRound', I.roundId);
  if (!PARAMS.r) { try { history.replaceState(null, '', '?r=' + encodeURIComponent(I.roundId)); PARAMS.r = I.roundId; } catch (e) {} }
  const out = store.get('outbox-' + STU.roundId);
  if (out) { Object.assign(STU, { no: out.studentId, pick: out.answers[0] }); return stuSubmit(out); }
  const last = store.get('last-' + STU.roundId);
  const d = store.get('draft-' + STU.roundId);
  if (I.open && d && d.no) Object.assign(STU, { step: 'quiz', no: d.no, pick: d.pick ?? null });
  else if (last) Object.assign(STU, { step: 'done', no: last.no, pick: last.answers[0], result: last.result });
  else if (I.open) Object.assign(STU, { step: 'id', no: '', pick: null, result: null });
  else STU.step = 'closed';
  stuRender();
}

const lastDone = () => { const r = store.get('lastRound'); return r && store.get('last-' + r) ? r : null; };
const stuSave = () => { if (STU.step === 'quiz' || STU.step === 'confirm') store.set('draft-' + STU.roundId, { no: STU.no, pick: STU.pick }); };

      let chk = null;
      try { chk = await Promise.race([run('studentCheck', { r: STU.roundId, studentId: v }), wait(4000).then(() => null)]); } catch (e) { chk = null; }

    return;
  }
  if (STU.step === 'dupid') {
    el.innerHTML = stuBar('ห้อง ' + I.room) + `
      <main class="stu"><div class="notice wait" role="alert"><span>รหัส <b>${esc(STU.no)}</b> ส่งคำตอบข้อนี้ไปแล้ว ระบบนับเฉพาะคำตอบแรก ถ้าไม่ใช่รหัสของคุณ กรุณาแก้รหัส</span></div>
        <p class="note" style="padding:0 4px">ถ้าเป็นรหัสของคุณ ไม่ต้องตอบซ้ำ เฉลยจะแสดงเมื่อครูปิดรับคำตอบ</p></main>
      <div class="dock"><div class="two"><button class="btn-s" type="button" id="dp-go">ทำต่อ</button><button class="btn-p" type="button" id="dp-fix">แก้รหัส</button></div></div>`;
    $('#dp-fix').onclick = () => { STU.step = 'id'; store.del('draft-' + STU.roundId); stuRender(); };
    $('#dp-go').onclick = () => { STU.step = 'quiz'; stuSave(); stuRender(); };

  }
  if (STU.step === 'quiz' || STU.step === 'confirm') {
    const has = ansReady(it, STU.pick);
    const body = ansBox(it, STU.pick);
    el.innerHTML = stuBar(`ห้อง ${I.room} · รหัสนักเรียน ${STU.no}`) + `
      <main class="stu">
        <div class="meta"><span>${esc(it.exam)}${it.topic ? ' · ' + esc(it.topic) : ''}</span><button class="link" type="button" id="stu-fix">แก้ไขรหัส</button></div>

      <div class="notice">คำตอบบันทึกไว้ในเครื่องแล้ว ระบบจะส่งให้อัตโนมัติ กรุณาอย่าปิดหน้านี้</div></main>`;
    return;
  }
  if (STU.step === 'done') {
    const r = STU.result || {};
    el.innerHTML = stuBar(`ห้อง ${I.room} · รหัสนักเรียน ${STU.no}`) + `
      <main class="stu">
        <div id="stu-head">${r.dup
          ? `<div class="done-big warn"><span class="ic">${IC.alert}</span><b>คำตอบนี้ไม่นับ</b><span class="muted">รหัส ${esc(STU.no)} ส่งคำตอบข้อนี้ไปก่อนแล้ว ระบบนับเฉพาะครั้งแรก</span></div>`
          : `<div class="done-big"><span class="ic">${IC.check}</span><b>ส่งคำตอบแล้ว</b><span class="muted">คำตอบ: ${esc(ansText(it, STU.pick, it.type === 'choice'))}</span></div>`}</div>
        <div id="stu-review"><div class="notice">เฉลยจะแสดงที่หน้านี้เมื่อครูปิดรับคำตอบ</div></div>
        ${I.open ? '<div class="foot-links"><button type="button" id="stu-next">ส่งคำตอบของนักเรียนคนถัดไปด้วยเครื่องนี้</button></div>' : ''}
      </main>`;
    const nx = $('#stu-next');
    if (nx) nx.onclick = () => { Object.assign(STU, { step: 'id', no: '', pick: null, result: null, err: '' }); stuRender(); };

}

async function stuSubmit(payload) {
  const rid = STU.roundId;
  payload = payload || { roundId: rid, studentId: STU.no, answers: [STU.pick], subId: uid() };
  store.set('outbox-' + rid, payload); store.del('draft-' + rid);
  STU.step = 'sending'; STU.tries = 0; stuRender();
  for (let tries = 0; ; tries++) {
    try { STU.result = await run('studentSubmit', payload); break; }
    catch (e) {
      const m = userMsg(e);
      if (m) { store.del('outbox-' + rid); STU.err = m; STU.step = 'error'; STU.retry = () => stuLoad({ r: rid }); return stuRender(); }
      STU.tries = tries + 1; if (STU.step === 'sending') stuRender();
      await wait(Math.min(1000 * 2 ** tries, 15000));
    }
  }
  store.del('outbox-' + rid);
  store.set('last-' + rid, { no: STU.no, answers: [STU.pick], result: STU.result });
  STU.step = 'done'; stuRender();
}

async function stuLoadReview() {
  let rv = null;
  try { rv = await run('studentReview', STU.roundId); } catch (e) { /* ลองใหม่รอบหน้า */ }
  const box = $('#stu-review');
  if (!box || STU.step !== 'done') return;
  if (!rv) { STU.reviewTimer = setTimeout(stuLoadReview, 20000); return; }
  const nx = $('#stu-next'); if (nx) nx.parentElement.remove();
  const x = rv[0], mine = STU.pick, r = STU.result || {}, it = (STU.info && STU.info.items[0]) || {};
  // ส่งซ้ำ: ตัดสินจากคำตอบครั้งแรกที่ระบบนับ (เซิร์ฟเวอร์ส่งคะแนนมา ไม่ส่งตัวคำตอบ)
  const ok = r.dup && r.firstScore !== undefined ? r.firstScore > 0 : ansRight(x, mine, x.ans);
  const q = x.q || it.q, img = x.img || it.img;
  const head = $('#stu-head');
  if (head) head.innerHTML = `<div class="done-big verdict ${ok ? 'yes' : 'no'}" role="status"><span class="ic">${ok ? IC.check : IC.cross}</span>
      <b>${ok ? 'ตอบถูก' : 'ยังไม่ถูก'}</b>
      <span class="muted">${r.dup ? 'ตัดสินจากคำตอบครั้งแรกของรหัสนี้' : 'คำตอบของคุณ: ' + esc(ansText(x, mine, x.type === 'choice'))}</span></div>`;
  box.innerHTML = `<div class="rv">
    ${q ? `<span class="lab">โจทย์</span><p class="read stem">${esc(q)}</p>` : ''}${img ? `<figure><img src="${esc(img)}" alt="รูปโจทย์" referrerpolicy="no-referrer"></figure>` : ''}
    <span class="key-line">คำตอบที่ถูก: <b>${esc(ansText(x, x.ans, x.type === 'choice' || x.type === 'multi'))}</b></span>
    ${x.why ? `<span class="lab" style="margin-top:4px">คำอธิบาย</span><span class="read">${esc(x.why)}</span>` : ''}
    ${!ok && !r.dup && x.type === 'choice' && x.wrong && x.wrong[mine] ? `<span class="lab" style="margin-top:4px">ทำไม ${esc(OPT_L[Number(mine) - 1] || mine)} จึงไม่ถูก</span><span class="read">${esc(x.wrong[mine])}</span>` : ''}</div>
    <p class="sent-line">ส่งคำตอบแล้ว · รหัส ${esc(STU.no)}</p>`;
}

/* ===================== นักเรียน: แบบประเมินรวม ===================== */
const AS = { info: null, step: 'loading', no: '', room: '', i: 0, order: [], optOrder: [], answers: [], result: null, err: '' };
const blank = v => v === null || v === undefined || v === '';
const asLeft = k => !ansReady(AS.info.items[k], AS.answers[k]);   // ข้อ k (ตำแหน่งในชุด) ยังตอบไม่ครบ

async function asInit() {
  AS.step = 'loading'; asRender();
  try { AS.info = await run('assessOpen', { a: PARAMS.a }); }
  catch (e) { AS.err = failMsg(e); AS.step = 'error'; return asRender(); }
  const I = AS.info, key = 'as-' + I.id;
  const out = store.get('outbox-' + key);
  if (out) { Object.assign(AS, { no: out.studentId, room: out.room, answers: out.answers }); return asSubmit(out); }
  const last = store.get('last-' + key);
  if (last) { Object.assign(AS, { step: 'done', no: last.no, result: last.result, answers: last.answers || [], order: last.order || [] }); return asRender(); }
  if (I.phase !== 'live') { AS.step = I.phase; return asRender(); }
  const n = I.items.length, d = store.get('draft-' + key);
  if (d && d.answers && d.answers.length === n) Object.assign(AS, { step: 'quiz', no: d.no, room: d.room, i: d.i || 0, answers: d.answers, order: d.order, optOrder: d.optOrder });
  else Object.assign(AS, { step: 'id', answers: Array(n).fill(null), order: I.flags.shuffle ? shuffle(n) : [...Array(n).keys()],
    optOrder: I.items.map(it => it.type === 'choice' ? (I.flags.shuffleOpts ? shuffle(it.opts.length) : [...Array(it.opts.length).keys()]) : []) });
  asRender();
}
function shuffle(n) { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function asSave() { if (AS.step === 'quiz') store.set('draft-as-' + AS.info.id, { no: AS.no, room: AS.room, i: AS.i, answers: AS.answers, order: AS.order, optOrder: AS.optOrder }); }

function asHero() {
  const I = AS.info;
  return `<header class="as-start"><span>นอกเวลาเรียน${I.year ? ' · ปีการศึกษา ' + esc(I.year) : ''} · ${esc(I.level)}</span><b>${esc(I.title)}</b>
    ${I.closeText ? `<span class="d">ปิดรับ ${esc(I.closeText)}</span>` : ''}</header>`;
}
function asMix() {
  const I = AS.info;
  return `<div class="card mix"><div class="top"><div class="h"><b>${I.n} ข้อ</b><span class="muted" style="font-size:14px">ประมาณ ${I.minutes} นาที</span></div>
      <span class="note">ส่งได้ครั้งเดียว คำตอบบันทึกไว้ในเครื่อง ปิดหน้าแล้วกลับมาทำต่อได้</span></div>

      <main class="stu">
        <div class="prog"><div class="h" style="display:flex;justify-content:space-between;align-items:baseline">
            <b class="num" style="font-size:20px">ข้อ ${AS.i + 1} <span style="font-size:15px;color:var(--muted);font-weight:500">/ ${n}</span></b>
            <button class="link" type="button" id="q-all">ดูทุกข้อ</button></div>
          <div class="bar4" aria-hidden="true"><span style="width:${pct(answered, n)}%"></span></div>
          <div class="r"><span>ตอบแล้ว ${answered} · ข้าม ${skipped}</span></div></div>
        ${I.flags.tags && (it.exam || it.subject || it.c) ? `<div class="qtags">${it.exam ? `<span class="ctag solid">${esc(it.exam)}</span>` : ''}${it.subject ? `<span class="sj">${esc(it.subject)}</span>` : ''}${it.c ? '<span class="sep">·</span>' + cTag(it.c) : ''}</div>` : ''}
        ${it.q ? `<h1 class="sm" id="q-stem">${esc(it.q)}</h1>` : '<h1 class="sr" id="q-stem">โจทย์</h1>'}
        ${it.img ? `<figure><img src="${esc(it.img)}" alt="รูปโจทย์ข้อ ${AS.i + 1}" referrerpolicy="no-referrer"></figure>` : ''}
        ${body}
      </main>
      <div class="dock"><span class="cap left">${last ? 'ข้อสุดท้าย' : `ข้อถัดไป: ${esc(nx && nx.subject ? nx.subject : 'ข้อ ' + (AS.i + 2))}`}</span>
        <div class="two"><button class="btn-s" type="button" id="q-prev" ${AS.i === 0 ? 'disabled' : ''}>ก่อนหน้า</button>
          <button class="btn-p" type="button" id="q-next">${last ? 'ตรวจและส่ง' : 'ข้อถัดไป'}</button></div></div>`;
    $$('main [data-k], main [data-yn]', el).forEach(b => b.onclick = () => { const s = ansSel(b); AS.answers[k] = ansTap(it, AS.answers[k], b); asSave(); asRender(); const f = $('main ' + s, el); f && f.focus(); });
    const numIn = $('#q-num'); if (numIn) numIn.oninput = () => { AS.answers[k] = numIn.value.trim() || null; asSave(); };
    $('#q-prev').onclick = () => { AS.i--; asSave(); asRender(); };
    $('#q-next').onclick = () => { if (last) asConfirm(); else { AS.i++; asSave(); asRender(); } };
    $('#q-all').onclick = () => asGrid();
    return;
  }
  if (AS.step === 'sending') {
    el.innerHTML = asHero() + `<main class="pad"><div class="loading" role="status">กำลังส่งแบบประเมิน…</div>
      <div class="notice">คำตอบบันทึกไว้ในเครื่องแล้ว ระบบจะส่งให้อัตโนมัติ กรุณาอย่าปิดหน้านี้</div></main>`;
    return;
  }
  if (AS.step === 'done') {
    const r = AS.result || {};
    const hasScore = r.score !== null && r.score !== undefined;
    el.innerHTML = asHero() + `<main class="pad">
      <div class="card done-big${r.dup ? ' warn' : ''}" style="padding:22px 16px"><span class="ic">${r.dup ? IC.alert : IC.check}</span><b>${r.dup ? 'ชุดนี้ไม่นับ' : 'ส่งแบบประเมินแล้ว'}</b>
        ${hasScore ? `<span class="score">${r.score}<span style="font-size:22px;color:var(--muted);font-weight:500"> / ${r.total}</span></span><span class="muted">${r.dup ? 'คะแนนที่นับ (ส่งครั้งแรก)' : 'คะแนน'}</span>` : ''}
        <span class="note">รหัส ${esc(AS.no)}${AS.room ? ' · ห้อง ' + esc(AS.room) : ''}</span></div>
      ${r.dup ? '<div class="notice wait" role="status">รหัสนี้ส่งแบบประเมินไปก่อนแล้ว ระบบนับเฉพาะครั้งแรก เฉลยด้านล่างเทียบกับคำตอบชุดที่เพิ่งส่ง</div>' : ''}
      ${r.review ? `<h2 style="font-size:16px;padding:4px 4px 0">เฉลย</h2>${r.review.map((x, k) => {
        const mine = AS.answers[k], none = !ansReady(x, mine);
        const ok = ansRight(x, mine, x.ans), q = x.q || (I && I.items && I.items[k] && I.items[k].q);
        return `<div class="rv"><div class="h"><span>ข้อ ${AS.order.indexOf(k) + 1}</span><span class="${none ? 'mute' : ok ? 'yes' : 'no'}">${none ? 'ไม่ได้ตอบ' : ok ? 'ถูก' : 'ผิด'}</span></div>
          ${q ? `<p class="read stem">${esc(q)}</p>` : ''}
          ${none ? '' : `<span>คำตอบของคุณ: ${esc(ansText(x, mine, x.type === 'choice'))}</span>`}
          <span class="key-line">คำตอบที่ถูก: <b>${esc(ansText(x, x.ans, x.type === 'choice' || x.type === 'multi'))}</b></span>${x.why ? `<span class="read muted">${esc(x.why)}</span>` : ''}</div>`; }).join('')}` : ''}
      </main>`;
  }
}

function asGrid(onlyLeft) {
  const I = AS.info, n = I.items.length;
  const pos = [...Array(n).keys()].filter(p => !onlyLeft || asLeft(AS.order[p]));
  openSheet(sheetHead(onlyLeft ? `ยังไม่ได้ตอบ ${pos.length} ข้อ` : 'ทุกข้อ', 'ข้อที่มีสีคือข้อที่ตอบแล้ว') +
    `<div class="grid-jump">${pos.map(p => `<button type="button" data-p="${p}" class="${asLeft(AS.order[p]) ? '' : 'on'}${p === AS.i ? ' cur' : ''}">${p + 1}</button>`).join('')}</div>
    ${onlyLeft ? '' : '<button class="btn-p" type="button" id="g-send">ไปหน้าส่งคำตอบ</button>'}`, () => {
    $$('#sheet [data-p]').forEach(b => b.onclick = () => { AS.i = +b.dataset.p; closeSheet(); asSave(); asRender(); });
    const s = $('#g-send'); if (s) s.onclick = () => { closeSheet(); asConfirm(); };
  });
}

function asConfirm() {
  const n = AS.info.items.length, left = AS.answers.filter((a, k) => asLeft(k)).length;
  openSheet(sheetHead('ยืนยันการส่งแบบประเมิน', 'ส่งแล้วแก้ไขไม่ได้') +
    `<div class="notice ${left ? 'wait' : 'ok'}"><span>${left ? `ยังไม่ได้ตอบ <b>${left}</b> ข้อ จาก ${n} ข้อ` : `ตอบครบ ${n} ข้อแล้ว`}</span></div>
    ${left ? `<div class="grid-jump">${[...Array(n).keys()].filter(p => asLeft(AS.order[p])).slice(0, 40).map(p => `<button type="button" data-p="${p}">${p + 1}</button>`).join('')}</div>` : ''}
    <div class="dock" style="position:static;padding:0;border:0;background:none"><div class="two"><button class="btn-s" type="button" data-x>กลับไปแก้ไข</button><button class="btn-p" type="button" id="c-yes">ยืนยัน</button></div></div>`, () => {
    $$('#sheet [data-p]').forEach(b => b.onclick = () => { AS.i = +b.dataset.p; closeSheet(); asSave(); asRender(); });
    $('#c-yes').onclick = () => { closeSheet(); asSubmit(); };
  });
}

async function asSubmit(payload) {
  const key = 'as-' + AS.info.id;
  payload = payload || { a: PARAMS.a, studentId: AS.no, room: AS.room, answers: AS.answers, subId: uid() };
  store.set('outbox-' + key, payload); store.del('draft-' + key);
  AS.step = 'sending'; asRender();
  for (let tries = 0; ; tries++) {
    try { AS.result = await run('assessSubmit', payload); break; }
    catch (e) {
      const m = userMsg(e);
      if (m) { store.del('outbox-' + key); AS.err = m; AS.step = 'error'; return asRender(); }
      await wait(Math.min(1000 * 2 ** tries, 15000));
    }
  }
  store.del('outbox-' + key);
  store.set('last-' + key, { no: AS.no, result: AS.result, answers: AS.answers, order: AS.order });
  AS.step = 'done'; asRender();
}

/* ===================== หน้าครู: ห้องเรียนวันนี้ → เลือกข้อ → QR รับคำตอบ → ผลและรายงาน ===================== */
const T = { data: null, timer: null, page: 'home', key: '', focus: '', bank: {}, rep: {}, arm: false };
const REPORT_CHIPS = ['เฉลยหน้าห้องแล้ว', 'อธิบายตัวลวงซ้ำ', 'อินเทอร์เน็ตขัดข้อง', 'ใช้กระดาษบางส่วน'];

const allRooms = () => T.data ? T.data.rooms.concat(T.data.extra || []) : [];
const roomOf = key => allRooms().find(x => x.key === key) || null;
// ข้อความที่มีสมการ ($…$) ห้ามตัดกลางคำสั่ง ไม่งั้นแสดงเป็นโค้ด · ปล่อยเต็มแล้วให้ CSS ตัดด้วย … แทน
const short = (s, n) => { s = String(s || ''); return s.length > n && s.indexOf('$') < 0 ? s.slice(0, n - 1) + '…' : s; };

async function tInit() {
  T.page = 'home';
  await tLoad();
  clearInterval(T.timer);
  T.timer = setInterval(tTick, 6000);
}

async function tLoad(keepPage) {
  if (!T.data) $('#view-teacher').innerHTML = '<main><div class="loading">กำลังโหลดห้องเรียน…</div></main>';
  try { T.data = await api('teacherHome'); }
  catch (e) {
    if (/^LOGIN:/.test(userMsg(e) || '')) return;
    $('#view-teacher').innerHTML = `<main class="pad"><div class="notice wait" role="alert">${esc(failMsg(e))}</div></main>
      <div class="dock"><button class="btn-p" type="button" id="t-retry">ลองอีกครั้ง</button></div>`;
    $('#t-retry').onclick = () => tLoad(keepPage);
    return;
  }
  if (!keepPage) T.page = 'home';
  tRender();
}

function tRender() {
  const r = roomOf(T.key);
  if (T.page === 'pick' && r) return renderPicker();
  if (T.page === 'live' && r && r.state === 'open') return renderLive(r);
  if (T.page === 'result' && r && isDone(r)) return renderResult(r);
  T.page = 'home'; renderHome();
}

function tShow(page, key) { T.page = page; T.key = key || T.key; T.arm = false; tRender(); window.scrollTo(0, 0); }

/* ----- สถานะของห้อง: ข้อความสั้น สี และปุ่มหลัก ----- */
function roomStatus(r) {
  if (r.state === 'idle') return { cls: 'wait', text: 'ยังไม่เลือกข้อ' };
  if (r.state === 'planned') return r.item.missing ? { cls: 'bad', text: 'ไม่พบข้อที่เลือกไว้ในคลัง' } : { cls: 'info', text: 'เลือกข้อแล้ว รอเปิดรับ' };
  if (r.state === 'open') return { cls: 'ok', text: `เปิดรับอยู่ · ตอบแล้ว ${r.sent || 0}/${r.size || '?'}` };
  if (!r.report) return { cls: 'wait', text: (r.state === 'paper' ? 'แบบกระดาษ' : 'ปิดรับแล้ว') + ' · รอส่งรายงาน' };
  return { cls: 'mute', text: 'ส่งรายงานแล้ว' + (r.result && r.result.pct !== null && r.result.pct !== undefined ? ` · ถูก ${r.result.pct}%` : '') };
}
function mainAction(r) {
  if (r.state === 'idle') return { label: `เลือกข้อสอบ ${r.room}`, fn: () => openPicker(r) };
  if (r.state === 'planned') return r.item.missing ? { label: 'เลือกข้อใหม่', fn: () => openPicker(r) } : { label: `เปิดรับคำตอบ ${r.room}`, fn: b => startIn(r, b) };
  if (r.state === 'open') return { label: `ดู QR และปิดรับ ${r.room}`, fn: () => tShow('live', r.key) };
  if (!r.report) return { label: `ดูผลและส่งรายงาน ${r.room}`, fn: () => tShow('result', r.key) };
  return { label: `เลือกข้อคาบถัดไป ${r.room}`, fn: () => openPicker(r) };
}

function pickFocus(D) {
  const rooms = allRooms();
  const by = f => rooms.find(f);
  const keep = T.focus && roomOf(T.focus);
  return keep
    || by(r => r.state === 'open')
    || by(r => isDone(r) && !r.report)
    || by(r => r.state === 'planned')
    || rooms[0] || null;
}

function stepsHtml(r) {
  const st = r.state;
  const s1 = st === 'idle' ? 'now' : 'done';
  const s2 = st === 'idle' ? '' : st === 'planned' || st === 'open' ? 'now' : 'done';
  const s3 = isDone(r) ? (r.report ? 'done' : 'now') : '';
  return `<ol class="steps" aria-label="ขั้นตอน"><li class="${s1}">1 เลือกข้อสอบ</li><li class="${s2}">2 เปิดรับคำตอบ</li><li class="${s3}">3 ปิดรับและส่งรายงาน</li></ol>`;
}

function miniItem(it) {
  if (!it) return '';
  if (it.missing) return `<div class="mini"><span class="err">ไม่พบข้อ ${esc(it.id)} ในคลังข้อสอบ กรุณาเลือกข้อใหม่</span></div>`;
  return `<div class="mini"><div class="tags"><span class="ctag solid">${esc(it.exam)}</span>${cTag(it.c, 'on-white')}${diffTag(it.diff)}</div>
    <div class="q">${it.q ? esc(it.q) : 'โจทย์เป็นรูปภาพ'}</div>${it.ind || it.topic ? `<span class="note">${esc(it.ind || it.topic)}</span>` : ''}</div>`;
}

// สัปดาห์นี้ห้อง–วิชานี้นับเป็นการใช้แล้วหรือยัง (กฎเดียวกับรายงานของผู้บริหาร)
function weekLine(r) {
  const W = (T.data && T.data.weekInfo) || {}, w = r.week;
  if (!w || !r.size) return '';
  if (w.counted) return `<div class="wk ok"><b>สัปดาห์ที่ ${W.n} ผ่านเกณฑ์การใช้แล้ว</b><span>${w.paper ? 'แบบกระดาษ · ' : ''}ตอบ ${w.sent} จาก ${r.size} คน (เกณฑ์ ${w.need} คน)</span></div>`;
  return `<div class="wk"><b>สัปดาห์ที่ ${W.n}: ตอบแล้ว ${w.sent} จาก ${r.size} คน</b>
    <span>เกณฑ์ ${w.need} คน (ร้อยละ ${W.useMin} ของห้อง)${w.out ? ` · ไม่นับรหัสนอกรายชื่อห้อง ${w.out} คน` : ''}</span></div>`;
}
function weekBadge(W) {
  if (!W) return '';
  if (W.n) return W.quota ? `สัปดาห์ที่ ${W.n}` : `สัปดาห์ที่ ${W.n} · ไม่นับ`;
  if (W.before) return `เริ่มนับการใช้ ${W.before}`;
  return W.after ? 'สิ้นสุดช่วงนับแล้ว' : 'นอกช่วงนับ';
}

function focusCard(r) {
  const st = roomStatus(r);
  let body = '';
  if (r.state === 'idle') body = `<div class="mini"><span style="font-size:14px;color:var(--ink-2)">เลือกข้อสอบ 1 ข้อ แล้วเปิดให้นักเรียนตอบในคาบ</span>
      <span class="note">${r.usedCount ? `ห้องนี้ทำแล้ว ${r.usedCount} ข้อ` : 'ห้องนี้ยังไม่เคยทำข้อประจำคาบ'}</span></div>`;
  if (r.state === 'planned') body = miniItem(r.item) + `<div class="links"><button class="link" type="button" data-f="pick">เปลี่ยนข้อ</button><button class="link" type="button" data-f="more">ตัวเลือกอื่น</button></div>`;
  if (r.state === 'open') body = miniItem(r.item) + `<div class="count"><div class="r"><span>ตอบแล้ว</span><span><b class="num">${r.sent || 0}</b> / ${r.size || '?'} คน</span></div>
      <div class="track"><span style="width:${pct(r.sent || 0, r.size)}%"></span></div>
      <span class="note">รหัสห้อง <b class="num">${fmtCode(r.code)}</b> · ${r.mode === 'นอกคาบ' ? 'ทำนอกคาบ ' : ''}ปิดรับอัตโนมัติ ${esc(r.mode === 'นอกคาบ' ? r.deadline : r.deadlineHm + ' น.')}</span></div>
      <div class="links"><button class="link" type="button" data-f="fs">ฉายเต็มจอ</button><button class="link mute" type="button" data-f="paper">บันทึกแบบกระดาษ</button></div>`;
  if (isDone(r)) {
    const res = r.result || {};
    body = miniItem(r.item) + `<div class="count"><div class="r"><span>${r.state === 'paper' ? 'แบบกระดาษ · ' : ''}ตอบถูก</span><span><b class="num">${res.pct ?? '—'}${res.pct !== null && res.pct !== undefined ? '%' : ''}</b> จาก ${res.n || 0} คน</span></div></div>
      ${r.report ? `<div class="links"><button class="link" type="button" data-f="result">ดูผลและรายงานที่ส่ง</button></div>` : ''}`;
  }
  const when = r.extra ? `รอบ${r.day ? ' ' + r.day : 'ก่อนหน้า'}` : '';
  return `<section class="card focus" id="t-focus" tabindex="-1" aria-label="ห้องที่ต้องทำต่อ ${esc(r.room)} ${esc(r.subject)}">
    <div class="focus-head"><div class="t"><span><b>${esc(r.room)}</b>${r.extra ? '<span class="now-tag warn">ค้างรายงาน</span>' : ''}</span>
      <span class="sub">${esc(r.subject)}${when ? ' · ' + esc(when) : ''}</span></div><span class="st ${st.cls}">${esc(st.text.split(' · ')[0])}</span></div>
    ${body}${r.extra ? '' : weekLine(r)}${stepsHtml(r)}</section>`;
}

function roomRow(r) {
  const st = roomStatus(r);
  const when = r.extra && r.day ? `ปิดรับ${r.day}` : '';
  return `<button class="row" type="button" data-row="${esc(r.key)}"><span class="t"><b>${esc(r.room)} <small>${esc(r.subject)}</small></b>
      <span class="${st.cls}">${esc(st.text)}${when ? `<span class="muted"> · ${esc(when)}</span>` : ''}${r.week && r.week.counted && !r.extra ? '<span class="muted"> · ผ่านเกณฑ์สัปดาห์นี้</span>' : ''}</span></span>${IC.chev}</button>`;
}

function homeroomCard(h) {
  return `<article class="bubble"><div class="body"><span class="k">แบบประเมินรวม · ครูประจำชั้น ${esc(h.room)}</span>
      <span class="h">${esc(h.title)}</span>
      <span class="d">${h.n} ข้อ ประมาณ ${h.minutes} นาที · ${h.phase === 'live' ? (h.closeShort ? 'ปิดรับ ' + esc(h.closeShort) : 'เปิดรับอยู่') : 'เปิดให้ทำ ' + esc(h.openText)}</span>
      <span class="n">ทำแล้ว <b>${h.done}</b> / ${h.size || '?'} คน</span><div class="track"><span style="width:${pct(h.done, h.size)}%"></span></div></div>
    <a class="ba" href="${esc(lineShare(h.share))}" target="_blank" rel="noopener">ส่งต่อเข้ากลุ่ม LINE ห้อง</a>
    ${h.phase === 'live' ? `<a class="ba sub" href="${esc(lineShare(h.remind))}" target="_blank" rel="noopener">ส่งข้อความเตือนพร้อมยอดห้อง</a>` : ''}
    <button class="ba sub" type="button" data-copy="${esc(h.link)}">คัดลอกลิงก์</button></article>`;
}

function renderHome() {
  const D = T.data, el = $('#view-teacher');
  const subjects = [...new Set(D.rooms.map(r => r.subject))].join(' · ');
  const f = pickFocus(D);
  T.focus = f ? f.key : '';
  const rest = allRooms().filter(r => r !== f);
  // ไม่ผูกเวลา: ห้องที่ต้องทำต่อขึ้นก่อน (เปิดรับอยู่ › ค้างรายงาน › เลือกข้อไว้แล้ว) ที่เหลือเรียงตามชื่อห้อง
  const rank = r => r.state === 'open' ? 0 : (isDone(r) && !r.report) ? 1 : r.state === 'planned' ? 2 : 3;
  rest.sort((a, b) => rank(a) - rank(b) || a.room.localeCompare(b.room, 'th', { numeric: true }));
  const act = f ? mainAction(f) : null;
  el.innerHTML = `
    <header class="hero"><div class="hero-top"><div class="who"><span>${esc(D.teacher.name)}${subjects ? ' · ' + esc(subjects) : ''}</span><b>${esc(D.today)}</b></div>
        <div class="side"><span>${esc(weekBadge(D.weekInfo) || (D.week ? 'สัปดาห์ที่ ' + D.week : ''))}</span><button type="button" id="t-menu" aria-haspopup="dialog">เมนู</button></div></div>
      <div class="stats" role="group" aria-label="สรุปห้องที่สอน"><div><span>ห้องที่สอน</span><b>${D.roomCount}</b></div><div><span>รอเลือกข้อ</span><b>${D.unpicked}</b></div><div><span>รอส่งรายงาน</span><b>${D.owe}</b></div></div></header>
    <main class="pad">
      ${!D.rooms.length && !(D.extra || []).length ? `<div class="card empty">ไม่พบห้องที่สอนในชีตครูผู้สอน<br>กรุณาแจ้งผู้ดูแลระบบ (รหัสครู ${esc(D.teacher.tid)})</div>` : ''}
      ${f ? focusCard(f) : ''}

// ตัวเลือกกำหนดปิดนอกคาบ (ตรงกับ nextAt_ ใน Code.gs): ครั้งถัดไปของวันนั้นหลังเวลาปัจจุบัน เรียงตามวันที่ ค่าเริ่มต้นคือวันศุกร์
const TH_DAY = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const TH_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
function nextAt(dow, h, m) {
  const now = new Date();
  for (let i = 0; i < 8; i++) { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, h, m); if (d.getDay() === dow && d > now) return d; }
  return new Date(now.getTime() + 7 * 864e5);
}
function dlOptions() {
  const now = new Date();
  return [['thu', 4, 16, 30], ['fri', 5, 16, 30], ['sun', 0, 20, 0]].map(([v, dow, h, m]) => ({ v, d: nextAt(dow, h, m) }))
    .sort((a, b) => a.d - b.d)
    .map(({ v, d }) => `<option value="${v}"${v === 'fri' ? ' selected' : ''}>${d.toDateString() === now.toDateString() ? 'วันนี้' : 'วัน' + TH_DAY[d.getDay()] + 'ที่ ' + d.getDate() + ' ' + TH_MON[d.getMonth()]} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} น.</option>`).join('');
}

    <button class="btn-p" type="button" id="go">เปิดรับนอกคาบ</button>`, () => {

/* ----- หน้าเลือกข้อสอบ: 1 ประเภท → 2 วิชา → 3 เรื่อง → 4 แตะเลือกข้อ ----- */
const P = { d: null, exam: '', subject: '', topic: '', sel: '' };
const ALL_EXAMS = ['O-NET', 'A-Level', 'TGAT', 'TPAT'];
const subjectsOf = ex => [...new Set(P.d.items.filter(i => i.exam === ex).map(i => i.subject))];

async function openPicker(r) {
  T.key = r.key; T.page = 'pick'; P.d = T.bank[r.key] || null; P.sel = '';
  const el = $('#view-teacher');
  el.innerHTML = pickBar(r) + '<main><div class="loading">กำลังโหลดคลังข้อสอบ…</div></main>';
  $('#pk-back').onclick = () => tShow('home');
  window.scrollTo(0, 0);
  if (!P.d) {
    try { P.d = T.bank[r.key] = await api('bankBrowse', r.room, r.subject); }
    catch (e) { el.querySelector('main').innerHTML = `<div class="pad"><div class="notice wait" role="alert">${esc(failMsg(e))}</div></div>`; return; }
  }
  if (T.page !== 'pick' || T.key !== r.key) return;
  const items = P.d.items;
  // เปิดที่ประเภทข้อสอบที่มีวิชาของห้องนี้ก่อน (ม.6 มีหลายสนาม วิชาอาจอยู่ใน A-Level/TPAT ไม่ใช่ O-NET)
  P.exam = P.d.exams.find(x => items.some(i => i.exam === x && i.subject === r.subject))
    || P.d.exams.find(x => items.some(i => i.exam === x)) || P.d.exams[0];
  const subs = subjectsOf(P.exam);
  P.subject = subs.indexOf(r.subject) >= 0 ? r.subject : subs[0] || '';
  P.topic = '';
  if (r.state === 'planned' && r.item && !r.item.missing && items.some(i => i.id === r.item.id)) {
    P.exam = r.item.exam; P.subject = r.item.subject; P.topic = r.item.topic; P.sel = r.item.id;
  }
  renderPicker();
}

function pickBar(r) {
  return `<header class="bar"><button class="ibtn" type="button" id="pk-back" aria-label="กลับหน้าห้องเรียน">${IC.back}</button>
    <div class="t"><b>เลือกข้อสอบ</b><span>${esc(r.room)} · ${esc(r.subject)}</span></div></header>`;
}

function renderPicker() {
  const r = roomOf(T.key), d = P.d, el = $('#view-teacher');
  if (!r || !d) return tShow('home');
  const keepY = window.scrollY;
  const inSub = d.items.filter(i => i.exam === P.exam && i.subject === P.subject);
  const topics = [...new Set(inSub.map(i => i.topic))];
  const list = inSub.filter(i => !P.topic || i.topic === P.topic).sort((a, b) => (a.used ? 1 : 0) - (b.used ? 1 : 0));
  const subs = subjectsOf(P.exam);
  const sel = d.items.find(i => i.id === P.sel);
  el.innerHTML = pickBar(r) + `
    <div class="filters">
      <div class="fgroup"><span class="lab" id="lab-exam">1 · ประเภทข้อสอบ</span>
        <div class="exams" role="radiogroup" aria-labelledby="lab-exam">${ALL_EXAMS.map(x => {
          const ok = d.exams.indexOf(x) >= 0;
          return `<button type="button" role="radio" data-exam="${x}" aria-checked="${P.exam === x}"${ok ? '' : ' aria-disabled="true"'}>${x}</button>`; }).join('')}</div>
        ${d.exams.length < ALL_EXAMS.length ? '<span class="hint">A-Level, TGAT และ TPAT ใช้ได้เฉพาะ ม.6</span>' : ''}</div>
      <div class="fgroup"><span class="lab" id="lab-sub">2 · วิชา</span>
        ${subs.length ? `<div class="chips scroll" role="radiogroup" aria-labelledby="lab-sub">${subs.map(s => `<button type="button" class="chip" role="radio" data-sub="${esc(s)}" aria-checked="${P.subject === s}">${esc(s)}</button>`).join('')}</div>`
          : '<span class="hint">ไม่มีข้อสอบประเภทนี้สำหรับระดับชั้นนี้</span>'}</div>
      ${inSub.length ? `<div class="fgroup"><label class="lab" for="pk-topic">3 · เรื่อง</label>
        <div class="selectbox"><span class="v">${esc(P.topic || 'ทุกเรื่อง')}</span><span class="n">${(P.topic ? inSub.filter(i => i.topic === P.topic) : inSub).length} ข้อ</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          <select id="pk-topic"><option value="">ทุกเรื่อง (${inSub.length} ข้อ)</option>${topics.map(t => `<option value="${esc(t)}" ${P.topic === t ? 'selected' : ''}>${esc(t)} (${inSub.filter(i => i.topic === t).length} ข้อ)</option>`).join('')}</select></div></div>` : ''}
    </div>
    <main class="pad">
      <span class="sec-label" id="lab-list">4 · เลือกข้อ</span>
      ${list.length ? `<div class="qlist" role="radiogroup" aria-labelledby="lab-list">${list.map(pickItemHtml).join('')}</div>` : '<div class="card empty">ไม่มีข้อสอบในหมวดนี้</div>'}
    </main>
    <div class="dock">
      <button class="btn-p" type="button" id="pk-go" ${sel ? '' : 'disabled'}>ใช้ข้อนี้และเปิดรับคำตอบ</button>
      <span class="cap"><button class="link" type="button" id="pk-more" ${sel ? '' : 'disabled'} style="font-size:14px">ตัวเลือกอื่น</button></span>
      <span class="err" id="pk-err" role="alert" style="text-align:center"></span></div>`;
  $('#pk-back').onclick = () => tShow('home');
  $$('[data-exam]', el).forEach(b => b.onclick = () => {
    if (b.getAttribute('aria-disabled') === 'true') return toast(`${d.level} เลือกได้เฉพาะ ${d.exams.join(', ')}`);
    P.exam = b.dataset.exam; P.subject = subjectsOf(P.exam)[0] || ''; P.topic = ''; P.sel = ''; renderPicker();
  });
  $$('[data-sub]', el).forEach(b => b.onclick = () => { P.subject = b.dataset.sub; P.topic = ''; P.sel = ''; renderPicker(); });
  const tp = $('#pk-topic'); if (tp) tp.onchange = () => { P.topic = tp.value; P.sel = ''; renderPicker(); };
  $$('[data-item]', el).forEach(b => b.onclick = () => { P.sel = P.sel === b.dataset.item ? '' : b.dataset.item; renderPicker(); const x = $(`[data-item="${CSS.escape(b.dataset.item)}"]`); x && x.focus(); });
  $('#pk-go').onclick = e => pickStart(r, P.sel, 'in', '', e.currentTarget);
  $('#pk-more').onclick = () => moreSheet(r, P.sel);
  window.scrollTo(0, keepY);
}

function pickItemHtml(it) {
  const on = P.sel === it.id, o = it.others;
  const others = o && o.rooms ? `ห้องอื่นใช้แล้ว ${o.rooms} ห้อง${o.pct !== null ? ` · ตอบถูกเฉลี่ย ${o.pct}%` : ''}` : 'ยังไม่มีห้องอื่นใช้';
  return `<button type="button" class="qi" role="radio" aria-checked="${on}" data-item="${esc(it.id)}">
    <span class="h">${cTag(it.c, on ? 'on-white' : '')}${diffTag(it.diff)}${it.used ? `<span class="foot"><span class="wait">ห้องนี้ทำแล้ว ${esc(it.used)}</span></span>` : ''}<span class="radio"></span></span>
    ${on && it.img ? `<img src="${esc(it.img)}" alt="รูปโจทย์" referrerpolicy="no-referrer">` : ''}
    <span class="stem"${on ? '' : ' style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden"'}>${it.q ? esc(it.q) : 'โจทย์เป็นรูปภาพ'}</span>

    ${on && it.why ? `<span class="foot read">${esc(it.why)}</span>` : ''}

async function pickOnly(r, itemId, btn) {
  if (!itemId) return;

  T.focus = r.key; await tLoad();

async function pickStart(r, itemId, mode, dl, btn) {
  if (!itemId) return;

  catch (e) { btn.disabled = false; btn.textContent = t0; ($('#pk-err') || {}).textContent = failMsg(e); if (!$('#pk-err')) toast(failMsg(e)); return; }

  await tLoad(true); tShow('live', r.key);

/* ----- หน้า QR รับคำตอบ ----- */
// ก่อนยืนยันปิดรับ: เตือนถ้าจำนวนที่ตอบในสัปดาห์นี้ยังไม่ถึงเกณฑ์นับเป็นการใช้ (เตือนเฉยๆ ปิดได้ตามปกติ)
function closeShort(r) {
  const w = r.week, W = (T.data && T.data.weekInfo) || {};
  if (!w || w.counted || !w.need || !r.size) return '';
  const sent = Math.max(w.sent || 0, r.sent || 0);
  if (sent >= w.need) return '';
  return `ตอบแล้ว <b>${sent}/${r.size}</b> คน (${pct(sent, r.size)}%) ยังไม่ถึงเกณฑ์นับเป็นการใช้ ${w.need} คน (ร้อยละ ${esc(W.useMin || 50)}) ถ้าปิดตอนนี้สัปดาห์นี้จะยังไม่นับ`;
}
function renderLive(r) {

  const scr = `ลิงก์หน้าฉาย QR ห้อง ${r.room}\n${r.screenLink}`;
  el.innerHTML = `<header class="bar"><button class="ibtn" type="button" id="lv-back" aria-label="กลับหน้าห้องเรียน">${IC.back}</button>
      <div class="t"><b>${esc(r.room)} · ${esc(r.subject)}</b><span>${r.mode === 'นอกคาบ' ? 'ทำนอกคาบ' : 'ข้อประจำคาบ'}${it.c ? ' · ' + esc(it.c) + ' ' + esc(C_TXT[it.c] || '') : ''}</span></div>
      <span class="end st ok">เปิดรับคำตอบ</span></header>
    <main class="live">
      <div class="qrbox" id="lv-qr" aria-label="QR Code สำหรับนักเรียนสแกน"></div>

        <div class="track"><span id="lv-bar" style="width:${pct(r.sent || 0, r.size)}%"></span></div></div>
      <div class="acts3"><button type="button" id="lv-fs">${IC.expand}ฉายเต็มจอ</button>
        <a href="${esc(lineShare(msg))}" target="_blank" rel="noopener">${IC.chat}ส่งเข้ากลุ่ม LINE</a>
        <a href="${esc(lineShare(scr))}" target="_blank" rel="noopener">${IC.screen}ส่งลิงก์ฉายจอ</a></div>
      <div class="foot-links"><button type="button" id="lv-copy-scr">คัดลอกลิงก์ฉายจอ (เปิดในคอมห้องเรียน)</button><button type="button" id="lv-paper">บันทึกแบบกระดาษแทน</button></div>

    <div class="dock"><button class="btn-p${T.arm ? ' arm' : ''}" type="button" id="lv-close">${T.arm ? 'กดอีกครั้งเพื่อยืนยัน' : 'ปิดรับคำตอบ'}</button>
      ${T.arm && closeShort(r) ? `<div class="notice wait" role="status"><span>${closeShort(r)}</span></div>` : ''}
      <span class="cap" aria-live="polite">${T.arm ? 'เมื่อปิดรับแล้ว นักเรียนจะส่งคำตอบไม่ได้และจะเห็นเฉลย' : `ปิดรับอัตโนมัติ ${esc(r.mode === 'นอกคาบ' ? r.deadline : r.deadlineHm + ' น.')}`}</span>
      <span class="err" id="lv-err" role="alert" style="text-align:center"></span></div>`;
  drawQr($('#lv-qr'), r.link, 600);
  $('#lv-back').onclick = () => tShow('home');

  $('#lv-close').onclick = async e => {

/* ----- หน้าผลคาบและรายงาน ----- */
function renderResult(r) {
  const el = $('#view-teacher'), it = r.item || {}, res = r.result || {};
  const rp = T.rep[r.key] || (T.rep[r.key] = {
    c: (r.report && r.report.c) || '', chips: new Set(r.report && r.report.chips ? r.report.chips.split(' · ') : []),
    note: (r.report && r.report.note) || '', editing: !r.report
  });
  let stats = '';
  if (res.paper) stats = `<div class="big"><b>${res.pct ?? '—'}${res.pct !== null && res.pct !== undefined ? '%' : ''}</b><span>ตอบถูก ${res.ok} จาก ${res.n} คน · แบบกระดาษ</span></div>`;
  else if (!res.n) stats = '<div class="notice">ไม่มีนักเรียนส่งคำตอบในรอบนี้</div>';
  else {
    stats = `<div class="big"><b>${res.pct}%</b><span>ตอบถูก ${res.ok} จาก ${res.n} คน</span></div>`;
    if (res.dist) {
      const hot = res.top && res.top.pct >= 15 && res.top.n >= 3 ? res.top.k : 0;
      stats += `<div class="dist" aria-label="จำนวนที่เลือกแต่ละตัวเลือก">${res.dist.map((v, j) => {
        const key = isKey(it, j), cls = key ? 'key' : (j + 1 === hot ? 'hot' : '');
        return `<div class="r"><span class="l${key ? ' key' : ''}" title="${esc(it.opts[j])}">${OPT_L[j]} ${esc(short(it.opts[j], 10))}${key ? ' ✓' : ''}</span>
          <span class="b"><span class="${cls}" style="width:${pct(v, res.n)}%"></span></span><span class="n">${v} คน</span></div>`; }).join('')}</div>`;
      if (hot) stats += `<p class="warnline">${res.top.n} คนเลือก ${OPT_L[hot - 1]} (${esc(short(it.opts[hot - 1], 24))})${res.top.why ? ' ซึ่ง' + esc(res.top.why) : ''} ควรอธิบายเพิ่มเติม</p>`;
      if (it.type === 'multi') stats += `<p class="note">ต้องเลือกให้ครบ ${esc(ansText(it, it.ans))} จึงนับว่าถูก</p>`;
    } else if (res.parts) {
      stats += `<div class="dist" aria-label="ร้อยละที่ตอบถูกแต่ละข้อความ">${res.parts.map((v, j) => {
        const p = pct(v, res.n);
        return `<div class="r"><span class="l" title="${esc(it.opts[j])}">${j + 1}) ${esc(short(it.opts[j], 9))}</span>
          <span class="b"><span class="${p >= 50 ? 'key' : 'hot'}" style="width:${p}%"></span></span><span class="n">ถูก ${p}%</span></div>`; }).join('')}</div>
        <p class="note">เฉลย: ${esc(ansText(it, it.ans))} · นับว่าถูกเมื่อตอบถูกทุกข้อความ</p>`;
    } else if (it.type === 'order') {
      stats += `<p class="note">ลำดับที่ถูก: <b>${esc(ansText(it, it.ans))}</b>${res.blank ? ` · ไม่ตอบ ${res.blank} คน` : ''}</p>`;
      if (res.seq && res.seq.n >= 3) stats += `<p class="warnline">${res.seq.n} คนเรียงเป็น ${esc(ansText(it, res.seq.ans))} ควรอธิบายเพิ่มเติม</p>`;
    } else if (it.type === 'number') stats += `<p class="note">คำตอบที่ถูก: <b>${esc(it.ans)}</b>${res.blank ? ` · ไม่ตอบ ${res.blank} คน` : ''}</p>`;
    if (res.pct < 50 && !(res.top && res.top.pct >= 15 && res.top.n >= 3)) stats += '<p class="warnline">ตอบถูกต่ำกว่าร้อยละ 50 ควรอธิบายเพิ่มเติม</p>';
  }
  const repHtml = !rp.editing && r.report ? `
    <div class="sent-box"><div class="h"><span class="st ok">ส่งรายงานแล้ว${r.report.at ? ' · ' + esc(r.report.at) : ''}</span><button class="link" type="button" id="rp-edit">แก้ไข</button></div>
      <div class="mini" style="background:none;padding:0;gap:6px"><div class="tags">${cTag(r.report.c, 'on-white')}${r.report.chips ? r.report.chips.split(' · ').map(c => `<span class="note">· ${esc(c)}</span>`).join('') : ''}</div></div>
      ${r.report.note ? `<p>${esc(r.report.note)}</p>` : ''}</div>`
    : `<div class="lv-head"><span id="lab-lv">ระดับที่ใช้สอน</span>${rp.c ? `<b>${esc(rp.c + ' ' + C_TXT[rp.c])}</b>` : '<b class="none">ยังไม่ได้เลือก</b>'}</div>
      ${it.c && C_TXT[it.c] ? `<p class="note" style="margin:-4px 0 0">ระดับในคลังข้อสอบ: ${esc(it.c)}</p>` : ''}
      <div class="levels" role="radiogroup" aria-labelledby="lab-lv">${Object.keys(C_TXT).map(c => `<button type="button" role="radio" aria-checked="${rp.c === c}" data-c="${c}" aria-label="${c} ${C_TXT[c]}">${c}<small>${C_TXT[c]}</small></button>`).join('')}</div>
      <div class="chips" role="group" aria-label="ตัวเลือกด่วน">${REPORT_CHIPS.map(c => `<button type="button" class="chip" aria-pressed="${rp.chips.has(c)}" data-chip="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <textarea class="memo" id="rp-note" rows="1" maxlength="300" aria-label="บันทึกเพิ่มเติม" placeholder="บันทึกเพิ่มเติม (ถ้ามี)">${esc(rp.note)}</textarea>
      <span class="err" id="rp-err" role="alert"></span>`;
  el.innerHTML = `<header class="bar"><button class="ibtn" type="button" id="rs-back" aria-label="กลับหน้าห้องเรียน">${IC.back}</button>
      <div class="t"><b>${esc(r.room)} · ผลคาบ</b><span>${esc(r.subject)}${r.day ? ' · ' + esc(r.day) : ''}</span></div>
      <span class="end st mute">${r.state === 'paper' ? 'แบบกระดาษ' : r.auto ? 'ปิดรับอัตโนมัติ' : 'ปิดรับแล้ว'}</span></header>
    <main class="result">
      <section style="display:flex;flex-direction:column;gap:12px">
        <div class="meta">${cTag(it.c, 'solid')}<span>${[it.exam, it.ind || it.topic, it.diff].filter(Boolean).map(esc).join(' · ')}</span></div>
        ${it.missing ? `<span class="err">ไม่พบข้อ ${esc(it.id)} ในคลังข้อสอบ</span>` : ''}
        ${it.q ? `<p class="stem">${esc(it.q)}</p>` : ''}${it.img ? `<img class="stem-img" src="${esc(it.img)}" alt="รูปโจทย์" referrerpolicy="no-referrer">` : ''}
      </section>
      <section style="display:flex;flex-direction:column;gap:14px">${stats}
        ${it.why ? `<p class="note read">คำอธิบาย: ${esc(it.why)}</p>` : ''}</section>
      <section class="report"><h2>รายงานคาบ</h2>${repHtml}</section>
    </main>
    <div class="dock">${!rp.editing && r.report ? '<button class="btn-p" type="button" id="rs-home">กลับหน้าห้องเรียน</button>' : '<button class="btn-p" type="button" id="rp-send">ส่งรายงาน</button>'}</div>`;
  $('#rs-back').onclick = () => tShow('home');
  const home = $('#rs-home'); if (home) home.onclick = () => tShow('home');
  const ed = $('#rp-edit'); if (ed) ed.onclick = () => { rp.editing = true; renderResult(r); };
  $$('[data-c]', el).forEach(b => b.onclick = () => { rp.c = b.dataset.c; renderResult(r); $(`[data-c="${rp.c}"]`).focus(); });
  $$('[data-chip]', el).forEach(b => b.onclick = () => { const v = b.dataset.chip; rp.chips.has(v) ? rp.chips.delete(v) : rp.chips.add(v); b.setAttribute('aria-pressed', rp.chips.has(v)); });
  const note = $('#rp-note');
  if (note) { const fit = () => { note.style.height = 'auto'; note.style.height = note.scrollHeight + 2 + 'px'; }; note.oninput = () => { rp.note = note.value; fit(); }; fit(); }
  const send = $('#rp-send');
  if (send) send.onclick = async () => {
    if (!rp.c) { $('#rp-err').textContent = 'กรุณาเลือกระดับที่ใช้สอน'; return; }
    send.disabled = true; send.textContent = 'กำลังส่ง…';
    try { await api('saveReport', r.roundId, rp.c, [...rp.chips], rp.note.trim()); }
    catch (e) { send.disabled = false; send.textContent = 'ส่งรายงาน'; $('#rp-err').textContent = failMsg(e); return; }
    delete T.rep[r.key];
    toast('ส่งรายงานคาบแล้ว');
    const extra = r.extra;
    await tLoad(true);
    if (extra || !roomOf(r.key)) tShow('home'); else tShow('result', r.key);
  };
}

/* ----- อัปเดตยอดตอบทุก 6 วินาที (เฉพาะรอบที่เปิดรับ) ----- */
async function tTick() {
  if (document.hidden || $('#view-teacher').hidden || !T.data) return;
  const open = allRooms().filter(x => x.state === 'open' && x.roundId);
  if (!open.length) return;
  let counts;
  try { counts = await api('liveCounts', open.map(x => x.roundId)); } catch (e) { return; }
  let changed = false;
  for (const r of open) {
    const n = counts[r.roundId] ?? r.sent;
    if (!$('#fs').hidden && $('#fs').dataset.key === r.key && $('#fs-count')) $('#fs-count').textContent = n;
    if (n === r.sent) continue;
    r.sent = n; changed = true;
    if (T.page === 'live' && T.key === r.key && $('#lv-n')) { $('#lv-n').textContent = n; $('#lv-bar').style.width = pct(n, r.size) + '%'; }
  }
  if (changed && T.page === 'home' && $('#scrim').hidden) { const y = window.scrollY; renderHome(); window.scrollTo(0, y); }
}

/* ----- QR เต็มจอ (ฉายขึ้นจอในห้องเรียน) ----- */
// ที่อยู่เว็บแบบสั้นสำหรับพิมพ์เอง (ไม่มี https:// และพารามิเตอร์) · เปิดแล้วเจอช่องกรอกรหัสห้อง
const typeUrl = link => { try { const u = new URL(link); return (u.host + u.pathname).replace(/\/$/, ''); } catch (e) { return ''; } };
const fsHow = link => { const u = typeUrl(link);
  return `<span class="fs-how">สแกน QR Code หรือเข้าเว็บ</span>${u ? `<span class="fs-url">${esc(u).replace(/\//g, '/<wbr>')}</span><span class="fs-how">แล้วกรอกรหัสห้อง</span>` : ''}`; };

function openFs(r) {
  const fs = $('#fs');
  closeSheet();
  fs.dataset.key = r.key;
  fs.innerHTML = `
    <div class="fs-top"><h2>${esc(r.subject)} · ข้อประจำคาบ</h2><button class="btn" type="button" id="fs-x">ปิด (Esc)</button></div>
    <div class="fs-main">${r.item && r.item.q ? `<p class="fs-q">${esc(r.item.q)}</p>` : ''}<div class="fs-qr" id="fs-qr"></div>
      <div class="fs-side"><span class="fs-room">ห้อง ${esc(r.room)}</span>
        ${fsHow(r.link)}<span class="fs-code">${fmtCode(r.code)}</span>
        <span class="fs-count">ตอบแล้ว <b id="fs-count">${r.sent || 0}</b> จาก ${r.size || '?'} คน</span></div></div>
    <p class="fs-foot">ใช้ได้เฉพาะห้อง ${esc(r.room)}</p>`;
  fs.hidden = false;
  drawQr($('#fs-qr'), r.link);
  $('#fs-x').onclick = closeFs; $('#fs-x').focus();
  try { fs.requestFullscreen && fs.requestFullscreen().catch(() => {}); } catch (e) {}
}
function closeFs() {
  const fs = $('#fs'); fs.hidden = true; fs.innerHTML = ''; delete fs.dataset.key;
  try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {}
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && !$('#fs').hidden && !PARAMS.screen) closeFs(); });

const A = { page: 'week', ov: null, ovP: null, level: '', d: null, cfg: null, dirty: false, armClose: false };
const DB = { d: null, level: '', subject: 'all' };
const U = { cache: {}, level: 'all', scope: 'week', q: '', subj: 'all', exam: 'all', low: false };
const PHASE = { draft: ['mute', 'ร่าง'], scheduled: ['info', 'ตั้งเวลาไว้'], live: ['ok', 'ประกาศแล้ว · เปิดรับอยู่'], closed: ['mute', 'ปิดรับแล้ว'], none: ['mute', 'ยังไม่สร้าง'] };

const READY_FIX = { 'ครูผู้สอน': 'timetable', 'ห้องเรียน': 'rooms', 'ปฏิทินสัปดาห์': 'weeks', 'คลังข้อสอบ': 'bank', 'รหัสผ่านครู': 'teachers', 'ครูประจำชั้น': 'teachers', 'รายชื่อนักเรียน': 'students' };

function adNav() {
