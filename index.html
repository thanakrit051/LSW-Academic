        <span class="note">ไม่พบรหัส ${esc(AS.no)} ในรายชื่อของโรงเรียน เลือกห้องเพื่อให้ครูประจำชั้นนับยอดได้</span>
        ${AS.err ? `<span class="err" role="alert">${esc(AS.err)}</span>` : ''}</div></main>
      <div class="dock"><div class="two"><button class="btn-s" type="button" id="as-back">แก้รหัส</button><button class="btn-p" type="button" id="as-go">เริ่มทำ</button></div></div>`;
    $('#as-back').onclick = () => { AS.step = 'id'; AS.err = ''; asRender(); };
    $('#as-go').onclick = () => { const r = $('#as-room').value; if (!r) { AS.err = 'เลือกห้องก่อน'; return asRender(); } AS.room = r; AS.err = ''; AS.step = 'quiz'; asSave(); asRender(); };
    return;
  }
  const n = I.items ? I.items.length : 0;
  if (AS.step === 'quiz') {
    const k = AS.order[AS.i], it = I.items[k], pick = AS.answers[k], last = AS.i === n - 1;
    const answered = AS.answers.filter(a => !blank(a)).length;
    const skipped = AS.order.slice(0, AS.i).filter(x => blank(AS.answers[x])).length;
    const nx = !last ? I.items[AS.order[AS.i + 1]] : null;
    const body = it.type === 'number'
      ? `<div class="field"><label for="q-num">คำตอบ (ตัวเลข)</label><input id="q-num" class="input id-in" inputmode="decimal" autocomplete="off" maxlength="20" value="${esc(pick ?? '')}" placeholder="พิมพ์ตัวเลข"></div>`
      : `<div class="opts${it.opts.some(o => o.length > 40) ? ' long' : ''}" role="radiogroup" aria-labelledby="q-stem">${AS.optOrder[k].map((j, p) => `<button type="button" class="opt" role="radio" aria-checked="${String(pick) === String(j + 1)}" data-k="${j + 1}"><span class="dot"></span><span class="k">${OPT_L[p]}</span><span class="v">${esc(it.opts[j])}</span></button>`).join('')}</div>`;
    el.innerHTML = `<header class="bar"><div class="t"><b>${esc(I.title)}</b><span>รหัส ${esc(AS.no)} · ห้อง ${esc(AS.room)}</span></div></header>
      <main class="stu">
        <div class="prog"><div class="h" style="display:flex;justify-content:space-between;align-items:baseline">
            <b class="num" style="font-size:20px">ข้อ ${AS.i + 1} <span style="font-size:15px;color:var(--muted);font-weight:500">/ ${n}</span></b>
            <button class="link" type="button" id="q-all">ดูทุกข้อ</button></div>
          <div class="bar4" aria-hidden="true"><span style="width:${pct(answered, n)}%"></span></div>
          <div class="r"><span>ตอบแล้ว ${answered} · ข้าม ${skipped}</span><span>บันทึกในเครื่องแล้ว</span></div></div>
        ${I.flags.tags && (it.exam || it.subject || it.c) ? `<div class="qtags">${it.exam ? `<span class="ctag solid">${esc(it.exam)}</span>` : ''}${it.subject ? `<span class="sj">${esc(it.subject)}</span>` : ''}${it.c ? '<span class="sep">·</span>' + cTag(it.c) : ''}</div>` : ''}
        ${it.q ? `<h1 class="sm" id="q-stem">${esc(it.q)}</h1>` : '<h1 class="sr" id="q-stem">โจทย์</h1>'}
        ${it.img ? `<figure><img src="${esc(it.img)}" alt="รูปโจทย์ข้อ ${AS.i + 1}" referrerpolicy="no-referrer"></figure>` : ''}
        ${body}
      </main>
      <div class="dock"><span class="cap left">${last ? 'ข้อสุดท้าย · ตรวจแล้วกดส่ง' : `ข้อถัดไป: ${esc(nx && nx.subject ? nx.subject : 'ข้อ ' + (AS.i + 2))}`}</span>
        <div class="two"><button class="btn-s" type="button" id="q-prev" ${AS.i === 0 ? 'disabled' : ''}>ก่อนหน้า</button>
          <button class="btn-p" type="button" id="q-next">${last ? 'ตรวจและส่ง' : 'ข้อถัดไป'}</button></div></div>`;
    $$('.opt', el).forEach(b => b.onclick = () => { AS.answers[k] = b.dataset.k; asSave(); asRender(); $(`.opt[data-k="${b.dataset.k}"]`).focus(); });
    const numIn = $('#q-num'); if (numIn) numIn.oninput = () => { AS.answers[k] = numIn.value.trim() || null; asSave(); };
    $('#q-prev').onclick = () => { AS.i--; asSave(); asRender(); };
    $('#q-next').onclick = () => { if (last) asConfirm(); else { AS.i++; asSave(); asRender(); } };
    $('#q-all').onclick = () => asGrid();
    return;
  }
  if (AS.step === 'sending') {
    el.innerHTML = asHero() + `<main class="pad"><div class="loading" role="status">กำลังส่งแบบประเมิน…</div>
      <div class="notice">บันทึกคำตอบไว้ในเครื่องแล้ว ถ้าอินเทอร์เน็ตช้า ระบบจะส่งซ้ำเองจนสำเร็จ ไม่ต้องทำใหม่</div></main>`;
    return;
  }
  if (AS.step === 'done') {
    const r = AS.result || {};
    const hasScore = r.score !== null && r.score !== undefined;
    el.innerHTML = asHero() + `<main class="pad">
      <div class="card done-big" style="padding:22px 16px"><span class="ic">${IC.check}</span><b>ส่งแบบประเมินแล้ว</b>
        ${hasScore ? `<span class="score">${r.score}<span style="font-size:22px;color:var(--muted);font-weight:500"> / ${r.total}</span></span><span class="muted">คะแนนของคุณ</span>` : '<span class="muted">ขอบคุณที่ตั้งใจทำ</span>'}
        <span class="note">รหัส ${esc(AS.no)}${AS.room ? ' · ห้อง ' + esc(AS.room) : ''}</span></div>
      ${r.dup ? '<div class="notice wait" role="status">รหัสนี้เคยส่งแล้ว ระบบนับเฉพาะครั้งแรก ถ้ากรอกรหัสผิด แจ้งครูประจำชั้น</div>' : ''}
      ${r.review && I && I.items ? `<h2 style="font-size:16px;padding:4px 4px 0">เฉลย</h2>${r.review.map((x, k) => {
        const mine = AS.answers[k];
        const ok = !blank(mine) && (x.type === 'number' ? Number(String(mine).replace(/,/g, '')) === Number(String(x.ans).replace(/,/g, '')) : String(mine) === String(x.ans));
        return `<div class="rv"><div class="h"><span>ข้อ ${AS.order.indexOf(k) + 1}</span><span class="${ok ? 'yes' : 'no'}">${ok ? 'ถูก' : 'ผิด'}</span></div>
          <span>คำตอบที่ถูก: ${x.type === 'number' ? esc(x.ans) : esc(x.opts[Number(x.ans) - 1] ?? '')}</span>${x.why ? `<span class="read muted">${esc(x.why)}</span>` : ''}</div>`; }).join('')}` : ''}
      </main>`;
  }
}

function asGrid(onlyLeft) {
  const I = AS.info, n = I.items.length;
  const pos = [...Array(n).keys()].filter(p => !onlyLeft || blank(AS.answers[AS.order[p]]));
  openSheet(sheetHead(onlyLeft ? `ยังไม่ได้ตอบ ${pos.length} ข้อ` : 'ทุกข้อ', 'แตะเลขข้อเพื่อไปที่ข้อนั้น · สีฟ้าคือตอบแล้ว') +
    `<div class="grid-jump">${pos.map(p => `<button type="button" data-p="${p}" class="${blank(AS.answers[AS.order[p]]) ? '' : 'on'}${p === AS.i ? ' cur' : ''}">${p + 1}</button>`).join('')}</div>
    ${onlyLeft ? '' : '<button class="btn-p" type="button" id="g-send">ไปหน้าส่งคำตอบ</button>'}`, () => {
    $$('#sheet [data-p]').forEach(b => b.onclick = () => { AS.i = +b.dataset.p; closeSheet(); asSave(); asRender(); });
    const s = $('#g-send'); if (s) s.onclick = () => { closeSheet(); asConfirm(); };
  });
}

function asConfirm() {
  const n = AS.info.items.length, left = AS.answers.filter(blank).length;
  openSheet(sheetHead('ส่งแบบประเมิน?', 'ส่งได้ครั้งเดียว ส่งแล้วแก้ไม่ได้') +
    `<div class="notice ${left ? 'wait' : 'ok'}"><span>${left ? `ยังไม่ได้ตอบ <b>${left}</b> ข้อ จาก ${n} ข้อ` : `ตอบครบ ${n} ข้อแล้ว`}</span></div>
    ${left ? `<div class="grid-jump">${[...Array(n).keys()].filter(p => blank(AS.answers[AS.order[p]])).slice(0, 40).map(p => `<button type="button" data-p="${p}">${p + 1}</button>`).join('')}</div>` : ''}
    <div class="dock" style="position:static;padding:0;border:0;background:none"><div class="two"><button class="btn-s" type="button" data-x>ทำต่อ</button><button class="btn-p" type="button" id="c-yes">ยืนยันส่ง</button></div></div>`, () => {
    $$('#sheet [data-p]').forEach(b => b.onclick = () => { AS.i = +b.dataset.p; closeSheet(); asSave(); asRender(); });
    $('#c-yes').onclick = () => { closeSheet(); asSubmit(); };
  });
}

async function asSubmit(payload) {
  const key = 'as-' + AS.info.id;
  payload = payload || { a: PARAMS.a, studentId: AS.no, room: AS.room, answers: AS.answers, subId: uid() };
  store.set('outbox-' + key, payload); store.del('draft-' + key);
  AS.step = 'sending'; asRender();
  for (let tries = 0; ; tries++) {
    try { AS.result = await run('assessSubmit', payload); break; }
    catch (e) {
      const m = userMsg(e);
      if (m) { store.del('outbox-' + key); AS.err = m; AS.step = 'error'; return asRender(); }
      await wait(Math.min(1000 * 2 ** tries, 15000));
    }
  }
  store.del('outbox-' + key);
  store.set('last-' + key, { no: AS.no, result: AS.result, answers: AS.answers, order: AS.order });
  AS.step = 'done'; asRender();
}

/* ===================== หน้าครู: ห้องเรียนวันนี้ → เลือกข้อ → QR รับคำตอบ → ผลและรายงาน ===================== */
const T = { data: null, timer: null, page: 'home', key: '', focus: '', bank: {}, rep: {}, arm: false };
const REPORT_CHIPS = ['เฉลยหน้าห้องแล้ว', 'อธิบายตัวลวงซ้ำ', 'เน็ตมีปัญหา', 'ใช้กระดาษบางส่วน'];

const allRooms = () => T.data ? T.data.rooms.concat(T.data.extra || []) : [];
const roomOf = key => allRooms().find(x => x.key === key) || null;
const short = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

async function tInit() {
  T.page = 'home';
  await tLoad();
  clearInterval(T.timer);
  T.timer = setInterval(tTick, 6000);
}

async function tLoad(keepPage) {
  if (!T.data) $('#view-teacher').innerHTML = '<main><div class="loading">กำลังโหลดห้องเรียน…</div></main>';
  try { T.data = await api('teacherHome'); }
  catch (e) {
    if (/^LOGIN:/.test(userMsg(e) || '')) return;
    $('#view-teacher').innerHTML = `<main class="pad"><div class="notice wait" role="alert">${esc(failMsg(e))}</div></main>
      <div class="dock"><button class="btn-p" type="button" id="t-retry">ลองใหม่</button></div>`;
    $('#t-retry').onclick = () => tLoad(keepPage);
    return;
  }
  if (!keepPage) T.page = 'home';
  tRender();
}

function tRender() {
  const r = roomOf(T.key);
  if (T.page === 'pick' && r) return renderPicker();
  if (T.page === 'live' && r && r.state === 'open') return renderLive(r);
  if (T.page === 'result' && r && isDone(r)) return renderResult(r);
  T.page = 'home'; renderHome();
}

function tShow(page, key) { T.page = page; T.key = key || T.key; T.arm = false; tRender(); window.scrollTo(0, 0); }

/* ----- สถานะของห้อง: ข้อความสั้น สี และปุ่มหลัก ----- */
function roomStatus(r) {
  if (r.state === 'idle') return { cls: 'wait', text: 'ยังไม่เลือกข้อ' };
  if (r.state === 'planned') return r.item.missing ? { cls: 'bad', text: 'ไม่พบข้อที่เลือกไว้ในคลัง' } : { cls: 'info', text: 'เลือกข้อแล้ว รอเปิดรับ' };
  if (r.state === 'open') return { cls: 'ok', text: `เปิดรับอยู่ · ตอบแล้ว ${r.sent || 0}/${r.size || '?'}` };
  if (!r.report) return { cls: 'wait', text: (r.state === 'paper' ? 'แบบกระดาษ' : 'ปิดรับแล้ว') + ' · รอส่งรายงาน' };
  return { cls: 'mute', text: 'ส่งรายงานแล้ว' + (r.result && r.result.pct !== null && r.result.pct !== undefined ? ` · ถูก ${r.result.pct}%` : '') };
}
function mainAction(r) {
  if (r.state === 'idle') return { label: `เลือกข้อสอบ ${r.room}`, fn: () => openPicker(r) };
  if (r.state === 'planned') return r.item.missing ? { label: 'เลือกข้อใหม่', fn: () => openPicker(r) } : { label: `เปิดรับคำตอบ ${r.room}`, fn: b => startIn(r, b) };
  if (r.state === 'open') return { label: 'ดู QR และปิดรับ', fn: () => tShow('live', r.key) };
  if (!r.report) return { label: 'ดูผลและส่งรายงาน', fn: () => tShow('result', r.key) };
  return { label: `เลือกข้อสำหรับคาบถัดไป`, fn: () => openPicker(r) };
}

function pickFocus(D) {
  const rooms = allRooms();
  const by = f => rooms.find(f);
  const keep = T.focus && roomOf(T.focus);
  return keep
    || by(r => r.state === 'open')
    || by(r => isDone(r) && !r.report)
    || by(r => r.state === 'planned')
    || rooms[0] || null;
}

function stepsHtml(r) {
  const st = r.state;
  const s1 = st === 'idle' ? 'now' : 'done';
  const s2 = st === 'idle' ? '' : st === 'planned' || st === 'open' ? 'now' : 'done';
  const s3 = isDone(r) ? (r.report ? 'done' : 'now') : '';
  return `<ol class="steps" aria-label="ขั้นตอน"><li class="${s1}">1 เลือกข้อสอบ</li><li class="${s2}">2 ขึ้น QR รับคำตอบ</li><li class="${s3}">3 ปิดรับ ส่งรายงาน</li></ol>`;
}

function miniItem(it) {
  if (!it) return '';
  if (it.missing) return `<div class="mini"><span class="err">ไม่พบข้อ ${esc(it.id)} ในคลังข้อสอบแล้ว เลือกข้อใหม่</span></div>`;
  return `<div class="mini"><div class="tags"><span class="ctag solid">${esc(it.exam)}</span>${cTag(it.c, 'on-white')}${diffTag(it.diff)}</div>
    <div class="q">${it.q ? esc(it.q) : 'โจทย์เป็นรูปภาพ'}</div>${it.ind || it.topic ? `<span class="note">${esc(it.ind || it.topic)}</span>` : ''}</div>`;
}

// สัปดาห์นี้ห้อง–วิชานี้นับเป็นการใช้แล้วหรือยัง (กฎเดียวกับรายงานของผู้บริหาร)
function weekLine(r) {
  const W = (T.data && T.data.weekInfo) || {}, w = r.week;
  if (!w || !r.size) return '';
  if (w.counted) return `<div class="wk ok"><b>สัปดาห์ที่ ${W.n} นับเป็นการใช้แล้ว</b><span>${w.paper ? 'แบบกระดาษ · ' : ''}ตอบ ${w.sent} จาก ${r.size} คน (เกณฑ์ ${w.need} คน)</span></div>`;
  return `<div class="wk"><b>สัปดาห์ที่ ${W.n}: ตอบแล้ว ${w.sent} จาก ${r.size} คน</b>
    <span>ต้องถึง ${w.need} คน (ร้อยละ ${W.useMin} ของห้อง) จึงนับเป็นการใช้ของสัปดาห์นี้${w.out ? ` · รหัสที่ไม่อยู่ในรายชื่อห้อง ${w.out} คน ไม่นับ` : ''}</span></div>`;
}
function weekBadge(W) {
  if (!W) return '';
  if (W.n) return W.quota ? `สัปดาห์ที่ ${W.n}` : `สัปดาห์ที่ ${W.n} · ไม่นับ`;
  if (W.before) return `เริ่มนับ ${W.before}`;
  return W.after ? 'จบช่วงนับแล้ว' : 'นอกช่วงนับ';
}

function focusCard(r) {
  const st = roomStatus(r);
  let body = '';
  if (r.state === 'idle') body = `<div class="mini"><span style="font-size:14px;color:var(--ink-2)">ยังไม่ได้เลือกข้อ</span>
      <span class="note">${r.usedCount ? `ห้องนี้ทำไปแล้ว ${r.usedCount} ข้อ ข้อที่ยังไม่เคยทำจะขึ้นก่อน` : 'ห้องนี้ยังไม่เคยทำข้อประจำคาบ'}</span></div>`;
  if (r.state === 'planned') body = miniItem(r.item) + `<div class="links"><button class="link" type="button" data-f="pick">เปลี่ยนข้อ</button><button class="link" type="button" data-f="more">ตัวเลือกอื่น</button></div>`;
  if (r.state === 'open') body = miniItem(r.item) + `<div class="count"><div class="r"><span>ตอบแล้ว</span><span><b class="num">${r.sent || 0}</b> / ${r.size || '?'} คน</span></div>
      <div class="track"><span style="width:${pct(r.sent || 0, r.size)}%"></span></div>
      <span class="note">รหัสห้อง <b class="num">${fmtCode(r.code)}</b> · ${r.mode === 'นอกคาบ' ? 'ทำนอกคาบ ' : ''}ปิดรับเอง ${esc(r.mode === 'นอกคาบ' ? r.deadline : r.deadlineHm + ' น.')}</span></div>
      <div class="links"><button class="link" type="button" data-f="fs">ฉายเต็มจอ</button><button class="link mute" type="button" data-f="paper">เน็ตล่ม บันทึกแบบกระดาษ</button></div>`;
  if (isDone(r)) {
    const res = r.result || {};
    body = miniItem(r.item) + `<div class="count"><div class="r"><span>${r.state === 'paper' ? 'แบบกระดาษ · ' : ''}ตอบถูก</span><span><b class="num">${res.pct ?? '—'}${res.pct !== null && res.pct !== undefined ? '%' : ''}</b> จาก ${res.n || 0} คน</span></div></div>
      ${r.report ? `<div class="links"><button class="link" type="button" data-f="result">ดูผลและรายงานที่ส่ง</button></div>` : ''}`;
  }
  const when = r.extra ? `รอบ${r.day ? ' ' + r.day : 'ก่อนหน้า'}` : '';
  return `<section class="card focus" aria-label="ห้องที่ต้องทำต่อ">
    <div class="focus-head"><div class="t"><span><b>${esc(r.room)}</b>${r.extra ? '<span class="now-tag warn">ค้างรายงาน</span>' : ''}</span>
      <span class="sub">${esc(r.subject)}${when ? ' · ' + esc(when) : ''}</span></div><span class="st ${st.cls}">${esc(st.text.split(' · ')[0])}</span></div>
    ${body}${r.extra ? '' : weekLine(r)}${stepsHtml(r)}</section>`;
}

function roomRow(r) {
  const st = roomStatus(r);
  const when = r.extra && r.day ? `ปิดรับ${r.day}` : '';
  return `<button class="row" type="button" data-row="${esc(r.key)}"><span class="t"><b>${esc(r.room)} <small>${esc(r.subject)}</small></b>
      <span class="${st.cls}">${esc(st.text)}${when ? `<span class="muted"> · ${esc(when)}</span>` : ''}${r.week && r.week.counted && !r.extra ? '<span class="muted"> · สัปดาห์นี้นับแล้ว</span>' : ''}</span></span>${IC.chev}</button>`;
}

function homeroomCard(h) {
  return `<article class="bubble"><div class="body"><span class="k">แบบประเมินรวม · ครูประจำชั้น ${esc(h.room)}</span>
      <span class="h">${esc(h.title)}</span>
      <span class="d">${h.n} ข้อ ราว ${h.minutes} นาที · ${h.phase === 'live' ? (h.closeShort ? 'ปิดรับ ' + esc(h.closeShort) : 'เปิดรับอยู่') : 'เปิดให้ทำ ' + esc(h.openText)}</span>
      <span class="n">ทำแล้ว <b>${h.done}</b> / ${h.size || '?'} คน</span><div class="track"><span style="width:${pct(h.done, h.size)}%"></span></div></div>
    <a class="ba" href="${esc(lineShare(h.share))}" target="_blank" rel="noopener">ส่งต่อเข้ากลุ่ม LINE ห้อง</a>
    ${h.phase === 'live' ? `<a class="ba sub" href="${esc(lineShare(h.remind))}" target="_blank" rel="noopener">ส่งข้อความเตือนพร้อมยอดห้อง</a>` : ''}
    <button class="ba sub" type="button" data-copy="${esc(h.link)}">คัดลอกลิงก์</button></article>`;
}

function renderHome() {
  const D = T.data, el = $('#view-teacher');
  const subjects = [...new Set(D.rooms.map(r => r.subject))].join(' · ');
  const f = pickFocus(D);
  T.focus = f ? f.key : '';
  const rest = allRooms().filter(r => r !== f);
  // ไม่ผูกเวลา: ห้องที่ต้องทำต่อขึ้นก่อน (เปิดรับอยู่ › ค้างรายงาน › เลือกข้อไว้แล้ว) ที่เหลือเรียงตามชื่อห้อง
  const rank = r => r.state === 'open' ? 0 : (isDone(r) && !r.report) ? 1 : r.state === 'planned' ? 2 : 3;
  rest.sort((a, b) => rank(a) - rank(b) || a.room.localeCompare(b.room, 'th', { numeric: true }));
  const act = f ? mainAction(f) : null;
  el.innerHTML = `
    <header class="hero"><div class="hero-top"><div class="who"><span>${esc(D.teacher.name)}${subjects ? ' · ' + esc(subjects) : ''}</span><b>${esc(D.today)}</b></div>
        <div class="side"><span>${esc(weekBadge(D.weekInfo) || (D.week ? 'สัปดาห์ที่ ' + D.week : ''))}</span><button type="button" id="t-menu" aria-haspopup="dialog">เมนู</button></div></div>
      <div class="stats" role="group" aria-label="สรุปห้องที่สอน"><div><span>ห้องที่สอน</span><b>${D.roomCount}</b></div><div><span>รอเลือกข้อ</span><b>${D.unpicked}</b></div><div><span>รอส่งรายงาน</span><b>${D.owe}</b></div></div></header>
    <main class="pad">
      ${!D.rooms.length && !(D.extra || []).length ? `<div class="card empty">ยังไม่พบห้องที่คุณสอนในชีตครูผู้สอน<br>แจ้งผู้ดูแลระบบให้เพิ่มแถวที่มีรหัสครู ${esc(D.teacher.tid)}</div>` : ''}
      ${f ? focusCard(f) : ''}
      ${rest.length ? `<h2 class="sec-label">ห้องอื่นที่สอน</h2><div class="card rows">${rest.map(roomRow).join('')}</div>` : ''}
      ${(D.homeroom || []).length ? `<h2 class="sec-label">ห้องที่คุณเป็นครูประจำชั้น</h2>${D.homeroom.map(homeroomCard).join('')}` : ''}
    </main>
    ${act ? `<div class="dock"><button class="btn-p" type="button" id="t-main">${esc(act.label)}</button></div>` : ''}`;
  $('#t-menu').onclick = teacherMenu;
  if (act) $('#t-main').onclick = e => act.fn(e.currentTarget);
  $$('[data-row]', el).forEach(b => b.onclick = () => { T.focus = b.dataset.row; renderHome(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  $$('[data-copy]', el).forEach(b => b.onclick = () => copyText(b.dataset.copy, 'คัดลอกลิงก์แล้ว'));
  $$('[data-f]', el).forEach(b => b.onclick = () => {
    const a = b.dataset.f;
    if (a === 'pick') openPicker(f);
    if (a === 'more') moreSheet(f);
    if (a === 'fs') openFs(f);
    if (a === 'paper') paperSheet(f);
    if (a === 'result') tShow('result', f.key);
  });
}

function teacherMenu() {
  openSheet(sheetHead(T.data.teacher.name, [T.data.teacher.role, ME.school].filter(Boolean).join(' · ')) +
    `<div class="list"><button type="button" id="m-reload">โหลดข้อมูลใหม่<small>ดึงห้องที่สอนและยอดคำตอบล่าสุด</small></button>
      ${ME.canDash ? '<button type="button" id="m-admin">หน้าผู้ดูแล<small>ภาพรวมข้อมูล แบบประเมินรวม รายงานการใช้</small></button>' : ''}
      <button type="button" id="m-out" class="red">ออกจากระบบ</button></div>`, () => {
    $('#m-reload').onclick = () => { closeSheet(); tLoad(); };
    const a = $('#m-admin'); if (a) a.onclick = () => { closeSheet(); startAdmin(); };
    $('#m-out').onclick = () => { closeSheet(); doLogout(); };
  });
}

/* ----- เริ่มรับคำตอบในคาบจากข้อที่เลือกไว้ ----- */
async function startIn(r, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'กำลังเปิดรับ…'; }
  try { await api('startRound', r.roundId, 'in', ''); }
  catch (e) { if (btn) { btn.disabled = false; btn.textContent = mainAction(r).label; } toast(failMsg(e)); return; }
  await tLoad(true);
  tShow('live', r.key);
}

/* ----- ตัวเลือกอื่น: ทำนอกคาบ / กระดาษ / ยกเลิก (สำหรับข้อที่เลือกไว้แล้ว หรือข้อที่กำลังเลือกในหน้าเลือกข้อ) ----- */
function moreSheet(r, itemId) {
  const fromPicker = !!itemId;
  openSheet(sheetHead('ตัวเลือกอื่น', `${r.room} · ${r.subject}`) + `<div class="list">
      ${fromPicker ? '<button type="button" data-m="keep">เลือกข้อนี้ไว้ก่อน<small>ยังไม่เปิดรับ กดเปิดรับจากหน้าห้องเรียนเมื่อพร้อม</small></button>' : ''}
      <button type="button" data-m="out">ทำนอกคาบ<small>ส่งลิงก์เข้ากลุ่ม LINE ห้อง ระบบปิดรับเองตามกำหนด</small></button>
      <button type="button" data-m="paper">บันทึกแบบกระดาษ<small>อินเทอร์เน็ตใช้ไม่ได้ เขียนข้อบนกระดาน แล้วนับจำนวนที่ตอบถูก</small></button>
      ${!fromPicker && r.state === 'planned' ? '<button type="button" data-m="cancel" class="red">ยกเลิกข้อที่เลือกไว้</button>' : ''}</div>`, () => {
    $$('#sheet [data-m]').forEach(b => b.onclick = () => {
      const m = b.dataset.m;
      if (m === 'keep') return pickOnly(r, itemId, b);
      if (m === 'now') return pickStart(r, itemId, 'in', '', b);
      if (m === 'out') return outSheet(r, itemId);
      if (m === 'paper') return paperSheet(r, itemId);
      if (m === 'cancel') return cancelSheet(r);
    });
  });
}

function outSheet(r, itemId) {
  openSheet(sheetHead('ทำนอกคาบ', `${r.room} · ${r.subject}`) + `
    <p class="note">ระบบสร้างลิงก์ให้ส่งเข้ากลุ่ม LINE ห้องเรียน นักเรียนเข้าทำด้วยรหัสนักเรียน และปิดรับเองเมื่อครบกำหนด</p>
    <div class="field"><label for="dl">ปิดรับอัตโนมัติ</label>
      <select id="dl" class="input"><option value="fri">วันศุกร์ 16:30 น.</option><option value="thu">วันพฤหัสบดี 16:30 น.</option><option value="sun">วันอาทิตย์ 20:00 น.</option></select></div>
    <span class="err" id="go-err" role="alert"></span>
    <button class="btn-p" type="button" id="go">เปิดรับนอกคาบ</button>`, () => {
    $('#go').onclick = async () => {
      const b = $('#go'); b.disabled = true; b.textContent = 'กำลังเปิดรับ…';
      try {
        if (itemId) await api('pickAndStart', r.room, r.subject, itemId, 'out', $('#dl').value);
        else await api('startRound', r.roundId, 'out', $('#dl').value);
      } catch (e) { $('#go-err').textContent = failMsg(e); b.disabled = false; b.textContent = 'เปิดรับนอกคาบ'; return; }
      closeSheet(); delete T.bank[r.key];
      await tLoad(true); tShow('live', r.key);
    };
  });
}

function paperSheet(r, itemId) {
  openSheet(sheetHead('บันทึกแบบกระดาษ', `${r.room} · ${r.subject} · ใช้เมื่ออินเทอร์เน็ตใช้ไม่ได้`) + `
    <p class="note">เขียนข้อบนกระดาน ให้นักเรียนตอบในสมุด แล้วนับจำนวน${r.state === 'open' ? ' · ระบบจะปิดรับออนไลน์ของรอบนี้ และใช้ตัวเลขจากกระดาษแทน' : ''}</p>
    <div class="field"><label for="p-n">จำนวนนักเรียนที่ทำ</label><input id="p-n" class="input num" inputmode="numeric" placeholder="จาก ${r.size || '?'} คน"></div>
    <div class="field"><label for="p-k">จำนวนที่ตอบถูก</label><input id="p-k" class="input num" inputmode="numeric" placeholder="เช่น 21"></div>
    <span class="err" id="p-err" role="alert"></span>
    <p class="note">นับเป็นการใช้ของสัปดาห์เมื่อจำนวนนักเรียนที่ทำถึงร้อยละ ${esc((T.data && T.data.weekInfo && T.data.weekInfo.useMin) || 50)} ของห้อง เหมือนแบบออนไลน์ · รายงานติดป้าย "แบบกระดาษ" และหัวหน้ากลุ่มสาระสุ่มตรวจ</p>
    <button class="btn-p" type="button" id="go">บันทึก</button>`, () => {
    $('#go').onclick = async () => {
      const n = +$('#p-n').value, k = +$('#p-k').value;
      if (!Number.isInteger(n) || n < 1 || (r.size && n > r.size)) return $('#p-err').textContent = `จำนวนนักเรียนต้องเป็น 1–${r.size || 'จำนวนในห้อง'}`;
      if ($('#p-k').value.trim() === '' || !Number.isInteger(k) || k < 0 || k > n) return $('#p-err').textContent = `จำนวนที่ตอบถูกต้องอยู่ระหว่าง 0–${n}`;
      const b = $('#go'); b.disabled = true;
      try {
        const rid = itemId ? (await api('pickItem', r.room, r.subject, itemId)).roundId : r.roundId;
        await api('savePaper', rid, n, k);
      } catch (e) { $('#p-err').textContent = failMsg(e); b.disabled = false; return; }
      closeSheet(); delete T.bank[r.key];
      await tLoad(true); tShow('result', r.key);
    };
  });
}

function cancelSheet(r) {
  openSheet(sheetHead('ยกเลิกข้อที่เลือกไว้?', `${r.room} · ${r.subject}`) + miniItem(r.item) + `
    <span class="err" id="go-err" role="alert"></span>
    <div class="dock" style="position:static;padding:0;border:0;background:none"><div class="two"><button class="btn-s" type="button" data-x>ไม่ยกเลิก</button><button class="btn-p arm" type="button" id="go">ยกเลิกข้อนี้</button></div></div>`, () => {
    $('#go').onclick = async () => {
      $('#go').disabled = true;
      try { await api('cancelPick', r.roundId); } catch (e) { $('#go-err').textContent = failMsg(e); $('#go').disabled = false; return; }
      closeSheet(); await tLoad();
    };
  });
}

/* ----- หน้าเลือกข้อสอบ: 1 ประเภท → 2 วิชา → 3 เรื่อง → 4 แตะเลือกข้อ ----- */
const P = { d: null, exam: '', subject: '', topic: '', sel: '' };
const ALL_EXAMS = ['O-NET', 'A-Level', 'TGAT', 'TPAT'];
const subjectsOf = ex => [...new Set(P.d.items.filter(i => i.exam === ex).map(i => i.subject))];

async function openPicker(r) {
  T.key = r.key; T.page = 'pick'; P.d = T.bank[r.key] || null; P.sel = '';
  const el = $('#view-teacher');
  el.innerHTML = pickBar(r) + '<main><div class="loading">กำลังโหลดคลังข้อสอบ…</div></main>';
  $('#pk-back').onclick = () => tShow('home');
  window.scrollTo(0, 0);
  if (!P.d) {
    try { P.d = T.bank[r.key] = await api('bankBrowse', r.room, r.subject); }
    catch (e) { el.querySelector('main').innerHTML = `<div class="pad"><div class="notice wait" role="alert">${esc(failMsg(e))}</div></div>`; return; }
  }
  if (T.page !== 'pick' || T.key !== r.key) return;
  const items = P.d.items;
  // เปิดที่ประเภทข้อสอบที่มีวิชาของห้องนี้ก่อน (ม.6 มีหลายสนาม วิชาอาจอยู่ใน A-Level/TPAT ไม่ใช่ O-NET)
  P.exam = P.d.exams.find(x => items.some(i => i.exam === x && i.subject === r.subject))
    || P.d.exams.find(x => items.some(i => i.exam === x)) || P.d.exams[0];
  const subs = subjectsOf(P.exam);
  P.subject = subs.indexOf(r.subject) >= 0 ? r.subject : subs[0] || '';
  P.topic = '';
  if (r.state === 'planned' && r.item && !r.item.missing && items.some(i => i.id === r.item.id)) {
    P.exam = r.item.exam; P.subject = r.item.subject; P.topic = r.item.topic; P.sel = r.item.id;
  }
  renderPicker();
}

function pickBar(r) {
  return `<header class="bar"><button class="ibtn" type="button" id="pk-back" aria-label="กลับหน้าห้องเรียน">${IC.back}</button>
    <div class="t"><b>เลือกข้อสอบ</b><span>${esc(r.room)} · ${esc(r.subject)}</span></div></header>`;
}

function renderPicker() {
  const r = roomOf(T.key), d = P.d, el = $('#view-teacher');
  if (!r || !d) return tShow('home');
  const keepY = window.scrollY;
  const inSub = d.items.filter(i => i.exam === P.exam && i.subject === P.subject);
  const topics = [...new Set(inSub.map(i => i.topic))];
  const list = inSub.filter(i => !P.topic || i.topic === P.topic).sort((a, b) => (a.used ? 1 : 0) - (b.used ? 1 : 0));
  const subs = subjectsOf(P.exam);
  const sel = d.items.find(i => i.id === P.sel);
  el.innerHTML = pickBar(r) + `
    <div class="filters">
      <div class="fgroup"><span class="lab" id="lab-exam">1 · ประเภทข้อสอบ</span>
        <div class="exams" role="radiogroup" aria-labelledby="lab-exam">${ALL_EXAMS.map(x => {
          const ok = d.exams.indexOf(x) >= 0;
          return `<button type="button" role="radio" data-exam="${x}" aria-checked="${P.exam === x}"${ok ? '' : ' aria-disabled="true"'}>${x}</button>`; }).join('')}</div>
        ${d.exams.length < ALL_EXAMS.length ? `<span class="hint">${esc(d.level)} ใช้ O-NET · A-Level TGAT TPAT ใช้ได้เฉพาะ ม.6</span>` : ''}</div>
      <div class="fgroup"><span class="lab" id="lab-sub">2 · วิชา</span>
        ${subs.length ? `<div class="chips scroll" role="radiogroup" aria-labelledby="lab-sub">${subs.map(s => `<button type="button" class="chip" role="radio" data-sub="${esc(s)}" aria-checked="${P.subject === s}">${esc(s)}</button>`).join('')}</div>`
          : '<span class="hint">คลังยังไม่มีข้อสอบประเภทนี้ของระดับชั้นนี้</span>'}</div>
      ${inSub.length ? `<div class="fgroup"><label class="lab" for="pk-topic">3 · เรื่อง</label>
        <div class="selectbox"><span class="v">${esc(P.topic || 'ทุกเรื่อง')}</span><span class="n">${(P.topic ? inSub.filter(i => i.topic === P.topic) : inSub).length} ข้อ</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          <select id="pk-topic"><option value="">ทุกเรื่อง (${inSub.length} ข้อ)</option>${topics.map(t => `<option value="${esc(t)}" ${P.topic === t ? 'selected' : ''}>${esc(t)} (${inSub.filter(i => i.topic === t).length} ข้อ)</option>`).join('')}</select></div></div>` : ''}
    </div>
    <main class="pad">
      <span class="sec-label" id="lab-list">4 · แตะเลือกข้อ <span style="font-weight:400;color:var(--muted)">· ข้อที่ห้องนี้ยังไม่เคยทำขึ้นก่อน</span></span>
      ${list.length ? `<div class="qlist" role="radiogroup" aria-labelledby="lab-list">${list.map(pickItemHtml).join('')}</div>` : '<div class="card empty">ยังไม่มีข้อในหมวดนี้</div>'}
    </main>
    <div class="dock">
      <button class="btn-p" type="button" id="pk-go" ${sel ? '' : 'disabled'}>ใช้ข้อนี้ แล้วเปิดรับคำตอบ</button>
      <span class="cap">ระบบเปิดรับและขึ้น QR ทันที · <button class="link" type="button" id="pk-more" ${sel ? '' : 'disabled'} style="font-size:12px">ตัวเลือกอื่น</button></span>
      <span class="err" id="pk-err" role="alert" style="text-align:center"></span></div>`;
  $('#pk-back').onclick = () => tShow('home');
  $$('[data-exam]', el).forEach(b => b.onclick = () => {
    if (b.getAttribute('aria-disabled') === 'true') return toast(`${d.level} เลือกได้เฉพาะ ${d.exams.join(', ')}`);
    P.exam = b.dataset.exam; P.subject = subjectsOf(P.exam)[0] || ''; P.topic = ''; P.sel = ''; renderPicker();
  });
  $$('[data-sub]', el).forEach(b => b.onclick = () => { P.subject = b.dataset.sub; P.topic = ''; P.sel = ''; renderPicker(); });
  const tp = $('#pk-topic'); if (tp) tp.onchange = () => { P.topic = tp.value; P.sel = ''; renderPicker(); };
  $$('[data-item]', el).forEach(b => b.onclick = () => { P.sel = P.sel === b.dataset.item ? '' : b.dataset.item; renderPicker(); const x = $(`[data-item="${CSS.escape(b.dataset.item)}"]`); x && x.focus(); });
  $('#pk-go').onclick = e => pickStart(r, P.sel, 'in', '', e.currentTarget);
  $('#pk-more').onclick = () => moreSheet(r, P.sel);
  window.scrollTo(0, keepY);
}

function pickItemHtml(it) {
  const on = P.sel === it.id, o = it.others;
  const others = o && o.rooms ? `ห้องอื่นใช้แล้ว ${o.rooms} ห้อง${o.pct !== null ? ` · ตอบถูกเฉลี่ย ${o.pct}%` : ''}` : 'ยังไม่มีห้องอื่นใช้';
  return `<button type="button" class="qi" role="radio" aria-checked="${on}" data-item="${esc(it.id)}">
    <span class="h">${cTag(it.c, on ? 'on-white' : '')}${diffTag(it.diff)}${it.used ? `<span class="foot"><span class="wait">ห้องนี้ทำแล้ว ${esc(it.used)}</span></span>` : ''}<span class="radio"></span></span>
    ${on && it.img ? `<img src="${esc(it.img)}" alt="รูปโจทย์" referrerpolicy="no-referrer">` : ''}
    <span class="stem"${on ? '' : ' style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden"'}>${it.q ? esc(it.q) : 'โจทย์เป็นรูปภาพ'}</span>
    ${on ? (it.type === 'number' ? `<span class="ans one"><span class="key">เติมคำตอบเป็นตัวเลข · เฉลย ${esc(it.ans)}</span></span>`
      : `<span class="ans${it.opts.some(x => x.length > 28) ? ' one' : ''}">${it.opts.map((x, j) => `<span class="${String(j + 1) === String(it.ans) ? 'key' : ''}">${OPT_L[j]} ${esc(x)}${String(j + 1) === String(it.ans) ? ' · เฉลย' : ''}</span>`).join('')}</span>`) : ''}
    <span class="foot">${esc(it.ind || it.topic)}${it.src ? ' · ' + esc(it.src) : ''} · ${others}</span>
    ${on && it.why ? `<span class="foot read">${esc(it.why)}</span>` : ''}
  </button>`;
}

async function pickOnly(r, itemId, btn) {
  if (!itemId) return;
  btn.disabled = true; const t0 = btn.textContent; btn.textContent = 'กำลังบันทึก…';
  try { await api('pickItem', r.room, r.subject, itemId); }
  catch (e) { btn.disabled = false; btn.textContent = t0; ($('#pk-err') || {}).textContent = failMsg(e); if (!$('#pk-err')) toast(failMsg(e)); return; }
  closeSheet(); delete T.bank[r.key];
  toast(`เก็บข้อไว้แล้ว เข้าคาบแล้วกด "เปิดรับคำตอบ ${r.room}"`);
  T.focus = r.key; await tLoad();
}

async function pickStart(r, itemId, mode, dl, btn) {
  if (!itemId) return;
  btn.disabled = true; const t0 = btn.textContent; btn.textContent = 'กำลังเปิดรับ…';
  try { await api('pickAndStart', r.room, r.subject, itemId, mode, dl); }
  catch (e) { btn.disabled = false; btn.textContent = t0; ($('#pk-err') || {}).textContent = failMsg(e); if (!$('#pk-err')) toast(failMsg(e)); return; }
  closeSheet(); delete T.bank[r.key];
  await tLoad(true); tShow('live', r.key);
}

/* ----- หน้า QR รับคำตอบ ----- */
function renderLive(r) {
  const el = $('#view-teacher'), it = r.item || {};
  const msg = `${r.subject} ห้อง ${r.room} · ข้อประจำคาบ\nกดลิงก์เพื่อตอบ: ${r.link}\nหรือกรอกรหัสห้อง ${fmtCode(r.code)}`;
  const scr = `หน้าฉาย QR ห้อง ${r.room} (เปิดบนคอมห้องเรียน ไม่ต้องล็อกอิน)\n${r.screenLink}`;
  el.innerHTML = `<header class="bar"><button class="ibtn" type="button" id="lv-back" aria-label="กลับหน้าห้องเรียน">${IC.back}</button>

      <span class="end st ok">เปิดรับคำตอบ</span></header>

      <div class="answered"><div class="r" aria-live="polite" aria-atomic="true"><span>ตอบแล้ว</span><span><b class="num" id="lv-n">${r.sent || 0}</b><small> / ${r.size || '?'} คน</small></span></div>
        <div class="track"><span id="lv-bar" style="width:${pct(r.sent || 0, r.size)}%"></span></div></div>
      <div class="acts3"><button type="button" id="lv-fs">${IC.expand}ฉายเต็มจอ</button>

/* ----- หน้าผลคาบและรายงาน ----- */
function renderResult(r) {
  const el = $('#view-teacher'), it = r.item || {}, res = r.result || {};
  const rp = T.rep[r.key] || (T.rep[r.key] = {
    c: (r.report && r.report.c) || '', chips: new Set(r.report && r.report.chips ? r.report.chips.split(' · ') : []),
    note: (r.report && r.report.note) || '', editing: !r.report
  });
  let stats = '';
  if (res.paper) stats = `<div class="big"><b>${res.pct ?? '—'}${res.pct !== null && res.pct !== undefined ? '%' : ''}</b><span>ตอบถูก ${res.ok} จาก ${res.n} คน · แบบกระดาษ</span></div>`;
  else if (!res.n) stats = '<div class="notice">ไม่มีนักเรียนส่งคำตอบในรอบนี้</div>';
  else {
    stats = `<div class="big"><b>${res.pct}%</b><span>ตอบถูก ${res.ok} จาก ${res.n} คน</span></div>`;
    if (res.dist) {
      const hot = res.top && res.top.pct >= 15 && res.top.n >= 3 ? res.top.k : 0;
      stats += `<div class="dist" aria-label="จำนวนที่เลือกแต่ละตัวเลือก">${res.dist.map((v, j) => {
        const key = String(j + 1) === String(it.ans), cls = key ? 'key' : (j + 1 === hot ? 'hot' : '');
        return `<div class="r"><span class="l${key ? ' key' : ''}" title="${esc(it.opts[j])}">${OPT_L[j]} ${esc(short(it.opts[j], 10))}${key ? ' ✓' : ''}</span>
          <span class="b"><span class="${cls}" style="width:${pct(v, res.n)}%"></span></span><span class="n">${v} คน</span></div>`; }).join('')}</div>`;
      if (hot) stats += `<p class="warnline">${res.top.n} คนเลือก ${OPT_L[hot - 1]} (${esc(short(it.opts[hot - 1], 24))})${res.top.why ? ' ซึ่ง' + esc(res.top.why) : ''} ควรอธิบายซ้ำ</p>`;
    } else if (it.type === 'number') stats += `<p class="note">คำตอบที่ถูก: <b>${esc(it.ans)}</b>${res.blank ? ` · ไม่ตอบ ${res.blank} คน` : ''}</p>`;
    if (res.pct < 50 && !(res.top && res.top.pct >= 15 && res.top.n >= 3)) stats += '<p class="warnline">ตอบถูกต่ำกว่าร้อยละ 50 ควรอธิบายซ้ำก่อนจบคาบ</p>';
  }
  const repHtml = !rp.editing && r.report ? `
    <div class="sent-box"><div class="h"><span class="st ok">ส่งรายงานแล้ว${r.report.at ? ' · ' + esc(r.report.at) : ''}</span><button class="link" type="button" id="rp-edit">แก้ไข</button></div>
      <div class="mini" style="background:none;padding:0;gap:6px"><div class="tags">${cTag(r.report.c, 'on-white')}${r.report.chips ? r.report.chips.split(' · ').map(c => `<span class="note">· ${esc(c)}</span>`).join('') : ''}</div></div>
      ${r.report.note ? `<p>${esc(r.report.note)}</p>` : ''}</div>`
    : `<div class="lv-head"><span id="lab-lv">ระดับที่ใช้สอน</span><b>${rp.c ? esc(rp.c + ' ' + C_TXT[rp.c]) : 'เลือก 1 ระดับ'}</b></div>
      ${it.c && C_TXT[it.c] ? `<p class="note" style="margin:-4px 0 0">ข้อนี้ในคลังเป็น ${esc(it.c)} เลือกตามที่สอนจริงในคาบ</p>` : ''}
      <div class="levels" role="radiogroup" aria-labelledby="lab-lv">${Object.keys(C_TXT).map(c => `<button type="button" role="radio" aria-checked="${rp.c === c}" data-c="${c}" title="${C_TXT[c]}">${c}</button>`).join('')}</div>
      <div class="chips" role="group" aria-label="ตัวเลือกด่วน">${REPORT_CHIPS.map(c => `<button type="button" class="chip" aria-pressed="${rp.chips.has(c)}" data-chip="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <textarea class="memo" id="rp-note" rows="1" maxlength="300" aria-label="บันทึกเพิ่มเติม" placeholder="พิมพ์เพิ่มได้ (ไม่บังคับ)">${esc(rp.note)}</textarea>
      <span class="err" id="rp-err" role="alert"></span>`;
  el.innerHTML = `<header class="bar"><button class="ibtn" type="button" id="rs-back" aria-label="กลับหน้าห้องเรียน">${IC.back}</button>
      <div class="t"><b>${esc(r.room)} · ผลคาบ</b><span>${esc(r.subject)}${r.day ? ' · ' + esc(r.day) : ''}</span></div>
      <span class="end st mute">${r.state === 'paper' ? 'แบบกระดาษ' : r.auto ? 'ระบบปิดรับให้' : 'ปิดรับแล้ว'}</span></header>
    <main class="result">
      <section style="display:flex;flex-direction:column;gap:12px">
        <div class="meta">${cTag(it.c, 'solid')}<span>${[it.exam, it.ind || it.topic, it.diff].filter(Boolean).map(esc).join(' · ')}</span></div>
        ${it.missing ? `<span class="err">ไม่พบข้อ ${esc(it.id)} ในคลังแล้ว</span>` : ''}
        ${it.q ? `<p class="stem">${esc(it.q)}</p>` : ''}${it.img ? `<img class="stem-img" src="${esc(it.img)}" alt="รูปโจทย์" referrerpolicy="no-referrer">` : ''}
      </section>
      <section style="display:flex;flex-direction:column;gap:14px">${stats}
        ${r.state === 'closed' ? '<p class="note">นักเรียนเห็นเฉลยและคำอธิบายในเครื่องของตนเองแล้ว</p>' : ''}
        ${it.why ? `<p class="note read">คำอธิบาย: ${esc(it.why)}</p>` : ''}</section>
      <section class="report"><h2>รายงานคาบ</h2>${repHtml}</section>
    </main>
    <div class="dock">${!rp.editing && r.report ? '<button class="btn-p" type="button" id="rs-home">กลับหน้าห้องเรียน</button>' : '<button class="btn-p" type="button" id="rp-send">ส่งรายงาน</button>'}</div>`;
  $('#rs-back').onclick = () => tShow('home');
  const home = $('#rs-home'); if (home) home.onclick = () => tShow('home');
  const ed = $('#rp-edit'); if (ed) ed.onclick = () => { rp.editing = true; renderResult(r); };
  $$('[data-c]', el).forEach(b => b.onclick = () => { rp.c = b.dataset.c; renderResult(r); $(`[data-c="${rp.c}"]`).focus(); });
  $$('[data-chip]', el).forEach(b => b.onclick = () => { const v = b.dataset.chip; rp.chips.has(v) ? rp.chips.delete(v) : rp.chips.add(v); b.setAttribute('aria-pressed', rp.chips.has(v)); });
  const note = $('#rp-note');
  if (note) { const fit = () => { note.style.height = 'auto'; note.style.height = note.scrollHeight + 2 + 'px'; }; note.oninput = () => { rp.note = note.value; fit(); }; fit(); }
  const send = $('#rp-send');
  if (send) send.onclick = async () => {
    if (!rp.c) { $('#rp-err').textContent = 'เลือกระดับที่ใช้สอน C1–C6 ก่อนส่ง'; return; }
    send.disabled = true; send.textContent = 'กำลังส่ง…';
    try { await api('saveReport', r.roundId, rp.c, [...rp.chips], rp.note.trim()); }
    catch (e) { send.disabled = false; send.textContent = 'ส่งรายงาน'; $('#rp-err').textContent = failMsg(e); return; }
    delete T.rep[r.key];
    toast('ส่งรายงานคาบแล้ว');
    const extra = r.extra;
    await tLoad(true);
    if (extra || !roomOf(r.key)) tShow('home'); else tShow('result', r.key);
  };
}

/* ----- อัปเดตยอดตอบทุก 6 วินาที (เฉพาะรอบที่เปิดรับ) ----- */
async function tTick() {
  if (document.hidden || $('#view-teacher').hidden || !T.data) return;
  const open = allRooms().filter(x => x.state === 'open' && x.roundId);
  if (!open.length) return;
  let counts;
  try { counts = await api('liveCounts', open.map(x => x.roundId)); } catch (e) { return; }
  let changed = false;
  for (const r of open) {
    const n = counts[r.roundId] ?? r.sent;
    if (!$('#fs').hidden && $('#fs').dataset.key === r.key && $('#fs-count')) $('#fs-count').textContent = n;
    if (n === r.sent) continue;
    r.sent = n; changed = true;
    if (T.page === 'live' && T.key === r.key && $('#lv-n')) { $('#lv-n').textContent = n; $('#lv-bar').style.width = pct(n, r.size) + '%'; }
  }
  if (changed && T.page === 'home' && $('#scrim').hidden) { const y = window.scrollY; renderHome(); window.scrollTo(0, y); }
}

/* ----- QR เต็มจอ (ฉายขึ้นจอในห้องเรียน) ----- */
function openFs(r) {
  const fs = $('#fs');
  closeSheet();
  fs.dataset.key = r.key;
  fs.innerHTML = `
    <div class="fs-top"><h2>${esc(r.subject)} · ข้อประจำคาบ</h2><button class="btn" type="button" id="fs-x">ปิดหน้าจอนี้ (Esc)</button></div>
    <div class="fs-main">${r.item && r.item.q ? `<p class="fs-q">${esc(r.item.q)}</p>` : ''}<div class="fs-qr" id="fs-qr"></div>
      <div class="fs-side"><span class="fs-room">ห้อง ${esc(r.room)}</span>
        <span>สแกน QR Code หรือพิมพ์รหัสห้อง</span><span class="fs-code">${fmtCode(r.code)}</span>
        <span class="fs-count">ตอบแล้ว <b id="fs-count">${r.sent || 0}</b> จาก ${r.size || '?'} คน</span></div></div>
    <p class="fs-foot">ใช้ได้เฉพาะห้อง ${esc(r.room)} ขณะเปิดรับคำตอบ · กรอกแค่รหัสนักเรียน</p>`;
  fs.hidden = false;
  drawQr($('#fs-qr'), r.link);
  $('#fs-x').onclick = closeFs; $('#fs-x').focus();
  try { fs.requestFullscreen && fs.requestFullscreen().catch(() => {}); } catch (e) {}
}
function closeFs() {
  const fs = $('#fs'); fs.hidden = true; fs.innerHTML = ''; delete fs.dataset.key;
  try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {}
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && !$('#fs').hidden && !PARAMS.screen) closeFs(); });

const SRC_DESC = {

  'ข้อที่ฝึกในคาบแล้ว': 'ดูว่านักเรียนจำและเข้าใจข้อที่ทำในคาบได้แค่ไหน'
};

      <a class="ext" href="${esc(sh.settings)}" target="_blank" rel="noopener">ตั้งค่า</a>` : '');
  $('#ad-foot').innerHTML = `<button type="button" id="ad-out">ออกจากระบบ</button>`;

function adShow(page, level) {

          <td>${x.need ? bar(x.have, x.need, x.have < x.need) : '<span class="m">—</span>'}</td><td class="m" style="min-width:140px">${esc(x.gap || (x.need ? 'ครบแล้ว' : '—'))}</td>

          <td class="r"><button class="btn sm" type="button" data-lv="${esc(x.level)}">กำกับแบบประเมิน</button></td></tr>`).join('') || '<tr><td colspan="7" class="m">ยังไม่มีระดับชั้นในชีตห้องเรียน</td></tr>'}</tbody></table></div></section>

    <div class="cols">
      <section class="sec wide" aria-labelledby="h-bank"><div class="sec-h"><div class="t"><h2 id="h-bank">คลังข้อสอบรายวิชา</h2>
          <span class="s">เป้า ${o.target} ข้อต่อวิชาต่อระดับ · รวม ${o.bankTotal.toLocaleString('en-US')} ข้อ</span></div></div>
        <div class="tw"><table class="tb"><thead><tr><th>วิชา</th><th>ระดับ</th><th>ผู้รับผิดชอบ</th><th class="r">ใช้ในคาบแล้ว</th><th>ข้อในคลัง</th><th>สถานะ</th></tr></thead>
          <tbody>${o.bank.length ? o.bank.map(x => `<tr><td class="b">${esc(x.subject)}${x.taught ? '' : ' <span class="m" style="font-weight:400;font-size:12px">(ยังไม่มีครูผู้สอน)</span>'}</td><td class="nw">${esc(x.level)}</td><td class="m nw">${esc(x.owner || '—')}</td>
            <td class="r num">${x.used}</td><td>${bar(x.items, o.target, x.state === 'bad')}</td><td><span class="st ${x.state}">${esc(x.status)}</span></td></tr>`).join('')
            : '<tr><td colspan="6" class="m">คลังข้อสอบยังว่าง</td></tr>'}</tbody></table></div></section>
      <div class="narrow">
        <section class="sec" aria-labelledby="h-iss"><div class="sec-h"><h2 id="h-iss">ต้องจัดการ</h2></div>
          <div class="issues">${o.issues.map(x => `<div class="${x.tone === 'ok' ? 'ok' : x.tone === 'bad' ? 'bad' : x.tone === 'wait' ? 'wait' : 'mute'}"><span class="dot"></span><span class="t"><b>${esc(x.title)}</b><span>${esc(x.detail)}</span></span></div>`).join('')}</div></section>
        <section class="sec" aria-labelledby="h-role"><div class="sec-h"><h2 id="h-role">ผู้ใช้และสิทธิ์</h2></div>
          <div class="roles">${o.roles.map(x => `<div><span class="t"><b>${esc(x.role)}</b><span>${esc(x.can)}</span></span><b>${x.n}</b></div>`).join('')}</div>
          <p class="note" style="padding:10px 20px 16px">นักเรียนไม่มีบัญชี เข้าทำด้วยรหัสนักเรียนอย่างเดียว ระบบไม่เก็บชื่อนักเรียน</p></section>
      </div>
    </div>

    <section class="sec" aria-labelledby="h-rep"><div class="sec-h"><div class="t"><h2 id="h-rep">รายงานการใช้ในคาบ${o.week ? ' · สัปดาห์ที่ ' + o.week : ''}</h2>
        <span class="s">ส่งรายงานแล้ว ${o.reportsSent} จาก ${o.reportsDone} คาบที่ปิดรับ</span></div><button class="link" type="button" id="ov-usage">ดูทั้งหมด</button></div>
      <div class="tw"><table class="tb"><thead><tr><th>ห้อง–วิชา</th><th>ครู</th><th>ข้อที่ใช้</th><th class="r">ตอบถูก</th><th>บันทึกจากครู</th><th>สถานะ</th></tr></thead>
        <tbody>${o.reports.length ? o.reports.map(x => `<tr class="top"><td class="b">${esc(x.room)}</td><td class="nw">${esc(x.teacher)}</td><td class="m" style="min-width:160px">${esc(x.item || '—')}</td>
          <td class="r num">${esc(x.sent)}</td><td class="read${x.done ? '' : ' m'}">${esc(x.note)}</td><td><span class="st ${x.done ? 'ok' : 'wait'}">${esc(x.status)}</span></td></tr>`).join('')
          : '<tr><td colspan="6" class="m">สัปดาห์นี้ยังไม่มีคาบที่ปิดรับ</td></tr>'}</tbody></table></div></section>
    <p class="note">ตัวเลขทั้งหมดคำนวณจากชีตในขณะที่เปิดหน้านี้ · ระบบเก็บเฉพาะรหัสนักเรียน ไม่เก็บชื่อ (PDPA) · ${o.canAdmin ? 'แก้ข้อมูลหลักได้จากลิงก์ "ข้อมูลใน Google Sheets" ที่เมนูด้านซ้าย' : 'แก้ข้อมูลหลักได้เฉพาะผู้ดูแลระบบ'}</p>`;
  $('#ov-reload').onclick = ovLoad;
  $('#ov-usage').onclick = () => adShow('usage');
  $$('[data-lv]', adMain()).forEach(b => b.onclick = () => adShow('assess', b.dataset.lv));
}

/* ----- แบบประเมินรายระดับชั้น ----- */
async function asmLoad(level) {
  adMain().innerHTML = '<div class="loading">กำลังโหลดแบบประเมิน…</div>';
  try {
    if (!level) {
      const lv = A.ov ? A.ov.asm.map(x => x.level) : (await api('adminAssessList')).levels.map(x => x.level);
      if (!lv.length) { adMain().innerHTML = '<div class="pg-head"><div class="t"><h1>แบบประเมินรายระดับชั้น</h1></div></div><div class="notice">ยังไม่มีระดับชั้นในชีตห้องเรียน</div>'; return; }
      level = lv[0];
    }
    A.level = level;
    A.d = await api('adminAssessGet', level);
  } catch (e) { if (!/^LOGIN:/.test(userMsg(e) || '')) adErr(e, () => asmLoad(level)); return; }
  A.cfg = JSON.parse(JSON.stringify(A.d.cfg)); A.dirty = false; A.armClose = false;
  asmRender();
}

const cfgTotal = () => A.cfg.quotas.reduce((t, q) => t + (Number(q.n) || 0), 0);

function asmRender() {
  const d = A.d, c = A.cfg, s = d.summary || {}, edit = d.canEdit;
  const phase = d.exists ? s.phase : 'none';
  const draftView = !d.exists || phase === 'draft';
  const keepY = window.scrollY;
  const tabs = `<div class="tabs" role="tablist" aria-label="ระดับชั้น">${d.levels.map(x => `<button type="button" role="tab" data-tab="${esc(x.level)}" aria-selected="${x.level === d.level}">${esc(x.level)}${x.phase ? ` <span style="font-size:12px;font-weight:400">· ${esc((PHASE[x.phase] || PHASE.none)[1].split(' · ')[0])}</span>` : ''}</button>`).join('')}</div>`;
  const head = `<button class="back" type="button" id="as-back">← ภาพรวมข้อมูล</button>
    <div class="pg-head"><div class="t"><div><h1>${esc(c.title || 'แบบประเมินรวม ' + d.level)}</h1>${phaseSt(phase)}</div>
        <p>${esc(d.level)} · นักเรียน ${d.students.toLocaleString('en-US')} คน ${d.roomCount} ห้อง · ครูประจำชั้นที่ส่งลิงก์ต่อได้ ${d.homeroomCount} จาก ${d.roomCount} ห้อง</p></div>
      <div class="acts">${asmActs(d, phase)}</div></div>${tabs}
    ${edit ? '' : '<div class="notice">คุณดูได้อย่างเดียว ผู้ดูแลระบบเป็นผู้แก้ไขและประกาศแบบประเมิน</div>'}
    ${(d.uncovered || []).length ? `<div class="notice wait" role="note"><span><b>${d.uncovered.length} ห้องไม่มีครูประจำชั้นที่ส่งลิงก์ต่อได้:</b> ${d.uncovered.map(x => `${esc(x.room)} (${esc(x.why)})`).join(' · ')}
      <br>ลิงก์จะไม่ถึงนักเรียนห้องเหล่านี้เอง แก้ในชีตห้องเรียน/ชีตครู หรือหลังประกาศ กด "คัดลอกข้อความส่งต่อ" ในตารางความคืบหน้าแล้วส่งเอง</span></div>` : ''}
    <span class="err" id="as-err" role="alert"></span>`;
  adMain().innerHTML = head + (draftView ? asmDraft(d, c, edit) : asmLive(d, c, s, edit)) +
    (A.dirty && edit ? `<div class="savebar" role="region" aria-label="การแก้ไขที่ยังไม่บันทึก"><span>มีการแก้ไขที่ยังไม่บันทึก</span>
      <button class="btn sm" type="button" id="sv-undo">ยกเลิก</button><button class="btn sm pri" type="button" id="sv-save">${draftView ? 'บันทึกร่าง' : 'บันทึก'}</button></div>` : '');
  asmBind(d, s, edit, draftView);
  window.scrollTo(0, keepY);
}

function asmActs(d, phase) {
  if (!d.canEdit) return d.exists ? '<button class="btn" type="button" data-a="preview">ดูแบบที่นักเรียนเห็น</button>' : '';
  if (phase === 'none') return '<button class="btn pri" type="button" data-a="create">สร้างร่างแบบประเมิน</button>';
  if (phase === 'draft') return `<button class="btn" type="button" data-a="preview">ดูแบบที่นักเรียนเห็น</button><button class="btn pri" type="button" data-a="publish">ประกาศให้นักเรียนทำ</button>`;
  if (phase === 'closed') return `<button class="btn" type="button" data-a="reopen">เปิดรับอีกครั้ง</button><button class="btn pri" type="button" data-a="newround">เริ่มรอบใหม่</button>`;
  return `${d.answered ? '' : '<button class="btn" type="button" data-a="todraft">กลับเป็นร่าง</button>'}<button class="btn" type="button" data-a="extend">ขยายเวลา</button>
    <button class="btn red" type="button" data-a="close">${A.armClose ? 'แตะอีกครั้งเพื่อปิดรับ' : 'ปิดรับก่อนกำหนด'}</button>`;
}

function asmDraft(d, c, edit) {
  const pool = d.pool[c.source] || {};
  const lock = !edit;
  const used = new Set(c.quotas.map(q => q.exam + '|' + q.subject));
  const addable = d.exams.map(e => ({ e, subs: (d.subjects[e] || []).filter(s => !used.has(e + '|' + s)) })).filter(x => x.subs.length);
  const total = cfgTotal();
  const quotaRows = c.quotas.map((q, i) => {
    const have = pool[q.exam + '|' + q.subject] || 0, n = Number(q.n) || 0, short = n > have;
    return `<tr class="${n ? '' : 'zero'}"><td><span class="etag">${esc(q.exam)}</span></td><td class="b">${esc(q.subject)}</td>
      <td>${lock ? `<b class="num">${n}</b>` : `<span class="stepper"><button type="button" data-q="${i}" data-d="-1" aria-label="ลด ${esc(q.subject)}">−</button><span aria-live="polite">${n}</span><button type="button" data-q="${i}" data-d="1" aria-label="เพิ่ม ${esc(q.subject)}">+</button></span>`}</td>
      <td class="num">${have} ข้อ${short ? ` <span class="bad" style="font-weight:600">ไม่พอ ขาด ${n - have}</span>` : ''}</td>
      <td class="r">${lock ? '' : `<button class="link mute" type="button" data-qdel="${i}" aria-label="เอา ${esc(q.subject)} ออก">เอาออก</button>`}</td></tr>`;
  }).join('');
  const items = d.items || [];
  const itemRows = items.map(it => `<tr class="top"><td class="num m">${it.pos}</td>
      <td class="read">${it.missing ? `<span class="err">ไม่พบข้อ ${esc(it.id)} ในคลัง</span>` : `<div class="qtags" style="margin-bottom:4px"><span class="etag">${esc(it.exam)}</span><span class="sj">${esc(it.subject)}</span>${cTag(it.c)}${diffTag(it.diff)}</div>
        <span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(it.q || 'โจทย์เป็นรูปภาพ')}</span>`}</td>
      <td class="r nw">${edit ? `<button class="btn sm" type="button" data-it="${it.pos}" data-ia="${it.locked ? 'unlock' : 'lock'}">${it.locked ? 'ล็อกแล้ว · ปลด' : 'ล็อก'}</button>
        ${it.locked ? '' : `<button class="btn sm" type="button" data-it="${it.pos}" data-ia="replace">เปลี่ยนข้อ</button><button class="link mute" type="button" data-it="${it.pos}" data-ia="remove" style="margin-left:6px">เอาออก</button>`}` : it.locked ? '<span class="m">ล็อก</span>' : ''}</td></tr>`).join('');
  return `<div class="cols">
    <div class="wide" style="display:flex;flex-direction:column;gap:20px">
      <section class="sec" aria-labelledby="h-q"><div class="sec-h"><div class="t"><h2 id="h-q">สัดส่วนข้อสอบ</h2><span class="s">จำนวนข้อต่อวิชา · คอลัมน์ขวาคือข้อในคลังที่ใช้ได้ตามที่มาของข้อที่เลือก</span></div></div>
        <div class="tw"><table class="tb"><thead><tr><th>ประเภท</th><th>วิชา</th><th>จำนวนข้อ</th><th>ข้อในคลังที่ใช้ได้</th><th></th></tr></thead>
          <tbody>${quotaRows || '<tr><td colspan="5" class="m">ยังไม่มีวิชา เพิ่มวิชาด้านล่าง</td></tr>'}</tbody></table></div>
        <div class="sec-pad" style="flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;border-top:1px solid var(--line-2)">
          ${!lock && addable.length ? `<div class="addrow"><select id="add-exam" aria-label="ประเภทข้อสอบ">${addable.map(x => `<option>${esc(x.e)}</option>`).join('')}</select>
            <select id="add-sub" aria-label="วิชา"></select><button class="btn sm" type="button" id="add-go">+ เพิ่มวิชา</button></div>` : '<span></span>'}
          <b class="num">รวม ${total} ข้อ · ราว ${Math.max(10, Math.round(total * 1.75))} นาที</b></div>
        ${d.exams.length === 1 ? `<p class="note" style="padding:0 20px 14px">${esc(d.level)} ใช้ O-NET อย่างเดียว · A-Level TGAT TPAT ใช้ได้เฉพาะ ม.6</p>` : ''}</section>
      <section class="sec" aria-labelledby="h-it"><div class="sec-h line"><div class="t"><h2 id="h-it">รายการข้อ${d.exists ? ` (${items.length} / ${d.summary.need} ข้อ)` : ''}</h2>
          <span class="s">ล็อกข้อที่ต้องการเก็บ แล้วกดสุ่มเติม ข้อที่ไม่ล็อกอาจถูกเปลี่ยนเมื่อสัดส่วนเปลี่ยน</span></div>
          ${edit && d.exists ? `<button class="btn pri sm" type="button" data-a="fill"${A.dirty ? ' disabled title="บันทึกร่างก่อน"' : ''}>สุ่มเติมให้ครบ ${d.summary.need} ข้อ</button>` : ''}</div>
        ${d.exists ? (items.length ? `<div class="tw"><table class="tb"><tbody>${itemRows}</tbody></table></div>` : '<p class="empty">ยังไม่มีข้อ กด "สุ่มเติมให้ครบ"</p>')
          : `<p class="empty">${edit ? 'ตั้งสัดส่วนและเวลา แล้วกด "บันทึกร่าง" ก่อน จึงสุ่มข้อได้' : 'ยังไม่ได้สร้างแบบประเมินของระดับชั้นนี้'}</p>`}
        ${A.dirty && d.exists ? '<p class="note" style="padding:0 20px 14px">บันทึกร่างก่อน แล้วจึงสุ่มเติม</p>' : ''}</section>
    </div>
    <div class="narrow">
      <section class="sec" aria-labelledby="h-time"><div class="sec-h"><h2 id="h-time">ชื่อและกำหนดเวลา</h2></div>
        <div class="sec-pad" style="padding-top:0">
          <div class="field"><label for="f-title">ชื่อแบบประเมิน</label><input id="f-title" class="box" maxlength="120" value="${esc(c.title)}" ${lock ? 'disabled' : ''}></div>
          <div class="field"><label for="f-open">เปิดให้ทำ</label><input id="f-open" class="box" type="datetime-local" value="${esc(c.openAt)}" ${lock ? 'disabled' : ''}><span class="date-hint" data-for="f-open" aria-live="polite">${dtHint(c.openAt)}</span><span class="note">เว้นว่าง = เปิดทันทีที่กดประกาศ</span></div>
          <div class="field"><label for="f-close">ปิดรับ</label><input id="f-close" class="box" type="datetime-local" value="${esc(c.closeAt)}" ${lock ? 'disabled' : ''}><span class="date-hint" data-for="f-close" aria-live="polite">${dtHint(c.closeAt)}</span><span class="note">เว้นว่าง = เปิดจนกว่าจะกดปิดรับ</span></div>
        </div></section>
      <section class="sec" aria-labelledby="h-src"><div class="sec-h"><h2 id="h-src">ที่มาของข้อ</h2></div>
        <div class="sec-pad" style="padding-top:0;gap:8px" role="radiogroup" aria-labelledby="h-src">${d.sources.map(x => `<button type="button" class="src" role="radio" aria-checked="${x === c.source}" data-src="${esc(x)}" ${lock ? 'disabled' : ''}>
          <span class="rd"></span><span class="t"><b>${esc(x)}</b><span>${esc(SRC_DESC[x] || '')}</span></span></button>`).join('')}</div></section>
      ${asmToggles(c, edit, true)}
    </div></div>`;
}

function asmToggles(c, edit, draft) {
  const rows = [['shuffle', 'คละลำดับข้อ', draft], ['shuffleOpts', 'คละตัวเลือก', draft], ['tags', 'แสดงป้ายประเภท วิชา และระดับ C', true],
    ['showScore', 'แสดงคะแนนหลังส่ง', true], ['showAns', 'แสดงเฉลยหลังส่ง', true]].filter(x => x[2]);
  return `<section class="sec" aria-labelledby="h-tg"><div class="sec-h"><h2 id="h-tg">การทำและการแสดงผล</h2></div>
    <div class="toggles">${rows.map(([k, l]) => `<div><span id="tg-${k}">${l}</span><button type="button" class="sw" role="switch" aria-labelledby="tg-${k}" aria-checked="${!!c[k]}" data-tg="${k}" ${edit ? '' : 'disabled'}></button></div>`).join('')}
      <div><span>เข้าทำด้วย</span><span class="m">รหัสนักเรียนอย่างเดียว</span></div></div></section>`;
}

function asmLive(d, c, s, edit) {
  const p = d.progress || { rooms: [], done: 0, size: 0, pct: null, dups: [] };
  const full = p.rooms.filter(x => x.size && x.done >= x.size).length;
  const tl = [
    { d: 'ok', b: 'ประกาศแล้ว', s: 'ลิงก์และ QR เดียวทั้งระดับชั้น ครูประจำชั้นเห็นการ์ดส่งต่อในหน้าห้องเรียนของตน' },
    { d: s.phase === 'scheduled' ? 'next' : 'ok', b: 'เปิดให้ทำ' + (s.openShort ? ' ' + s.openShort + ' น.' : ' ทันทีที่ประกาศ'), s: 'นักเรียนเข้าทำด้วยรหัสนักเรียน ทำที่บ้านได้' },
    { d: s.phase === 'live' ? 'next' : s.phase === 'closed' ? 'ok' : 'wait', b: 'ครูประจำชั้นติดตามและเตือนในกลุ่มห้อง', s: 'ระบบไม่ส่งเตือนอัตโนมัติ ครูกด "ส่งข้อความเตือนพร้อมยอดห้อง" หรือผู้ดูแลคัดลอกข้อความเตือนจากตารางด้านซ้าย' },
    { d: s.phase === 'closed' ? 'ok' : 'wait', b: 'ปิดรับ' + (s.closeShort ? ' ' + s.closeShort : ' เมื่อกดปิดรับ'), s: 'หลังปิดรับ ผลรวมขึ้นในหน้ารายงานของระดับชั้น' }
  ];
  return `<section class="sec"><div class="kpis">
      <div><span>ทำแล้ว</span><b>${p.done.toLocaleString('en-US')} <span style="font-size:15px;color:var(--muted);font-weight:500">/ ${p.size.toLocaleString('en-US')} คน</span></b><span>${p.pct === null ? '—' : p.pct + '%'}${p.unknown ? ` · ไม่ระบุห้อง ${p.unknown}` : ''}</span></div>
      <div><span>ห้องที่ทำครบ</span><b>${full} <span style="font-size:15px;color:var(--muted);font-weight:500">/ ${p.rooms.length} ห้อง</span></b><span>นับจากจำนวนนักเรียนในชีตห้องเรียน</span></div>

          <button class="link" type="button" id="pg-reload">โหลดใหม่</button></div>

              : `<span class="wait">${esc(x.why || 'ยังไม่ระบุในชีตห้องเรียน')}</span><div class="m" style="font-size:13px">ส่งข้อความเข้ากลุ่ม LINE ห้องเอง</div>`}</td>
            <td><div class="meter"><div class="track${x.pct !== null && x.pct < 50 && s.phase !== 'scheduled' ? ' low' : ''}"><span style="width:${x.pct || 0}%"></span></div><span class="v">${x.done} / ${x.size || '?'}</span></div></td>
            <td class="r nw">${!x.covered && x.share && s.phase !== 'closed' ? `<button class="btn sm" type="button" data-copy="${esc(x.share)}">คัดลอกข้อความส่งต่อ</button> ` : ''}${s.phase === 'live' && x.size && x.done < x.size ? `<button class="btn sm" type="button" data-copy="${esc(x.remind)}">คัดลอกข้อความเตือน</button>` : x.size && x.done >= x.size ? '<span class="st ok">ครบแล้ว</span>' : ''}</td></tr>`).join('')}</tbody></table></div>
        ${p.dups.length ? `<details class="more"><summary>รหัสที่ส่งซ้ำ ${p.dups.length} รหัส</summary><div class="sec-pad" style="padding-top:0"><span>${p.dups.map(x => `${esc(x.id)} (${x.n} ครั้ง)`).join(' · ')}</span><span class="note">ระบบนับเฉพาะครั้งแรก ถ้าเป็นรหัสที่เพื่อนกรอกผิด ให้ครูประจำชั้นตรวจสอบ</span></div></details>` : ''}</section>
      <div class="narrow">
        <section class="sec" aria-labelledby="h-share"><div class="sec-h"><h2 id="h-share">ช่องทางส่งให้นักเรียน</h2></div>

            <span class="note">ข้อความที่ส่งต่อ</span><div class="msg">${esc(s.share)}</div></div></section>

      <div class="tw"><table class="tb"><tbody>${(d.items || []).map(it => `<tr class="top"><td class="num m">${it.pos}</td><td class="read">${it.missing ? `<span class="err">ไม่พบข้อ ${esc(it.id)}</span>` : `<div class="qtags" style="margin-bottom:4px"><span class="etag">${esc(it.exam)}</span><span class="sj">${esc(it.subject)}</span>${cTag(it.c)}</div>${esc(it.q || 'โจทย์เป็นรูปภาพ')}`}</td></tr>`).join('')}</tbody></table></div></details>`;
