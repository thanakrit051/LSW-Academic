<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบฝึกข้อสอบระดับชาติ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Thai+Looped:wght@400;500;600&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* หน้าตาตาม mockup v19 (ระบบจริง/ออกแบบ/mockup):
   หน้านักเรียนและหน้าครูเป็นคอลัมน์มือถือ ปุ่มหลักติดล่างจอ · หน้าผู้ดูแลเป็นจอคอมมีเมนูด้านซ้าย */
:root {
  --canvas: #e9ecf1; --bg: #f2f4f7; --surface: #ffffff; --surface-2: #f9fafb;
  --line: #e4e7ec; --line-2: #eaecf0; --line-strong: #d0d5dd;
  --ink: #101828; --ink-2: #344054; --muted: #475467; --faint: #98a2b3; --mute: #667085;
  --brand: #173f8a; --brand-ink: #ffffff; --brand-soft: #eef3fb; --brand-line: #c9d8f2;
  --hero: #173f8a; --hero-ink: #ffffff; --hero-sub: #c9d8f2; --hero-cell: rgba(255,255,255,.1); --hero-rule: rgba(255,255,255,.16);
  --good: #067647; --good-soft: #ecfdf3;
  --warn: #b54708; --warn-ink: #93370d; --warn-soft: #fffaeb;
  --bad: #b42318; --bad-bar: #d92d20; --bad-soft: #fef3f2;
  --font: "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  --font-read: "Noto Sans Thai Looped", "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #070b14; --bg: #0c111d; --surface: #161b26; --surface-2: #1b2130;
  --line: #2a303c; --line-2: #232936; --line-strong: #3a4250;
  --ink: #f2f4f7; --ink-2: #d0d5dd; --muted: #a4acb9; --faint: #6b7383; --mute: #8c94a3;
  --brand: #8fb0ec; --brand-ink: #0c111d; --brand-soft: #1b2a4a; --brand-line: #2c4475;
  --hero: #13274f; --hero-ink: #ffffff; --hero-sub: #b8c9ec;
  --good: #47cd89; --good-soft: #0e2a1d; --warn: #f7b155; --warn-ink: #f7b155; --warn-soft: #33230e;
  --bad: #f97066; --bad-bar: #f97066; --bad-soft: #3a1714; color-scheme: dark; } }
:root[data-theme="dark"] {
  --canvas: #070b14; --bg: #0c111d; --surface: #161b26; --surface-2: #1b2130;
  --line: #2a303c; --line-2: #232936; --line-strong: #3a4250;
  --ink: #f2f4f7; --ink-2: #d0d5dd; --muted: #a4acb9; --faint: #6b7383; --mute: #8c94a3;
  --brand: #8fb0ec; --brand-ink: #0c111d; --brand-soft: #1b2a4a; --brand-line: #2c4475;
  --hero: #13274f; --hero-ink: #ffffff; --hero-sub: #b8c9ec;
  --good: #47cd89; --good-soft: #0e2a1d; --warn: #f7b155; --warn-ink: #f7b155; --warn-soft: #33230e;
  --bad: #f97066; --bad-bar: #f97066; --bad-soft: #3a1714; color-scheme: dark; }
::selection { background: #c9d8f2; color: #101828; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.read { font-family: var(--font-read); }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { flex: none; }

/* ===== คอลัมน์มือถือ (นักเรียน ครู เข้าสู่ระบบ) ===== */
.app { max-width: 480px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; }
.app.white { background: var(--surface); }
@media (min-width: 520px) { .app { box-shadow: 0 0 0 1px var(--line-strong); } }
.app > main { flex-grow: 1; }
.bar { display: flex; align-items: center; gap: 8px; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: max(14px, env(safe-area-inset-top)); }
.bar .t { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.bar .t b { font-size: 16px; font-weight: 600; }
.bar .t span { font-size: 12px; color: var(--muted); }
.bar .t span.lg { font-size: 13px; }
.bar .end { margin-left: auto; white-space: nowrap; }
.ibtn { width: 40px; height: 40px; margin: -4px 0 -4px -10px; border: 0; background: transparent; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
.ibtn:hover { background: var(--bg); }
.dock { position: sticky; bottom: 0; z-index: 4; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 14px; padding-bottom: max(26px, calc(12px + env(safe-area-inset-bottom))); display: flex; flex-direction: column; gap: 6px; }
.dock .cap { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }
.dock .cap.strong { font-size: 15px; color: var(--ink); font-weight: 600; }
.dock .cap.left { text-align: left; font-size: 13px; }
.dock .two { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; }
.pad { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

/* ปุ่ม */
.btn-p { width: 100%; height: 52px; border-radius: 12px; border: 0; background: var(--brand); color: var(--brand-ink); font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; padding: 0 16px; text-align: center; }
.btn-p:hover { background: color-mix(in srgb, var(--brand) 88%, #000); }
.btn-p.arm { background: var(--bad); color: #fff; }
.btn-s { height: 52px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; padding: 0 16px; }
.btn-s:hover, .btn:hover { background: var(--surface-2); }
.btn { height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; white-space: nowrap; }
.btn.sm { height: 40px; padding: 0 14px; }
.btn.pri { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.pri:hover { background: color-mix(in srgb, var(--brand) 88%, #000); }
.btn.red { color: var(--bad); }
button:disabled, .btn-p:disabled { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 600; font-size: 14px; text-decoration: none; cursor: pointer; }
.link.mute { color: var(--muted); font-weight: 500; }
.link.warn { color: var(--warn); }

/* ป้ายและสถานะ */
.ctag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; color: var(--brand); border: 1px solid var(--brand-line); background: var(--brand-soft); border-radius: 6px; padding: 0 6px; white-space: nowrap; line-height: 1.6; }
.ctag.on-white { background: var(--surface); }
.ctag.solid { color: var(--brand-ink); background: var(--brand); border-color: var(--brand); font-weight: 700; padding: 1px 8px; }
.ctag.big { font-size: 15px; font-weight: 700; color: var(--brand-ink); background: var(--brand); border-color: var(--brand); border-radius: 8px; padding: 2px 10px; }
.etag { font-size: 12px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border: 1px solid var(--brand-line); border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.ok { color: var(--good); } .wait { color: var(--warn); } .bad { color: var(--bad); } .info { color: var(--brand); } .mute { color: var(--mute); }
.diff { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.diff::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--faint)); }
.now-tag { font-size: 12px; font-weight: 600; color: var(--brand-ink); background: var(--brand); border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
.now-tag.soft { color: var(--brand); background: var(--brand-soft); }
.now-tag.warn { color: var(--warn); background: var(--warn-soft); }

/* แถบความคืบหน้า */
.track { height: 8px; background: var(--line-2); border-radius: 4px; overflow: hidden; }
.track > span { display: block; height: 100%; background: var(--good); border-radius: inherit; transition: width .4s; }
.track.thin { height: 6px; border-radius: 3px; }
.track.blue > span { background: var(--brand); }
.track.low > span { background: var(--bad-bar); }

/* ===== หน้าครู: ห้องเรียนวันนี้ ===== */
.hero { background: var(--hero); color: var(--hero-ink); padding: 18px 18px 16px; padding-top: max(18px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 14px; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hero-top .who { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.hero-top .who span { font-size: 13px; color: var(--hero-sub); }
.hero-top .who b { font-size: 20px; font-weight: 600; }
.hero-top .side { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.35; flex: none; }
.hero-top .side span { font-size: 13px; color: var(--hero-sub); }
.hero-top .side button { background: none; border: 0; min-height: 44px; padding: 0 0 0 12px; margin: -10px 0; color: var(--hero-ink); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--hero-cell); border-radius: 12px; }
.stats > div { padding: 10px 12px; display: flex; flex-direction: column; min-width: 0; }
.stats > div + div { border-left: 1px solid var(--hero-rule); }
.stats span { font-size: 12px; color: var(--hero-sub); }
.stats b { font-size: 18px; font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border-radius: 16px; }
.focus { padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: inset 0 0 0 2px var(--brand); }
.focus-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.focus-head .t { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.focus-head .t > span:first-child { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.focus-head b { font-size: 18px; }
.focus-head .sub { font-size: 13px; color: var(--muted); }
.mini { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
.mini .q { font-family: var(--font-read); font-size: 15px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mini .tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.focus .links { display: flex; gap: 4px 18px; flex-wrap: wrap; }
.focus .links button { min-height: 44px; }
.wk { font-size: 13px; line-height: 1.5; color: var(--warn-ink); padding: 8px 12px; border-radius: 10px; background: var(--warn-soft); }
.wk.ok { color: var(--good); background: var(--good-soft); }
.focus .count { display: flex; flex-direction: column; gap: 8px; }
.focus .count .r { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--ink-2); }
.focus .count .r b { font-size: 20px; color: var(--ink); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-size: 13px; line-height: 1.4; }
.steps li { display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
.steps li::before { content: ""; height: 4px; border-radius: 2px; background: var(--line); }
.steps li.done::before { background: var(--brand); opacity: .45; }
.steps li.now { color: var(--brand); font-weight: 600; }
.steps li.now::before { background: var(--brand); }

.rows { display: flex; flex-direction: column; overflow: hidden; }
.row { width: 100%; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: transparent; text-align: left; color: var(--ink); }
.row + .row { border-top: 1px solid var(--line-2); }
button.row:hover { background: var(--surface-2); }
.row .t { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.row .t b { font-size: 16px; }
.row .t b small { font-size: 13px; font-weight: 500; color: var(--muted); }
.row .t span { font-size: 13px; }
.row .act { font-size: 14px; font-weight: 600; color: var(--brand); white-space: nowrap; }
.sec-label { font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 4px 4px 0; }
.empty { padding: 18px 16px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }

/* การ์ดแบบประเมิน (ครูประจำชั้น) หน้าตาเดียวกับการ์ดใน LINE */
.bubble { background: var(--surface); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.bubble .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.bubble .body .k { font-size: 13px; color: var(--muted); }
.bubble .body .h { font-weight: 600; font-size: 16px; }
.bubble .body .d { font-size: 14px; color: var(--ink-2); line-height: 1.55; }
.bubble .body .n { font-size: 15px; } .bubble .body .n b { font-size: 22px; font-variant-numeric: tabular-nums; }
.bubble .ba { display: flex; align-items: center; justify-content: center; min-height: 48px; border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--brand); font-weight: 600; font-size: 15px; text-decoration: none; width: 100%; }
.bubble .ba.sub { min-height: 44px; color: var(--ink-2); font-weight: 500; font-size: 14px; }

/* ===== หน้าครู: เลือกข้อสอบ ===== */
.filters { padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.fgroup { display: flex; flex-direction: column; gap: 6px; }
.fgroup > .lab { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.fgroup > .lab span { font-weight: 400; color: var(--muted); }
.fgroup > .hint { font-size: 12px; color: var(--muted); }
.exams { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.exams button { height: 44px; border-radius: 10px; font-size: 14px; font-weight: 600; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 0 4px; }
.exams button[aria-checked="true"] { border-color: var(--brand); background: var(--brand); color: var(--brand-ink); }
.exams button[aria-disabled="true"] { border: 1px dashed var(--line-strong); background: var(--surface-2); color: var(--faint); cursor: not-allowed; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin-right: -14px; padding-right: 14px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap; flex: none; }
.chips.scroll .chip { height: 44px; }
.chip[aria-checked="true"], .chip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.chip[aria-checked="true"]::before, .chip[aria-pressed="true"]::before { content: "✓ "; }
.selectbox { position: relative; height: 52px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.selectbox .v { font-size: 16px; font-weight: 600; flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selectbox .n { font-size: 13px; color: var(--muted); white-space: nowrap; }
.selectbox select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; }
.selectbox:focus-within { outline: 3px solid var(--brand); outline-offset: 2px; }
.qlist { background: var(--surface); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
.qi { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border: 0; background: transparent; text-align: left; color: var(--ink); width: 100%; }
.qi + .qi { border-top: 1px solid var(--line-2); }
.qi[aria-checked="true"] { background: var(--brand-soft); gap: 10px; }
.qi .h { display: flex; align-items: center; gap: 6px; }
.qi .radio { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; display: flex; align-items: center; justify-content: center; }
.qi[aria-checked="true"] .radio { border: 2px solid var(--brand); }
.qi[aria-checked="true"] .radio::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); }
.qi .stem { font-family: var(--font-read); font-size: 15px; line-height: 1.55; }
.qi .foot { font-size: 12px; color: var(--muted); }
.qi .foot .wait { font-weight: 600; }
.qi img { max-width: 100%; max-height: 180px; object-fit: contain; border-radius: 8px; background: #fff; align-self: flex-start; }
.ans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; font-size: 14px; font-variant-numeric: tabular-nums; }
.ans.one { grid-template-columns: minmax(0, 1fr); }
.ans span { padding: 6px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); line-height: 1.45; }
.ans span.key { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 600; }

/* ===== หน้าครู: QR รับคำตอบ ===== */
.live { padding: 28px 24px 24px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
.qrbox { padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
.qrbox canvas, .qrbox img { display: block; width: 200px; height: 200px; image-rendering: pixelated; }
.code { display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.code span { font-size: 13px; color: var(--muted); }
.code b { font-size: 34px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.answered { align-self: stretch; display: flex; flex-direction: column; gap: 8px; }
.answered .r { display: flex; justify-content: space-between; align-items: baseline; }
.answered .r > span:first-child { font-size: 15px; color: var(--ink-2); }
.answered .r b { font-size: 24px; } .answered .r small { font-size: 15px; color: var(--muted); }
.acts3 { align-self: stretch; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.acts3 > * { height: 72px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; text-align: center; line-height: 1.3; padding: 0 4px; }
.acts3 > *:hover { background: var(--surface-2); }
.acts3 svg { stroke: var(--brand); }

/* ===== หน้าครู: ผลคาบและรายงาน ===== */
.result { background: var(--surface); padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 20px; }
.result section + section { padding-top: 18px; border-top: 1px solid var(--line); }
.result .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.result .meta span:last-child { font-size: 14px; color: var(--muted); }
.result .stem { font-family: var(--font-read); font-size: 18px; font-weight: 500; line-height: 1.6; }
.result .stem-img { max-width: 100%; border-radius: 10px; background: #fff; }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big b { font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.big span { font-size: 15px; color: var(--muted); }
.dist { display: flex; flex-direction: column; gap: 10px; }
.dist .r { display: grid; grid-template-columns: 70px minmax(0, 1fr) 52px; align-items: center; gap: 10px; font-size: 14px; }
.dist .r .l { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dist .r .l.key { color: var(--good); font-weight: 600; }
.dist .r .b { height: 12px; background: var(--bg); border-radius: 6px; overflow: hidden; }
.dist .r .b span { display: block; height: 100%; border-radius: 6px; background: var(--faint); }

.warnline { display: flex; gap: 8px; align-items: baseline; font-size: 14px; line-height: 1.5; color: var(--warn-ink); }

.note { font-size: 13px; color: var(--muted); line-height: 1.5; }
.report { display: flex; flex-direction: column; gap: 12px; }

.lv-head { display: flex; justify-content: space-between; font-size: 13px; }
.lv-head span { color: var(--muted); } .lv-head b { color: var(--brand); }
.levels { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.levels button { height: 44px; border-radius: 10px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 0; }
.levels button[aria-checked="true"] { border-color: var(--brand); background: var(--brand); color: var(--brand-ink); }
textarea.memo { font-family: var(--font-read); font-size: 15px; line-height: 1.6; color: var(--ink); border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; resize: none; background: var(--surface); min-height: 46px; width: 100%; }
.sent-box { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--good-soft); }
.sent-box .h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sent-box p { font-family: var(--font-read); font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
.err { font-size: 13px; color: var(--bad); }
.err:empty { display: none; }

/* แผ่นล่าง (เมนู ตัวเลือกอื่น ยืนยัน) */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10,16,24,.5); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 720px) { .scrim { align-items: center; padding: 16px; } }
.sheet { width: min(480px, 100%); max-height: 90vh; overflow: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 18px 16px; padding-bottom: max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 720px) { .sheet { border-radius: 16px; } }
.sheet .sh-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheet .sh-head .t { display: flex; flex-direction: column; line-height: 1.35; }
.sheet .sh-head b { font-size: 17px; font-weight: 600; }
.sheet .sh-head span { font-size: 13px; color: var(--muted); }
.sheet .list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sheet .list > * { min-height: 52px; padding: 10px 14px; border: 0; background: var(--surface); text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 2px; color: var(--ink); font-size: 15px; font-weight: 600; text-decoration: none; }
.sheet .list > * + * { border-top: 1px solid var(--line-2); }
.sheet .list > *:hover { background: var(--surface-2); }
.sheet .list small { font-size: 13px; font-weight: 400; color: var(--muted); }
.sheet .list .red { color: var(--bad); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lab { font-size: 13px; color: var(--muted); }
.input { height: 48px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 12px; background: var(--surface); color: var(--ink); width: 100%; font-size: 16px; }
.input::placeholder { color: var(--mute); }
.pw-wrap { position: relative; }
.pw-wrap .input { padding-right: 76px; }
.pw-eye { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); min-height: 44px; padding: 0 12px; background: none; border: 0; color: var(--brand); font-size: 14px; font-weight: 500; }
.remember { display: flex; align-items: flex-start; gap: 10px; min-height: 44px; padding: 6px 0; font-size: 15px; color: var(--ink); cursor: pointer; }
.remember input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: var(--brand); }
.remember small { display: block; font-size: 13px; color: var(--muted); line-height: 1.5; }
.date-hint { font-size: 13px; color: var(--muted); min-height: 1.5em; }
.input.code-in { height: 64px; font-size: 30px; letter-spacing: .14em; text-align: center; font-variant-numeric: tabular-nums; }
.input.id-in { height: 56px; font-size: 22px; letter-spacing: .1em; font-variant-numeric: tabular-nums; }

/* ===== นักเรียน: ข้อประจำคาบ และแบบประเมิน ===== */
.stu { padding: 20px 16px 20px; display: flex; flex-direction: column; gap: 18px; }
.stu .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.stu h1 { font-family: var(--font-read); font-weight: 500; font-size: 19px; line-height: 1.6; }
.stu h1.sm { font-size: 18px; line-height: 1.65; }
.stu figure { margin: 0; border-radius: 12px; background: var(--bg); padding: 10px; display: flex; justify-content: center; }
.stu figure img { max-width: 100%; max-height: 320px; object-fit: contain; border-radius: 8px; background: #fff; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--line-strong); margin: 1px; background: var(--surface); color: var(--ink); text-align: left; width: calc(100% - 2px); }
.opt[aria-checked="true"] { border: 2px solid var(--brand); margin: 0; width: 100%; background: var(--brand-soft); }
.opt .dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--faint); flex: none; display: flex; align-items: center; justify-content: center; }
.opt[aria-checked="true"] .dot { border: 2px solid var(--brand); }
.opt[aria-checked="true"] .dot::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); }
.opt .k { font-size: 15px; color: var(--muted); width: 18px; flex: none; }
.opt .v { font-family: var(--font-read); font-size: 18px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.opts.long .opt { gap: 12px; } .opts.long .opt .v { font-size: 15px; }
.qtags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; }
.qtags .sj { color: var(--ink-2); font-weight: 600; }
.qtags .sep { color: var(--faint); }
.prog { display: flex; flex-direction: column; gap: 12px; }
.prog .bar4 { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.prog .bar4 span { display: block; height: 100%; background: var(--brand); }
.prog .r { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; background: var(--surface); border: 1px solid var(--line); }
.notice.ok { background: var(--good-soft); border-color: transparent; color: var(--good); }
.notice.wait { background: var(--warn-soft); border-color: transparent; color: var(--warn-ink); }
.notice b { font-weight: 600; }
.done-big { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 18px 0 6px; }
.done-big .ic { width: 56px; height: 56px; border-radius: 50%; background: var(--good-soft); display: flex; align-items: center; justify-content: center; }
.done-big b { font-size: 20px; font-weight: 600; }
.done-big .score { font-size: 44px; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; }
.rv { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.rv .h { display: flex; justify-content: space-between; font-weight: 600; font-size: 15px; }
.rv .yes { color: var(--good); } .rv .no { color: var(--bad); }
.rv span { font-size: 14px; line-height: 1.55; }
.as-start { padding: 22px 18px 18px; padding-top: max(22px, env(safe-area-inset-top)); background: var(--hero); color: var(--hero-ink); display: flex; flex-direction: column; gap: 6px; }
.as-start span { font-size: 13px; color: var(--hero-sub); }
.as-start span.d { font-size: 14px; }
.as-start b { font-size: 22px; font-weight: 600; line-height: 1.35; }
.mix > div { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; }
.mix > div + div { border-top: 1px solid var(--line-2); }
.mix .h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mix .h b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mix .s { font-size: 13px; color: var(--muted); line-height: 1.5; }
.mix .top + div { border-top: 0; }
.mix .top { padding: 14px 16px; border-bottom: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 2px; }
.mix .top .h b { font-size: 16px; }
.idcard { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.idcard .shown { display: flex; align-items: center; gap: 12px; }
.idcard .shown b { font-size: 20px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.grid-jump { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.grid-jump button { height: 44px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
.grid-jump button.on { background: var(--brand-soft); border-color: var(--brand-line); color: var(--brand); }
.grid-jump button.cur { outline: 2px solid var(--brand); outline-offset: 1px; }
.foot-links { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 4px; }
.foot-links button { background: none; border: 0; padding: 10px; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

/* ===== ผู้ดูแล (จอคอม) ===== */
.admin { min-height: 100vh; background: var(--bg); display: flex; align-items: stretch; }
.admin aside { flex: none; width: 248px; background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.seal { width: 36px; height: 36px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none; }
.brand .t { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.brand .t b { font-size: 14px; } .brand .t span { font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a, .nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 10px; font-size: 14px; color: var(--ink-2); text-decoration: none; border: 0; background: transparent; text-align: left; width: 100%; }
.nav a:hover, .nav button:hover { background: var(--surface-2); }
.nav [aria-current="page"] { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.nav .grp { font-size: 12px; color: var(--muted); padding: 14px 12px 4px; }
.nav .ext::after { content: "↗"; color: var(--faint); font-size: 12px; }
.aside-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.admin > main { flex: 1 1 auto; min-width: 0; padding: 24px 28px 32px; display: flex; flex-direction: column; gap: 20px; }
.pg-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.pg-head .t { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pg-head h1 { font-size: 26px; font-weight: 600; line-height: 1.3; }
.pg-head .t > div { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pg-head p { color: var(--muted); font-size: 14px; }
.pg-head .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.back { font-size: 13px; font-weight: 600; text-decoration: none; background: none; border: 0; padding: 0; color: var(--brand); align-self: flex-start; }
.sec { background: var(--surface); border-radius: 16px; display: flex; flex-direction: column; min-width: 0; }
.sec-h { padding: 16px 20px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px 12px; flex-wrap: wrap; }
.sec-h.line { border-bottom: 1px solid var(--line-2); }
.sec-h h2 { font-size: 17px; font-weight: 600; }
.sec-h .t { display: flex; flex-direction: column; gap: 2px; }
.sec-h .s { font-size: 13px; color: var(--muted); }
.sec-pad { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.cols { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.cols > .wide { flex: 999 1 560px; min-width: 0; }
.cols > .narrow { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.cols > .half { flex: 1 1 420px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.kpis > div { padding: 16px 20px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line-2); }
.kpis > div:last-child { border-right: 0; }
.kpis span { font-size: 13px; color: var(--muted); }
.kpis b { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.35; }
.kpis.ready b { font-size: 22px; }
.kpis.ready span.lab { font-size: 14px; }
.tw { overflow-x: auto; }
table.tb { width: 100%; border-collapse: collapse; font-size: 14px; }
.tb th { text-align: left; color: var(--muted); font-size: 13px; font-weight: 500; background: var(--surface-2); padding: 10px 12px; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.tb td { padding: 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tb th:first-child, .tb td:first-child { padding-left: 20px; }
.tb th:last-child, .tb td:last-child { padding-right: 20px; }
.tb tr:last-child td { border-bottom: 0; }
.tb td.r, .tb th.r { text-align: right; }
.tb td.c, .tb th.c { text-align: center; }
.tb .nw { white-space: nowrap; }
.tb .b { font-weight: 600; white-space: nowrap; }
.tb .m { color: var(--muted); }
.tb .read { line-height: 1.6; min-width: 260px; }
.tb tr.top td { vertical-align: top; }
.meter { display: flex; align-items: center; gap: 10px; min-width: 150px; }
.meter .track { flex-grow: 1; }
.meter .v { font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; white-space: nowrap; }
.cell { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cell.ok { color: var(--good); } .cell.no { color: var(--muted); } .cell.pp { color: var(--warn); } .cell.off { color: var(--mute); font-weight: 500; }
.strip { margin: 0 20px 12px; padding: 10px 14px; border-radius: 10px; background: var(--bg); display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 13px; color: var(--ink-2); }
.issues > div { display: flex; gap: 12px; align-items: flex-start; padding: 12px 20px; border-top: 1px solid var(--line-2); }
.issues .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 8px; flex: none; background: currentColor; color: inherit; }
.issues .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.issues b { font-size: 14px; font-weight: 600; line-height: 1.45; color: var(--ink); }
.issues span { font-size: 13px; color: var(--muted); line-height: 1.45; }
.roles > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 20px; border-top: 1px solid var(--line-2); }
.roles .t { display: flex; flex-direction: column; line-height: 1.4; }
.roles .t b { font-size: 14px; font-weight: 600; } .roles .t span { font-size: 12px; color: var(--muted); }
.roles > div > b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs button { height: 44px; padding: 0 16px; border: 0; background: transparent; font-size: 14px; margin-bottom: -1px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--brand); font-weight: 600; border-bottom-color: var(--brand); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.stepper button { width: 32px; height: 32px; border: 0; background: var(--surface); font-size: 16px; color: var(--muted); }
.stepper button:hover { background: var(--surface-2); }
.stepper span { width: 36px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; border-left: 1px solid var(--line-2); border-right: 1px solid var(--line-2); line-height: 32px; }
.tb tr.zero td { color: var(--faint); }
.src { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); text-align: left; color: var(--ink); width: 100%; }
.src[aria-checked="true"] { background: var(--brand-soft); border-color: transparent; }
.src .rd { width: 20px; height: 20px; border-radius: 50%; flex: none; margin-top: 2px; border: 1.5px solid var(--faint); display: flex; align-items: center; justify-content: center; }
.src[aria-checked="true"] .rd { border: 2px solid var(--brand); }
.src[aria-checked="true"] .rd::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
.src .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.src b { font-size: 14px; } .src span { font-size: 13px; color: var(--muted); line-height: 1.45; }
.toggles > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 20px; border-top: 1px solid var(--line-2); font-size: 14px; }
.sw { width: 40px; height: 24px; border-radius: 12px; flex: none; position: relative; background: var(--line-strong); border: 0; padding: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw[aria-checked="true"] { background: var(--brand); }
.sw[aria-checked="true"]::after { left: 18px; }
.sw:disabled { opacity: .5; }
.box { height: 42px; border: 1px solid var(--line-strong); border-radius: 10px; display: flex; align-items: center; padding: 0 12px; font-size: 15px; background: var(--surface); color: var(--ink); width: 100%; }
div.box { background: var(--surface-2); }
.timeline { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; padding-bottom: 14px; }
.timeline .d { width: 12px; height: 12px; border-radius: 50%; margin: 5px 0 0 4px; box-sizing: border-box; }
.timeline .d.ok { background: var(--good); } .timeline .d.next { background: var(--brand); } .timeline .d.wait { border: 2px solid var(--faint); }
.timeline li > span:last-child { display: flex; flex-direction: column; gap: 2px; }
.timeline b { font-size: 14px; font-weight: 600; } .timeline small { font-size: 13px; color: var(--muted); line-height: 1.5; }
.msg { padding: 12px 14px; border-radius: 10px; background: var(--bg); font-family: var(--font-read); font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.share-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.share-row .qrbox { padding: 6px; border-radius: 10px; }
.share-row .qrbox canvas, .share-row .qrbox img { width: 112px; height: 112px; }
.savebar { position: sticky; bottom: 12px; z-index: 6; align-self: center; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 18px; border-radius: 14px; background: var(--ink); color: var(--bg); box-shadow: 0 8px 24px rgba(16,24,40,.18); font-size: 14px; }
.savebar .btn { height: 40px; }
details.more > summary { cursor: pointer; padding: 14px 20px; font-weight: 600; font-size: 14px; color: var(--brand); list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.addrow select { height: 40px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 10px; background: var(--surface); font-size: 14px; }
.loading { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.loading::before { content: ""; display: block; width: 28px; height: 28px; margin: 0 auto 10px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 900px) {
  .admin { flex-direction: column; }
  .admin aside { position: static; width: auto; height: auto; padding: 12px 14px; gap: 10px; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; scrollbar-width: none; }
  .kpis > div { border-right: 0; border-bottom: 1px solid var(--line-2); }
  .kpis > div:last-child { border-bottom: 0; }
  .nav a, .nav button { width: auto; white-space: nowrap; padding: 8px 12px; }
  .nav .grp { display: none; }
  .aside-foot { flex-direction: row; margin-top: 0; }
  .admin > main { padding: 16px 14px 28px; gap: 16px; }
  .pg-head h1 { font-size: 22px; }
}

/* QR เต็มจอสำหรับฉายขึ้นจอ: พื้นขาวเสมอเพื่อให้สแกนง่าย */

<script>
/* =====================================================================
   ชั้นข้อมูล: หน้าเว็บอยู่บน GitHub Pages เรียกฟังก์ชันใน Code.gs ผ่าน doPost ของเว็บแอป
   ไม่ส่งคุกกี้ Google ไปด้วย (credentials: 'omit') จึงไม่ติดปัญหาเบราว์เซอร์ที่ล็อกอิน Google หลายบัญชี
   ส่งเป็น text/plain เพื่อไม่ให้เบราว์เซอร์ถามสิทธิ์ CORS ก่อน (Apps Script ตอบคำถามนั้นไม่ได้)
   ข้อความ error ที่ขึ้นต้นด้วย E: คือข้อความสำหรับผู้ใช้ (ไม่ส่งซ้ำ)
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxev61VIerkQDKF5mAa5nnDB8isE1y81qAkTpkpCsdhxDscurG0xnTtvgRcrWnn9u7l/exec';
async function run(fn, ...a) {
  let j;
  try {
    const r = await fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args: a }) });
    j = await r.json();
  } catch (e) { throw new Error('NET'); }
  if (!j || !j.ok) throw new Error((j && j.error) || 'NET');
  return j.data;
}
const userMsg = (e) => { const m = String((e && e.message) || e || '').match(/E:([\s\S]*)$/); return m ? m[1].trim() : null; };
const NET_MSG = 'เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่';
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtCode = (c) => String(c || '').replace(/^(\d{3})(\d{3})$/, '$1 $2');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const pct = (a, b) => b ? Math.min(100, Math.round(a / b * 100)) : 0;
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4500);
}
function failMsg(e) { const m = userMsg(e); return m ? m.replace(/^LOGIN:/, '') : NET_MSG; }
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg || 'คัดลอกแล้ว'); }
  catch (e) { prompt('คัดลอกข้อความนี้', text); }
}
const lineShare = (msg) => 'https://line.me/R/share?text=' + encodeURIComponent(msg);
// ไลบรารี QR โหลดแบบ defer (ไม่ขวางหน้าแรกของนักเรียน) ถ้ายังโหลดไม่เสร็จ รอจนเสร็จแล้ววาด
function drawQr(el, text, size) {
  if (typeof QRCode === 'undefined') {
    if (document.readyState !== 'complete') { window.addEventListener('load', () => document.contains(el) && drawQr(el, text, size), { once: true }); return true; }
    el.textContent = 'สร้าง QR Code ไม่ได้ ใช้รหัสห้องหรือลิงก์แทน'; return false;
  }
  try { new QRCode(el, { text, width: size || 720, height: size || 720, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); return true; }
  catch (e) { el.textContent = 'สร้าง QR Code ไม่ได้ ใช้รหัสห้องหรือลิงก์แทน'; return false; }
}

const OPT_L = ['ก', 'ข', 'ค', 'ง', 'จ'];
const C_TXT = { C1: 'จำ', C2: 'เข้าใจ', C3: 'ประยุกต์ใช้', C4: 'วิเคราะห์', C5: 'ประเมินค่า', C6: 'สร้างสรรค์' };
const cTag = (c, cls) => c ? `<span class="ctag${cls ? ' ' + cls : ''}">${esc(c)} ${esc(C_TXT[c] || '')}</span>` : '';
const DIFF_DOT = { 'ง่าย': 'var(--good)', 'ปานกลาง': 'var(--warn)', 'ยาก': 'var(--bad)' };
const diffTag = d => d ? `<span class="diff" style="--dot:${DIFF_DOT[d] || 'var(--faint)'}">${esc(d)}</span>` : '';
const isDone = r => r.state === 'closed' || r.state === 'paper';

// ไอคอนเส้น (ใช้ currentColor)
const IC = {
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  close: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--faint)"><path d="M9 6l6 6-6 6"/></svg>',
  check: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--good)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  expand: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  chat: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  screen: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>'
};

let PARAMS = {}, ME = {};

/* ===================== สลับหน้าจอ ===================== */
const VIEW_IDS = ['student', 'assess', 'login', 'teacher', 'admin'];
function go(v) {
  VIEW_IDS.forEach(x => { $('#view-' + x).hidden = x !== v; });
  document.body.style.background = v === 'admin' ? 'var(--bg)' : '';
  window.scrollTo(0, 0);
}

// ช่องวันเวลาของเบราว์เซอร์แสดงตามภาษาเครื่อง (อาจเป็น ค.ศ./อังกฤษ): เขียนวันแบบไทยกำกับใต้ช่อง
function dtHint(v) {
  if (!v) return '';
  const d = new Date(v);
  if (isNaN(d)) return '';
  try { return d.toLocaleString('th-TH', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' น.'; }
  catch (e) { return ''; }
}
document.addEventListener('input', e => {
  const t = e.target;
  if (!t || t.type !== 'datetime-local' || !t.id) return;
  const h = document.querySelector(`.date-hint[data-for="${t.id}"]`);
  if (h) h.textContent = dtHint(t.value);
});

/* ===================== แผ่นล่าง (sheet) ===================== */
let sheetBack = null;
function openSheet(html, after) {
  sheetBack = document.activeElement;
  const sh = $('#sheet');
  sh.innerHTML = html; $('#scrim').hidden = false;
  $$('[data-x]', sh).forEach(b => b.onclick = closeSheet);
  after && after();
  const f = sh.querySelector('input, select, textarea, .btn-p, button');
  f && f.focus();
}
function closeSheet() {
  $('#scrim').hidden = true; $('#sheet').innerHTML = '';
  if (sheetBack && document.contains(sheetBack)) try { sheetBack.focus(); } catch (e) {}
}
const sheetHead = (title, sub) => `<div class="sh-head"><div class="t"><b id="sh-title">${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</div>
  <button class="ibtn" type="button" data-x aria-label="ปิด" style="margin:-6px -8px 0 0">${IC.close}</button></div>`;
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#fs').hidden && !PARAMS.screen) closeFs(); else if (!$('#scrim').hidden) closeSheet();
    return;
  }
  // แผ่นล่างเปิดอยู่: Tab วนอยู่ในแผ่น ไม่หลุดไปหน้าหลังฉาก
  if (e.key === 'Tab' && !$('#scrim').hidden) {
    const f = $$('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])', $('#sheet')).filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!$('#sheet').contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  // ปุ่มลูกศรในกลุ่มตัวเลือก (radiogroup) และแท็บ (tablist): เลื่อนและเลือกทันที
  const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  const me = document.activeElement;
  if (!step || !me || !me.matches('[role=radio], [role=tab]')) return;
  const group = me.closest('[role=radiogroup], [role=tablist]');
  if (!group) return;
  const items = $$(me.matches('[role=tab]') ? '[role=tab]' : '[role=radio]', group).filter(x => !x.disabled);
  const i = items.indexOf(me);
  if (i < 0) return;
  e.preventDefault();
  const next = items[(i + step + items.length) % items.length];
  const sel = next.matches('[role=tab]') ? 'data-tab' : null;
  next.click();
  // ปุ่มถูกวาดใหม่หลังคลิก: หาตัวที่ถูกเลือกในกลุ่มเดิมแล้วโฟกัส
  requestAnimationFrame(() => {
    const live = document.contains(next) ? next
      : $$('[role=radiogroup] [aria-checked="true"], [role=tablist] [aria-selected="true"]').find(x => x.textContent === next.textContent);
    live && live.focus();
  });
});
$('#sheet').setAttribute('aria-labelledby', 'sh-title');

/* ===================== เข้าสู่ระบบครู =====================
   โทเค็นเก็บใน localStorage (ติ๊กจำไว้ เป็นค่าเริ่มต้นในหน้าครู อยู่ได้ 30 วันนับจากใช้ครั้งล่าสุด)
   หรือ sessionStorage (เอาติ๊กออก สำหรับเครื่องใช้ร่วมกัน ปิดแท็บแล้วหลุด) */
const TK = {
  get() { try { return localStorage.getItem('tk') || sessionStorage.getItem('tk') || ''; } catch (e) { return ''; } },
  set(t, remember) { try { (remember ? localStorage : sessionStorage).setItem('tk', t); } catch (e) {} },
  clear() { try { localStorage.removeItem('tk'); sessionStorage.removeItem('tk'); } catch (e) {} }
};
async function api(fn, ...a) {
  try { return await run(fn, TK.get(), ...a); }
  catch (e) {
    if (/^LOGIN:/.test(userMsg(e) || '')) { TK.clear(); showLogin('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบอีกครั้ง'); }
    throw e;
  }
}

// ลิงก์ผู้ดูแล (?page=admin หรือ ?page=dashboard) แยกจากลิงก์ครู: หัวข้อต่างกัน และเข้าได้เฉพาะบทบาทที่ดูหน้าผู้ดูแลได้
const adminLink = () => PARAMS.page === 'admin' || PARAMS.page === 'dashboard';

function showLogin(note) {
  clearInterval(T.timer); closeSheet();
  const el = $('#view-login');
  el.innerHTML = `
    <header class="hero"><div class="hero-top"><div class="who"><span>${esc(ME.school || 'ระบบฝึกข้อสอบระดับชาติ')}</span><b>${adminLink() ? 'เข้าสู่ระบบผู้ดูแลระบบ' : 'เข้าสู่ระบบครู'}</b></div></div></header>
    <main class="pad">
      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:14px">
        <div class="field"><label for="lg-id">ID (รหัส 13 หลัก)</label>
          <input id="lg-id" class="input num" inputmode="numeric" autocomplete="username" maxlength="17" placeholder="0000000000000"></div>
        <div class="field"><label for="lg-pw">รหัสผ่าน</label>
          <div class="pw-wrap"><input id="lg-pw" class="input" type="password" autocomplete="current-password" placeholder="รหัสผ่านที่ผู้ดูแลระบบตั้งให้">
            <button type="button" class="pw-eye" id="lg-eye" aria-pressed="false" aria-controls="lg-pw">แสดง</button></div></div>
        <label class="remember"><input type="checkbox" id="lg-remember" ${adminLink() ? '' : 'checked'}> <span>จำการเข้าสู่ระบบในเครื่องนี้ 30 วัน<small>เอาติ๊กออกถ้าใช้คอมหรือโทรศัพท์ร่วมกับคนอื่น</small></span></label>
        <span class="err" id="lg-err" role="alert">${esc(note || '')}</span>
      </div>
      <p class="note" style="padding:0 4px">ลืมรหัสผ่าน แจ้งผู้ดูแลระบบให้ตั้งใหม่ ระบบไม่ส่งรหัสทางอีเมล</p>
      ${adminLink() ? '' : '<div class="foot-links"><button type="button" id="lg-student">นักเรียน: กรอกรหัสห้องเพื่อตอบข้อประจำคาบ</button></div>'}
    </main>
    <div class="dock"><button class="btn-p" type="button" id="lg-go">เข้าสู่ระบบ</button></div>`;
  go('login');
  $('#lg-go').onclick = doLogin;
  $('#lg-pw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('#lg-id').addEventListener('keydown', e => { if (e.key === 'Enter') $('#lg-pw').focus(); });
  $('#lg-eye').onclick = () => {
    const pw = $('#lg-pw'), show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    $('#lg-eye').textContent = show ? 'ซ่อน' : 'แสดง'; $('#lg-eye').setAttribute('aria-pressed', String(show));
  };
  if ($('#lg-student')) $('#lg-student').onclick = () => { STU.step = 'code'; go('student'); stuRender(); };
  $('#lg-id').focus();
}

async function doLogin() {
  const id = $('#lg-id').value.replace(/\D/g, ''), pw = $('#lg-pw').value;
  const err = $('#lg-err');
  if (id.length !== 13) { err.textContent = 'ID ต้องเป็นตัวเลข 13 หลัก'; return; }
  if (!pw) { err.textContent = 'กรอกรหัสผ่าน'; return; }
  const b = $('#lg-go'); b.disabled = true; b.textContent = 'กำลังเข้าสู่ระบบ…'; err.textContent = '';
  try {
    const remember = $('#lg-remember').checked;
    const res = await run('login', id, pw, remember);
    TK.set(res.token, remember && res.remember !== false);
    ME = Object.assign({}, ME, res.me);
    startStaff();
  } catch (e) { err.textContent = failMsg(e); b.disabled = false; b.textContent = 'เข้าสู่ระบบ'; }
}

async function doLogout() {
  if (!confirm('ออกจากระบบในเครื่องนี้? ครั้งหน้าต้องกรอก ID และรหัสผ่านใหม่')) return;
  const t = TK.get(); TK.clear();
  T.data = null; A.ov = null; A.d = null; DB.d = null;
  try { await run('logout', t); } catch (e) {}
  showLogin('ออกจากระบบแล้ว');
}

/* ===================== นักเรียน: ข้อประจำคาบ (1 ข้อ) ===================== */
const STU = { info: null, roundId: null, step: 'loading', no: '', pick: null, result: null, err: '', code: '', reviewTimer: null, review: null };

async function stuInit() {
  if (PARAMS.r) return stuLoad({ r: PARAMS.r });
  if (PARAMS.code) return stuLoad({ code: PARAMS.code });
  STU.step = 'code'; stuRender();
}

async function stuLoad(arg) {
  STU.step = 'loading'; STU.err = ''; stuRender();
  try { STU.info = await run('studentOpen', arg); }
  catch (e) { STU.err = failMsg(e); STU.step = arg.code ? 'code' : 'error'; STU.retry = () => stuLoad(arg); return stuRender(); }
  const I = STU.info;
  STU.roundId = I.roundId; STU.review = null;
  // เข้าด้วยรหัสห้อง: จำรอบไว้ เผื่อกดรีเฟรชหลังครูปิดรับ จะได้กลับมาดูเฉลยได้
  store.set('lastRound', I.roundId);
  if (!PARAMS.r) { try { history.replaceState(null, '', '?r=' + encodeURIComponent(I.roundId)); PARAMS.r = I.roundId; } catch (e) {} }
  const out = store.get('outbox-' + STU.roundId);
  if (out) { Object.assign(STU, { no: out.studentId, pick: out.answers[0] }); return stuSubmit(out); }
  const last = store.get('last-' + STU.roundId);
  const d = store.get('draft-' + STU.roundId);
  if (I.open && d && d.no) Object.assign(STU, { step: 'quiz', no: d.no, pick: d.pick ?? null });
  else if (last) Object.assign(STU, { step: 'done', no: last.no, pick: last.answers[0], result: last.result });
  else if (I.open) Object.assign(STU, { step: 'id', no: '', pick: null, result: null });
  else STU.step = 'closed';
  stuRender();
}

const lastDone = () => { const r = store.get('lastRound'); return r && store.get('last-' + r) ? r : null; };
const stuSave = () => { if (STU.step === 'quiz' || STU.step === 'confirm') store.set('draft-' + STU.roundId, { no: STU.no, pick: STU.pick }); };

function stuBar(sub) {

      </main>`;
    const nx = $('#stu-next');
    if (nx) nx.onclick = () => { Object.assign(STU, { step: 'id', no: '', pick: null, result: null, err: '' }); stuRender(); };

async function stuSubmit(payload) {
  const rid = STU.roundId;
  payload = payload || { roundId: rid, studentId: STU.no, answers: [STU.pick], subId: uid() };
  store.set('outbox-' + rid, payload); store.del('draft-' + rid);
  STU.step = 'sending'; STU.tries = 0; stuRender();
  for (let tries = 0; ; tries++) {
    try { STU.result = await run('studentSubmit', payload); break; }
    catch (e) {
      const m = userMsg(e);
      if (m) { store.del('outbox-' + rid); STU.err = m; STU.step = 'error'; STU.retry = () => stuLoad({ r: rid }); return stuRender(); }
      STU.tries = tries + 1; if (STU.step === 'sending') stuRender();
      await wait(Math.min(1000 * 2 ** tries, 15000));
    }
  }
  store.del('outbox-' + rid);
  store.set('last-' + rid, { no: STU.no, answers: [STU.pick], result: STU.result });
  STU.step = 'done'; stuRender();
}

async function stuLoadReview() {
  let rv = null;
  try { rv = await run('studentReview', STU.roundId); } catch (e) { /* ลองใหม่รอบหน้า */ }
  const box = $('#stu-review');
  if (!box || STU.step !== 'done') return;
  if (!rv) { STU.reviewTimer = setTimeout(stuLoadReview, 20000); return; }
  const nx = $('#stu-next'); if (nx) nx.parentElement.remove();
  const x = rv[0], mine = STU.pick;
  const ok = mine !== null && mine !== '' && (x.type === 'number' ? Number(String(mine).replace(/,/g, '')) === Number(String(x.ans).replace(/,/g, '')) : String(mine) === String(x.ans));
  const show = a => x.type === 'number' ? esc(a) : `${OPT_L[Number(a) - 1] || esc(a)} ${esc(x.opts[Number(a) - 1] ?? '')}`;
  box.innerHTML = `<div class="rv"><div class="h"><span>เฉลย</span><span class="${ok ? 'yes' : 'no'}">${ok ? 'คุณตอบถูก' : 'คุณตอบยังไม่ถูก'}</span></div>
    <span>คำตอบที่ถูก: <b>${show(x.ans)}</b></span>
    ${x.why ? `<span class="read muted">${esc(x.why)}</span>` : ''}
    ${!ok && x.wrong && x.wrong[mine] ? `<span class="read muted">ตัวที่คุณเลือก: ${esc(x.wrong[mine])}</span>` : ''}</div>`;
}

/* ===================== นักเรียน: แบบประเมินรวม ===================== */
const AS = { info: null, step: 'loading', no: '', room: '', i: 0, order: [], optOrder: [], answers: [], result: null, err: '' };
const blank = v => v === null || v === undefined || v === '';

async function asInit() {
  AS.step = 'loading'; asRender();
  try { AS.info = await run('assessOpen', { a: PARAMS.a }); }
  catch (e) { AS.err = failMsg(e); AS.step = 'error'; return asRender(); }
  const I = AS.info, key = 'as-' + I.id;
  const out = store.get('outbox-' + key);
  if (out) { Object.assign(AS, { no: out.studentId, room: out.room, answers: out.answers }); return asSubmit(out); }
  const last = store.get('last-' + key);
  if (last) { Object.assign(AS, { step: 'done', no: last.no, result: last.result, answers: last.answers || [], order: last.order || [] }); return asRender(); }
  if (I.phase !== 'live') { AS.step = I.phase; return asRender(); }
  const n = I.items.length, d = store.get('draft-' + key);
  if (d && d.answers && d.answers.length === n) Object.assign(AS, { step: 'quiz', no: d.no, room: d.room, i: d.i || 0, answers: d.answers, order: d.order, optOrder: d.optOrder });
  else Object.assign(AS, { step: 'id', answers: Array(n).fill(null), order: I.flags.shuffle ? shuffle(n) : [...Array(n).keys()],
    optOrder: I.items.map(it => it.type === 'choice' ? (I.flags.shuffleOpts ? shuffle(it.opts.length) : [...Array(it.opts.length).keys()]) : []) });
  asRender();
}
function shuffle(n) { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function asSave() { if (AS.step === 'quiz') store.set('draft-as-' + AS.info.id, { no: AS.no, room: AS.room, i: AS.i, answers: AS.answers, order: AS.order, optOrder: AS.optOrder }); }
