// ภาพรวมระบบ (เรื่องที่ต้องแก้ ข้อมูลหลัก ผู้ใช้) ใช้ร่วมกันหลายหน้า
function ovFetch(force) {
  if (force) { A.ov = null; A.ovP = null; }
  if (A.ov) return Promise.resolve(A.ov);
  if (!A.ovP) A.ovP = api('adminOverview').then(o => { A.ov = o; adNav(); return o; }).catch(e => { A.ovP = null; throw e; });
  return A.ovP;
}

// การใช้ข้อสอบ (สัปดาห์นี้ / ทั้งภาคเรียน)
async function usageGet(level, scope, force) {
  const k = level + '|' + scope;
  if (force || !U.cache[k]) U.cache[k] = await api('adminUsage', level, scope);
  return U.cache[k];
}
const lvSelect = (id, d) => `<select class="box" id="${id}" aria-label="ระดับชั้น" style="width:auto;min-width:150px">
  <option value="all">ทุกระดับชั้น</option>${d.levels.map(l => `<option ${l === d.level ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
const pctTag = (p, n) => p === null ? '<span class="m">—</span>' : `<b class="num ${p < 50 ? 'bad' : p >= 80 ? 'ok' : ''}">${p}%</b>${n ? ` <span class="m" style="font-size:13px">${n} คน</span>` : ''}`;
const USE_ST = { ok: ['ok', 'ใช้แล้ว'], open: ['info', 'เปิดรับ'], low: ['wait', 'ตอบ'], planned: ['mute', 'เลือกข้อแล้ว'], none: ['bad', 'ยังไม่เริ่ม'] };
const itemCell = x => `<div class="isrc"><span>${esc(x.src)}</span>${x.paper ? ' <span class="now-tag soft">กระดาษ</span>' : ''}</div>
  ${x.q ? `<div class="qline" title="${esc(x.q)}">${esc(x.q)}</div>` : x.img ? '<div class="qline m">(โจทย์เป็นรูป)</div>' : ''}`;

/* ----- สัปดาห์นี้ ----- */
async function wkLoad(force) {
  adMain().innerHTML = '<div class="loading">กำลังโหลดสัปดาห์นี้…</div>';
  let d;
  try { d = await usageGet(U.level, 'week', force); } catch (e) { if (!loginErr(e)) adErr(e, () => wkLoad(true)); return; }
  if (A.page !== 'week') return;
  const k = d.kpi, todo = d.rows.filter(r => r.st !== 'ok');
  const order = { open: 0, low: 1, planned: 2, none: 3 };
  todo.sort((a, b) => order[a.st] - order[b.st] || (a.subject + a.room).localeCompare(b.subject + b.room, 'th'));
  const kpi = (label, v, sub, tone) => `<div><span>${label}</span><b>${v}</b><span class="${tone || ''}">${sub}</span></div>`;
  const recent = d.items.slice(0, 12);
  adMain().innerHTML = `
    <div class="pg-head"><div class="t"><h1>สัปดาห์นี้</h1><p>${d.week ? `สัปดาห์ที่ ${d.week} · ${esc(d.weekRange)}` : 'วันนี้ไม่อยู่ในปฏิทินสัปดาห์'}${d.level !== 'all' ? ' · ' + esc(d.level) : ''}</p></div>
      <div class="acts">${lvSelect('wk-lv', d)}<button class="btn" type="button" id="wk-reload">โหลดใหม่</button></div></div>
    ${!d.week ? '<div class="notice">วันนี้ไม่อยู่ในชีตปฏิทินสัปดาห์ จึงยังไม่มีสถานะรายสัปดาห์</div>' : !d.quota ? '<div class="notice">สัปดาห์นี้ไม่นับโควตา (ตามชีตปฏิทินสัปดาห์)</div>' : ''}
    <section class="sec"><div class="kpis">
      ${kpi('ห้อง–วิชาที่ใช้ข้อสอบแล้ว', `${k.done} <small>/ ${k.total}</small>`, `นับเมื่อนักเรียนตอบตั้งแต่ ${d.useMin}% ของห้อง`, k.total && k.done >= k.total ? 'ok' : '')}
      ${kpi('ครูที่ใช้แล้ว', `${k.tUse} <small>/ ${k.tAll} คน</small>`, k.tAll - k.tUse ? `ยังไม่ได้ใช้ ${k.tAll - k.tUse} คน` : 'ครบทุกคน', k.tAll && k.tUse >= k.tAll ? 'ok' : '')}
      ${kpi('ตอบถูกเฉลี่ย', k.pct === null ? '—' : k.pct + '%', k.answers ? `จาก ${k.answers.toLocaleString('en-US')} คำตอบ · ${k.rounds} คาบ` : 'ยังไม่มีคำตอบสัปดาห์นี้', k.pct !== null && k.pct < 50 ? 'bad' : '')}
    </div></section>
    <div class="cols">
      <section class="sec wide" aria-labelledby="h-recent"><div class="sec-h"><div class="t"><h2 id="h-recent">ข้อสอบที่ใช้ล่าสุด</h2>
          <span class="s">ตอบถูกต่ำกว่า 50% แสดงสีแดง</span></div>${d.items.length > recent.length ? `<button class="link" type="button" id="wk-all">ดูทั้งหมด ${d.items.length} ข้อ</button>` : ''}</div>
        <div class="tw"><table class="tb"><thead><tr><th>ข้อสอบ</th><th>ห้อง</th><th>ระดับความคิด</th><th>เรื่อง</th><th class="r">ตอบถูก</th></tr></thead>
          <tbody>${recent.length ? recent.map(x => `<tr class="top"><td style="min-width:240px">${itemCell(x)}</td>
            <td class="nw"><span class="b">${esc(x.room)}</span><div class="m" style="font-size:13px">${esc(x.t)} · ${esc(x.at)}</div></td>
            <td>${cTag(x.c) || '<span class="m">—</span>'}</td><td class="m" style="min-width:140px">${esc(x.topic || '—')}</td><td class="r nw">${pctTag(x.pct, x.n)}</td></tr>`).join('')
            : '<tr><td colspan="5" class="m">สัปดาห์นี้ยังไม่มีคาบที่ปิดรับคำตอบ</td></tr>'}</tbody></table></div></section>
      <section class="sec narrow" aria-labelledby="h-todo"><div class="sec-h line"><div class="t"><h2 id="h-todo">ยังไม่ได้ใช้สัปดาห์นี้</h2>
          <span class="s">${todo.length ? todo.length + ' ห้อง–วิชา · ตัวเลข = ตอบแล้ว / ต้องตอบให้ถึงเกณฑ์' : 'ทุกห้อง–วิชาใช้แล้ว'}</span></div></div>
        <div class="todo">${todo.slice(0, 40).map(r => { const s = USE_ST[r.st];
          return `<div><span class="t"><b>${esc(r.room)} · ${esc(r.subject)}</b><span>${esc(r.t)}</span></span>
            <span class="st ${s[0]}">${s[1]}${r.st === 'low' || r.st === 'open' ? ` ${r.sent}/${r.need} คน` : ''}</span></div>`; }).join('')
          || '<p class="m" style="padding:12px 20px">ไม่มี</p>'}${todo.length > 40 ? `<p class="m" style="padding:8px 20px 14px;font-size:13px">และอีก ${todo.length - 40} ห้อง–วิชา ดูได้ที่หน้า รายครู / รายห้อง</p>` : ''}</div></section>
    </div>`;
  $('#wk-reload').onclick = () => { U.cache = {}; wkLoad(true); };
  $('#wk-lv').onchange = e => { U.level = e.target.value; wkLoad(); };
  const all = $('#wk-all'); if (all) all.onclick = () => { U.scope = 'week'; adShow('items'); };
}

/* ----- ข้อสอบที่ใช้ ----- */
async function itLoad(force) {
  adMain().innerHTML = '<div class="loading">กำลังโหลดข้อสอบที่ใช้…</div>';
  try { await usageGet(U.level, U.scope, force); } catch (e) { if (!loginErr(e)) adErr(e, () => itLoad(true)); return; }
  if (A.page === 'items') itRender();
}

function itRender() {
  const d = U.cache[U.level + '|' + U.scope];
  const subs = [...new Set(d.items.map(x => x.subject))].sort((a, b) => a.localeCompare(b, 'th'));
  const exams = [...new Set(d.items.map(x => x.exam).filter(Boolean))];
  if (subs.indexOf(U.subj) < 0) U.subj = 'all';
  if (exams.indexOf(U.exam) < 0) U.exam = 'all';
  const q = U.q.trim().toLowerCase();
  const rows = d.items.filter(x => (U.subj === 'all' || x.subject === U.subj) && (U.exam === 'all' || x.exam === U.exam) && (!U.low || (x.pct !== null && x.pct < 50)) &&
    (!q || [x.src, x.q, x.topic, x.room, x.t, x.c].join(' ').toLowerCase().indexOf(q) >= 0));
  const n = rows.reduce((t, x) => t + x.n, 0), ok = rows.reduce((t, x) => t + (x.pct === null ? 0 : Math.round(x.pct * x.n / 100)), 0);
  const opt = (v, cur, label) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label || v)}</option>`;
  adMain().innerHTML = `
    <div class="pg-head"><div class="t"><h1>ข้อสอบที่ใช้</h1><p>ข้อที่ครูใช้ในคาบและปิดรับแล้ว เรียงจากล่าสุด${d.level !== 'all' ? ' · ' + esc(d.level) : ''}</p></div>
      <div class="acts">${lvSelect('it-lv', d)}<button class="btn" type="button" id="it-reload">โหลดใหม่</button></div></div>
    <div class="tabs" role="tablist" aria-label="ช่วงเวลา"><button type="button" role="tab" data-scope="week" aria-selected="${d.scope === 'week'}">สัปดาห์นี้${d.week ? ' (ส.' + d.week + ')' : ''}</button>
      <button type="button" role="tab" data-scope="term" aria-selected="${d.scope === 'term'}">ทั้งภาคเรียน</button></div>
    <section class="sec">
      <div class="fbar">
        <input class="box" id="it-q" type="search" placeholder="ค้นหา ข้อสอบ โจทย์ เรื่อง ห้อง หรือครู" value="${esc(U.q)}" aria-label="ค้นหา">
        <select class="box" id="it-sub" aria-label="วิชา">${opt('all', U.subj, 'ทุกวิชา')}${subs.map(s => opt(s, U.subj)).join('')}</select>
        <select class="box" id="it-exam" aria-label="ประเภทข้อสอบ">${opt('all', U.exam, 'ทุกประเภท')}${exams.map(s => opt(s, U.exam)).join('')}</select>
        <label class="ck"><input type="checkbox" id="it-low" ${U.low ? 'checked' : ''}> เฉพาะที่ตอบถูกต่ำกว่า 50%</label>
      </div>
      <div class="sec-h" style="padding-top:4px"><span class="s">${rows.length} คาบ${n ? ` · ${n.toLocaleString('en-US')} คำตอบ · ตอบถูกเฉลี่ย ${Math.round(ok / n * 100)}%` : ''}${d.more ? ` · แสดง 400 คาบล่าสุด (ทั้งหมด ${d.items.length + d.more})` : ''}</span>
        ${rows.length ? '<button class="btn sm" type="button" id="it-copy">คัดลอกตาราง</button>' : ''}</div>
      <div class="tw"><table class="tb"><thead><tr><th>วันที่</th><th>ข้อสอบ</th><th>วิชา</th><th>ห้อง · ครู</th><th>ระดับความคิด</th><th>เรื่อง / ตัวชี้วัด</th><th class="r">ตอบถูก</th><th>รายงาน</th></tr></thead>
        <tbody>${rows.length ? rows.map(x => `<tr class="top"><td class="nw m">${esc(x.at)}</td><td style="min-width:260px">${itemCell(x)}</td><td class="nw">${esc(x.subject)}</td>
          <td class="nw"><span class="b">${esc(x.room)}</span><div class="m" style="font-size:13px">${esc(x.t)}</div></td><td>${cTag(x.c) || '<span class="m">—</span>'}</td>
          <td class="m" style="min-width:160px">${esc(x.topic || '—')}</td><td class="r nw">${pctTag(x.pct, x.n)}</td>
          <td><span class="st ${x.rep ? 'ok' : 'wait'}">${x.rep ? 'ส่งแล้ว' : 'รอส่ง'}</span></td></tr>`).join('')
          : `<tr><td colspan="8" class="m">${d.items.length ? 'ไม่พบตามตัวกรอง' : d.scope === 'week' ? 'สัปดาห์นี้ยังไม่มีคาบที่ปิดรับคำตอบ' : 'ยังไม่มีคาบที่ปิดรับคำตอบ'}</td></tr>`}</tbody></table></div></section>`;
  $('#it-reload').onclick = () => { U.cache = {}; itLoad(true); };
  $('#it-lv').onchange = e => { U.level = e.target.value; itLoad(); };
  $$('[data-scope]', adMain()).forEach(b => b.onclick = () => { if (U.scope !== b.dataset.scope) { U.scope = b.dataset.scope; itLoad(); } });
  const qi = $('#it-q');
  qi.oninput = () => { U.q = qi.value; clearTimeout(U.t); U.t = setTimeout(() => { itRender(); const el = $('#it-q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 250); };
  $('#it-sub').onchange = e => { U.subj = e.target.value; itRender(); };
  $('#it-exam').onchange = e => { U.exam = e.target.value; itRender(); };
  $('#it-low').onchange = e => { U.low = e.target.checked; itRender(); };
  const cp = $('#it-copy');
  if (cp) cp.onclick = () => copyText([['วันที่', 'ข้อสอบ', 'วิชา', 'ห้อง', 'ครู', 'ระดับความคิด', 'เรื่อง', 'จำนวนคำตอบ', 'ตอบถูก (%)', 'รายงาน'].join('\t')]
    .concat(rows.map(x => [x.at, x.src, x.subject, x.room, x.t, x.c, x.topic, x.n, x.pct === null ? '' : x.pct, x.rep ? 'ส่งแล้ว' : 'รอส่ง'].join('\t'))).join('\n'), 'คัดลอกตารางแล้ว');
}

/* ----- ตั้งค่าและแก้ปัญหา ----- */

  adMain().innerHTML = '<div class="loading">กำลังตรวจระบบ…</div>';
  try { await ovFetch(force); } catch (e) { if (!loginErr(e)) adErr(e, () => sysLoad(true)); return; }

}

        ${info.map(x => `<div class="mute"><span class="dot"></span><span class="t"><b>${esc(x.title)}</b><span>${esc(x.detail)}</span></span></div>`).join('')}</div></section>

    <div class="cols">

          <span class="s">ปกติ ${okReady.length} จาก ${o.ready.length} รายการ</span></div></div>
        <div class="roles">${badReady.concat(okReady).map(x => `<div><span class="t"><b>${esc(x.label)} · ${esc(x.value)}</b><span>${esc(x.sub)}</span></span>

          <div><span class="t"><b>คลังข้อสอบ · ${(bi.items || 0).toLocaleString('en-US')} ข้อ</b><span>มีรูปโจทย์ ${(bi.img || 0).toLocaleString('en-US')} ข้อ · ครูใช้ในคาบแล้ว ${(bi.used || 0).toLocaleString('en-US')} ข้อ</span></span>${fixBtn('bank') ? `<a class="link" href="${esc(sh.bank)}" target="_blank" rel="noopener">เปิดชีต ↗</a>` : ''}</div></div></section>
      <section class="sec half" aria-labelledby="h-role"><div class="sec-h line"><h2 id="h-role">ผู้ใช้และสิทธิ์</h2></div>
        <div class="roles">${o.roles.map(x => `<div><span class="t"><b>${esc(x.role)}</b><span>${esc(x.can)}</span></span><b>${x.n}</b></div>`).join('')}</div>

  };
  const la = $('#lo-all');
  if (la) la.onclick = () => openSheet(sheetHead('ออกจากระบบครูทุกเครื่อง', 'ครูทุกคนรวมถึงคุณจะต้องเข้าสู่ระบบใหม่ คาบที่เปิดรับอยู่ไม่ได้รับผลกระทบ นักเรียนยังตอบได้ตามปกติ') +
    `<div class="dock" style="position:static;padding:0;border:0;background:none"><div class="two"><button class="btn-s" type="button" data-x>ยกเลิก</button><button class="btn-p" type="button" id="la-yes">ออกจากระบบทุกเครื่อง</button></div></div>`,
    () => { $('#la-yes').onclick = async () => {
      const b = $('#la-yes'); b.disabled = true;
      try { await api('adminLogoutAll'); closeSheet(); TK.clear(); T.data = null; A.ov = null; A.d = null; DB.d = null; U.cache = {}; showLogin('ออกจากระบบครูทุกเครื่องแล้ว'); }
      catch (e) { b.disabled = false; if (!loginErr(e)) toast(failMsg(e)); }
    }; });
}

/* ----- แบบประเมินรายระดับชั้น ----- */
async function asmLoad(level) {
  adMain().innerHTML = '<div class="loading">กำลังโหลดแบบประเมิน…</div>';
  try {
    if (!level) {
      const lv = A.ov ? A.ov.asm.map(x => x.level) : (await api('adminAssessList')).levels.map(x => x.level);
      if (!lv.length) { adMain().innerHTML = '<div class="pg-head"><div class="t"><h1>แบบประเมินรวม</h1></div></div><div class="notice">ยังไม่มีระดับชั้นในชีตห้องเรียน</div>'; return; }
      level = lv[0];
    }
    A.level = level;
    A.d = await api('adminAssessGet', level);
  } catch (e) { if (!/^LOGIN:/.test(userMsg(e) || '')) adErr(e, () => asmLoad(level)); return; }
  A.cfg = JSON.parse(JSON.stringify(A.d.cfg)); A.dirty = false; A.armClose = false;
  asmRender();
}

const cfgTotal = () => A.cfg.quotas.reduce((t, q) => t + (Number(q.n) || 0), 0);

function asmRender() {
  const d = A.d, c = A.cfg, s = d.summary || {}, edit = d.canEdit;
  const phase = d.exists ? s.phase : 'none';
  const draftView = !d.exists || phase === 'draft';
  const keepY = window.scrollY;
  const tabs = `<div class="tabs" role="tablist" aria-label="ระดับชั้น">${d.levels.map(x => `<button type="button" role="tab" data-tab="${esc(x.level)}" aria-selected="${x.level === d.level}">${esc(x.level)}${x.phase ? ` <span style="font-size:13px;font-weight:400">· ${esc((PHASE[x.phase] || PHASE.none)[1].split(' · ')[0])}</span>` : ''}</button>`).join('')}</div>`;
  const head = `<div class="pg-head"><div class="t"><div><h1>${esc(c.title || 'แบบประเมินรวม ' + d.level)}</h1>${phaseSt(phase)}</div>
        <p>${esc(d.level)} · นักเรียน ${d.students.toLocaleString('en-US')} คน ${d.roomCount} ห้อง · ครูประจำชั้นที่ส่งลิงก์ต่อได้ ${d.homeroomCount} จาก ${d.roomCount} ห้อง</p></div>
      <div class="acts">${asmActs(d, phase)}</div></div>${tabs}
    ${edit ? '' : '<div class="notice">สิทธิ์ดูอย่างเดียว ผู้ดูแลระบบเป็นผู้แก้ไขและประกาศแบบประเมิน</div>'}
    ${(d.uncovered || []).length ? `<div class="notice wait" role="note"><span><b>${d.uncovered.length} ห้องไม่มีครูประจำชั้นที่ส่งลิงก์ต่อได้:</b> ${d.uncovered.map(x => `${esc(x.room)} (${esc(x.why)})`).join(' · ')}
      <br>กรุณาแก้ไขในชีตห้องเรียนหรือชีตครู หรือส่งข้อความให้ห้องเหล่านี้จากตารางความคืบหน้า</span></div>` : ''}
    <span class="err" id="as-err" role="alert"></span>`;
  adMain().innerHTML = head + (draftView ? asmDraft(d, c, edit) : asmLive(d, c, s, edit)) +
    (A.dirty && edit ? `<div class="savebar" role="region" aria-label="การแก้ไขที่ยังไม่บันทึก"><span>มีการแก้ไขที่ยังไม่บันทึก</span>
      <button class="btn sm" type="button" id="sv-undo">ยกเลิก</button><button class="btn sm pri" type="button" id="sv-save">${draftView ? 'บันทึกร่าง' : 'บันทึก'}</button></div>` : '');
  asmBind(d, s, edit, draftView);
  window.scrollTo(0, keepY);
}

function asmActs(d, phase) {
  if (!d.canEdit) return d.exists ? '<button class="btn" type="button" data-a="preview">ดูแบบที่นักเรียนเห็น</button>' : '';
  if (phase === 'none') return '<button class="btn pri" type="button" data-a="create">สร้างร่างแบบประเมิน</button>';
  if (phase === 'draft') return `<button class="btn" type="button" data-a="preview">ดูแบบที่นักเรียนเห็น</button><button class="btn pri" type="button" data-a="publish">ประกาศให้นักเรียนทำ</button>`;
  if (phase === 'closed') return `<button class="btn" type="button" data-a="reopen">เปิดรับอีกครั้ง</button><button class="btn pri" type="button" data-a="newround">เริ่มรอบใหม่</button>`;
  return `${d.answered ? '' : '<button class="btn" type="button" data-a="todraft">กลับเป็นร่าง</button>'}<button class="btn" type="button" data-a="extend">ขยายเวลา</button>
    <button class="btn red" type="button" data-a="close">${A.armClose ? 'กดอีกครั้งเพื่อยืนยัน' : 'ปิดรับก่อนกำหนด'}</button>`;
}

function asmDraft(d, c, edit) {
  const pool = d.pool[c.source] || {};
  const lock = !edit;
  const used = new Set(c.quotas.map(q => q.exam + '|' + q.subject));
  const addable = d.exams.map(e => ({ e, subs: (d.subjects[e] || []).filter(s => !used.has(e + '|' + s)) })).filter(x => x.subs.length);
  const total = cfgTotal();
  const quotaRows = c.quotas.map((q, i) => {
    const have = pool[q.exam + '|' + q.subject] || 0, n = Number(q.n) || 0, short = n > have;
    return `<tr class="${n ? '' : 'zero'}"><td><span class="etag">${esc(q.exam)}</span></td><td class="b">${esc(q.subject)}</td>
      <td>${lock ? `<b class="num">${n}</b>` : `<span class="stepper"><button type="button" data-q="${i}" data-d="-1" aria-label="ลด ${esc(q.subject)}">−</button><span aria-live="polite">${n}</span><button type="button" data-q="${i}" data-d="1" aria-label="เพิ่ม ${esc(q.subject)}">+</button></span>`}</td>
      <td class="num">${have} ข้อ${short ? ` <span class="bad" style="font-weight:600">ขาด ${n - have}</span>` : ''}</td>
      <td class="r">${lock ? '' : `<button class="link mute" type="button" data-qdel="${i}" aria-label="นำ ${esc(q.subject)} ออก">นำออก</button>`}</td></tr>`;
  }).join('');
  const items = d.items || [];
  const itemRows = items.map(it => `<tr class="top"><td class="num m">${it.pos}</td>
      <td class="read">${it.missing ? `<span class="err">ไม่พบข้อ ${esc(it.id)} ในคลัง</span>` : `<div class="qtags" style="margin-bottom:4px"><span class="etag">${esc(it.exam)}</span><span class="sj">${esc(it.subject)}</span>${cTag(it.c)}${diffTag(it.diff)}</div>
        <span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(it.q || 'โจทย์เป็นรูปภาพ')}</span>`}</td>
      <td class="r nw">${edit ? `<button class="btn sm" type="button" data-it="${it.pos}" data-ia="${it.locked ? 'unlock' : 'lock'}">${it.locked ? 'ปลดล็อก' : 'ล็อก'}</button>
        ${it.locked ? '' : `<button class="btn sm" type="button" data-it="${it.pos}" data-ia="replace">เปลี่ยนข้อ</button><button class="link mute" type="button" data-it="${it.pos}" data-ia="remove" style="margin-left:6px">นำออก</button>`}` : it.locked ? '<span class="m">ล็อก</span>' : ''}</td></tr>`).join('');
  return `<div class="cols">
    <div class="wide" style="display:flex;flex-direction:column;gap:20px">
      <section class="sec" aria-labelledby="h-q"><div class="sec-h"><div class="t"><h2 id="h-q">สัดส่วนข้อสอบ</h2></div></div>
        <div class="tw"><table class="tb"><thead><tr><th>ประเภท</th><th>วิชา</th><th>จำนวนข้อ</th><th>ข้อในคลังที่ใช้ได้</th><th></th></tr></thead>
          <tbody>${quotaRows || '<tr><td colspan="5" class="m">ยังไม่มีวิชา</td></tr>'}</tbody></table></div>
        <div class="sec-pad" style="flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;border-top:1px solid var(--line-2)">
          ${!lock && addable.length ? `<div class="addrow"><select id="add-exam" aria-label="ประเภทข้อสอบ">${addable.map(x => `<option>${esc(x.e)}</option>`).join('')}</select>
            <select id="add-sub" aria-label="วิชา"></select><button class="btn sm" type="button" id="add-go">+ เพิ่มวิชา</button></div>` : '<span></span>'}
          <b class="num">${total ? `รวม ${total} ข้อ · ประมาณ ${Math.max(10, Math.round(total * 1.75))} นาที` : 'ยังไม่ได้กำหนดจำนวนข้อ'}</b></div></section>
      <section class="sec" aria-labelledby="h-it"><div class="sec-h line"><div class="t"><h2 id="h-it">รายการข้อ${d.exists ? ` (${items.length} / ${d.summary.need} ข้อ)` : ''}</h2>
          <span class="s">ข้อที่ไม่ล็อกอาจถูกเปลี่ยนเมื่อสุ่มใหม่</span></div>
          ${edit && d.exists ? `<button class="btn pri sm" type="button" data-a="fill"${A.dirty ? ' disabled title="บันทึกร่างก่อน"' : ''}>สุ่มเติมให้ครบ ${d.summary.need} ข้อ</button>` : ''}</div>
        ${d.exists ? (items.length ? `<div class="tw"><table class="tb"><tbody>${itemRows}</tbody></table></div>` : '<p class="empty">ยังไม่มีข้อ</p>')
          : `<p class="empty">${edit ? 'บันทึกร่างก่อนสุ่มข้อ' : 'ยังไม่ได้สร้างแบบประเมินของระดับชั้นนี้'}</p>`}</section>
    </div>
    <div class="narrow">
      <section class="sec" aria-labelledby="h-time"><div class="sec-h"><h2 id="h-time">ชื่อและกำหนดเวลา</h2></div>
        <div class="sec-pad" style="padding-top:0">
          <div class="field"><label for="f-title">ชื่อแบบประเมิน</label><input id="f-title" class="box" maxlength="120" value="${esc(c.title)}" ${lock ? 'disabled' : ''}></div>
          <div class="field"><label for="f-open">เปิดให้ทำ</label><input id="f-open" class="box" type="datetime-local" value="${esc(c.openAt)}" ${lock ? 'disabled' : ''}><span class="date-hint" data-for="f-open" aria-live="polite">${dtHint(c.openAt)}</span><span class="note">เว้นว่าง = เปิดเมื่อประกาศ</span></div>
          <div class="field"><label for="f-close">ปิดรับ</label><input id="f-close" class="box" type="datetime-local" value="${esc(c.closeAt)}" ${lock ? 'disabled' : ''}><span class="date-hint" data-for="f-close" aria-live="polite">${dtHint(c.closeAt)}</span><span class="note">เว้นว่าง = ไม่กำหนดเวลาปิด</span></div>
        </div></section>
      <section class="sec" aria-labelledby="h-src"><div class="sec-h"><h2 id="h-src">ที่มาของข้อ</h2></div>
        <div class="sec-pad" style="padding-top:0;gap:8px" role="radiogroup" aria-labelledby="h-src">${d.sources.map(x => `<button type="button" class="src" role="radio" aria-checked="${x === c.source}" data-src="${esc(x)}" ${lock ? 'disabled' : ''}>
          <span class="rd"></span><span class="t"><b>${esc(x)}</b><span>${esc(SRC_DESC[x] || '')}</span></span></button>`).join('')}</div></section>
      ${asmToggles(c, edit, true)}
    </div></div>`;
}

function asmToggles(c, edit, draft) {
  const rows = [['shuffle', 'คละลำดับข้อ', draft], ['shuffleOpts', 'คละตัวเลือก', draft], ['tags', 'แสดงป้ายประเภท วิชา และระดับ C', true],
    ['showScore', 'แสดงคะแนนหลังส่ง', true], ['showAns', 'แสดงเฉลยหลังส่ง', true]].filter(x => x[2]);
  return `<section class="sec" aria-labelledby="h-tg"><div class="sec-h"><h2 id="h-tg">การทำและการแสดงผล</h2></div>
    <div class="toggles">${rows.map(([k, l]) => `<div><span id="tg-${k}">${l}</span><button type="button" class="sw" role="switch" aria-labelledby="tg-${k}" aria-checked="${!!c[k]}" data-tg="${k}" ${edit ? '' : 'disabled'}></button></div>`).join('')}</div></section>`;
}

function asmLive(d, c, s, edit) {
  const p = d.progress || { rooms: [], done: 0, size: 0, pct: null, dups: [] };
  const full = p.rooms.filter(x => x.size && x.done >= x.size).length;
  const tl = [
    { d: 'ok', b: 'ประกาศแล้ว', s: 'ครูประจำชั้นส่งลิงก์ต่อจากหน้าห้องเรียน' },
    { d: s.phase === 'scheduled' ? 'next' : 'ok', b: 'เปิดให้ทำ' + (s.openShort ? ' ' + s.openShort + ' น.' : ' เมื่อประกาศ'), s: '' },
    { d: s.phase === 'live' ? 'next' : s.phase === 'closed' ? 'ok' : 'wait', b: 'ครูประจำชั้นติดตามและเตือนในกลุ่มห้อง', s: 'ระบบไม่ส่งข้อความเตือนอัตโนมัติ' },
    { d: s.phase === 'closed' ? 'ok' : 'wait', b: 'ปิดรับ' + (s.closeShort ? ' ' + s.closeShort : ' เมื่อกดปิดรับ'), s: 'ผลแสดงในรายงานการใช้ในคาบ' }
  ];
  return `<section class="sec"><div class="kpis">
      <div><span>ทำแล้ว</span><b>${p.done.toLocaleString('en-US')} <span style="font-size:15px;color:var(--muted);font-weight:500">/ ${p.size.toLocaleString('en-US')} คน</span></b><span>${p.pct === null ? '—' : p.pct + '%'}${p.unknown ? ` · ไม่ระบุห้อง ${p.unknown}` : ''}</span></div>
      <div><span>ห้องที่ทำครบ</span><b>${full} <span style="font-size:15px;color:var(--muted);font-weight:500">/ ${p.rooms.length} ห้อง</span></b><span></span></div>
      <div><span>ปิดรับ</span><b style="font-size:20px">${esc(s.closeShort || 'ยังไม่กำหนด')}</b><span>${s.closeMs && s.phase !== 'closed' ? 'อีก ' + leftText(s.closeMs) : s.phase === 'closed' ? 'ปิดรับแล้ว' : 'ไม่กำหนดเวลาปิด'}</span></div>
      <div><span>ข้อในชุด</span><b>${s.have} ข้อ</b><span>ประมาณ ${s.minutes} นาที · ตอบแล้ว ${d.answered} ครั้ง</span></div></div></section>
    <div class="cols">
      <section class="sec wide" aria-labelledby="h-prog"><div class="sec-h"><div class="t"><h2 id="h-prog">ความคืบหน้ารายห้อง</h2><span class="s">ข้อมูล ณ ${esc(d.asOf)}</span></div>
          <button class="link" type="button" id="pg-reload">โหลดใหม่</button></div>
        <div class="tw"><table class="tb"><thead><tr><th>ห้อง</th><th>ครูประจำชั้น</th><th>ทำแล้ว</th><th></th></tr></thead>
          <tbody>${p.rooms.map(x => `<tr class="top"><td class="b">${esc(x.room)}</td>
            <td>${x.covered ? `<span>${esc(x.homeroom)}</span><div class="m" style="font-size:13px">${x.seen ? 'เปิดดูล่าสุด ' + esc(x.seen) : 'ยังไม่ได้เปิดดู'}</div>`
              : `<span class="wait">${esc(x.why || 'ยังไม่ระบุในชีตห้องเรียน')}</span>`}</td>
            <td><div class="meter"><div class="track${x.pct !== null && x.pct < 50 && s.phase !== 'scheduled' ? ' low' : ''}"><span style="width:${x.pct || 0}%"></span></div><span class="v">${x.done} / ${x.size || '?'}</span></div></td>
            <td class="r nw">${!x.covered && x.share && s.phase !== 'closed' ? `<button class="btn sm" type="button" data-copy="${esc(x.share)}">คัดลอกข้อความส่งต่อ</button> ` : ''}${s.phase === 'live' && x.size && x.done < x.size ? `<button class="btn sm" type="button" data-copy="${esc(x.remind)}">คัดลอกข้อความเตือน</button>` : x.size && x.done >= x.size ? '<span class="st ok">ครบแล้ว</span>' : ''}</td></tr>`).join('')}</tbody></table></div>
        ${p.dups.length ? `<details class="more"><summary>รหัสที่ส่งซ้ำ ${p.dups.length} รหัส</summary><div class="sec-pad" style="padding-top:0"><span>${p.dups.map(x => `${esc(x.id)} (${x.n} ครั้ง)`).join(' · ')}</span><span class="note">ระบบนับเฉพาะครั้งแรก</span></div></details>` : ''}</section>
      <div class="narrow">
        <section class="sec" aria-labelledby="h-share"><div class="sec-h"><h2 id="h-share">ช่องทางส่งให้นักเรียน</h2></div>
          <div class="sec-pad" style="padding-top:0"><div class="share-row"><div class="qrbox" id="as-qr"></div>
            <div style="display:flex;flex-direction:column;gap:8px"><button class="btn sm" type="button" data-copy="${esc(s.link)}">คัดลอกลิงก์</button>
              <button class="btn sm" type="button" data-a="poster">โปสเตอร์ QR (A4)</button><a class="btn sm" href="${esc(lineShare(s.share))}" target="_blank" rel="noopener">ส่งเข้า LINE</a></div></div>
            <span class="note">ข้อความที่ส่งต่อ</span><div class="msg">${esc(s.share)}</div></div></section>
        <section class="sec" aria-labelledby="h-tl"><div class="sec-h"><h2 id="h-tl">กำหนดการ</h2></div>
          <div class="sec-pad" style="padding-top:0"><ol class="timeline">${tl.map(x => `<li><span class="d ${x.d}"></span><span><b>${esc(x.b)}</b><small>${esc(x.s)}</small></span></li>`).join('')}</ol></div></section>
        ${asmToggles(c, edit, false)}
      </div></div>
    <details class="sec more"><summary>ดูข้อในชุด (${(d.items || []).length} ข้อ)</summary>
      <div class="tw"><table class="tb"><tbody>${(d.items || []).map(it => `<tr class="top"><td class="num m">${it.pos}</td><td class="read">${it.missing ? `<span class="err">ไม่พบข้อ ${esc(it.id)}</span>` : `<div class="qtags" style="margin-bottom:4px"><span class="etag">${esc(it.exam)}</span><span class="sj">${esc(it.subject)}</span>${cTag(it.c)}</div>${esc(it.q || 'โจทย์เป็นรูปภาพ')}`}</td></tr>`).join('')}</tbody></table></div></details>`;
}

function leftText(ms) {
  const m = Math.max(0, Math.round((ms - Date.now()) / 60000));
  if (m < 60) return m + ' นาที';
  const h = Math.floor(m / 60);
  return h < 48 ? h + ' ชั่วโมง' : Math.floor(h / 24) + ' วัน';
}

function asmBind(d, s, edit, draftView) {
  const m = adMain();
  $$('[data-tab]', m).forEach(b => b.onclick = () => { if (b.dataset.tab === d.level) return; if (A.dirty && !confirm('มีการแก้ไขที่ยังไม่บันทึก ต้องการเปลี่ยนระดับชั้นหรือไม่')) return; asmLoad(b.dataset.tab); });
  $$('[data-copy]', m).forEach(b => b.onclick = () => copyText(b.dataset.copy, b.dataset.copy.startsWith('http') ? 'คัดลอกลิงก์แล้ว' : 'คัดลอกข้อความแล้ว'));
  const qr = $('#as-qr'); if (qr && s.link) drawQr(qr, s.link, 320);
  const rl = $('#pg-reload'); if (rl) rl.onclick = () => asmLoad(d.level);
  $$('[data-a]', m).forEach(b => b.onclick = () => asmAct(b.dataset.a, b));
  if (!edit) return;
  const dirty = () => { if (!A.dirty) { A.dirty = true; asmRender(); } };
  $$('[data-d]', m).forEach(b => b.onclick = () => {
    const q = A.cfg.quotas[+b.dataset.q]; q.n = Math.max(0, Math.min(60, (Number(q.n) || 0) + Number(b.dataset.d))); A.dirty = true; asmRender();
  });
  $$('[data-qdel]', m).forEach(b => b.onclick = () => { A.cfg.quotas.splice(+b.dataset.qdel, 1); A.dirty = true; asmRender(); });
  const ae = $('#add-exam'), as = $('#add-sub');
  if (ae) {
    const used = new Set(A.cfg.quotas.map(q => q.exam + '|' + q.subject));
    const fill = () => { as.innerHTML = (d.subjects[ae.value] || []).filter(x => !used.has(ae.value + '|' + x)).map(x => `<option>${esc(x)}</option>`).join(''); };
    ae.onchange = fill; fill();
    $('#add-go').onclick = () => { if (!as.value) return; A.cfg.quotas.push({ exam: ae.value, subject: as.value, n: 5 }); A.dirty = true; asmRender(); };
  }
  [['f-title', 'title'], ['f-open', 'openAt'], ['f-close', 'closeAt']].forEach(([id, k]) => {
    const el = $('#' + id); if (el) el.oninput = el.onchange = () => { A.cfg[k] = el.value; if (k === 'title') { const h = $('.pg-head h1', m); if (h) h.textContent = el.value || 'แบบประเมินรวม ' + d.level; } if (!A.dirty) { A.dirty = true; const f = document.activeElement && document.activeElement.id; asmRender(); f && $('#' + f) && $('#' + f).focus(); } };
  });
  $$('[data-src]', m).forEach(b => b.onclick = () => { A.cfg.source = b.dataset.src; A.dirty = true; asmRender(); });
  $$('[data-tg]', m).forEach(b => b.onclick = () => { A.cfg[b.dataset.tg] = !A.cfg[b.dataset.tg]; A.dirty = true; asmRender(); });
  $$('[data-it]', m).forEach(b => b.onclick = () => asmBusy(b, () => api('adminAssessItem', d.level, +b.dataset.it, b.dataset.ia)));
  const sv = $('#sv-save'); if (sv) sv.onclick = () => asmBusy(sv, () => api('adminAssessSave', d.level, A.cfg), 'บันทึกแล้ว');
  const un = $('#sv-undo'); if (un) un.onclick = () => { A.cfg = JSON.parse(JSON.stringify(A.d.cfg)); A.dirty = false; asmRender(); };
  void dirty;
}

async function asmBusy(btn, fn, okMsg) {
  btn.disabled = true;
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r) : okMsg); }
  catch (e) { btn.disabled = false; $('#as-err').textContent = failMsg(e); $('#as-err').scrollIntoView({ block: 'center' }); return false; }
  await asmLoad(A.level);
  return true;
}

async function asmAct(a, btn) {
  const d = A.d, lv = d.level;
  if (a === 'preview') return asmPreview();
  if (a === 'create') return asmBusy(btn, () => api('adminAssessSave', lv, A.cfg), 'สร้างร่างแล้ว');
  if (a === 'fill') return asmBusy(btn, () => api('adminAssessFill', lv), r => r.short.length ? 'ข้อในคลังไม่เพียงพอ: ' + r.short.join(' · ') : 'สุ่มเติมครบแล้ว');
  if (a === 'publish') {
    if (A.dirty) return toast('กรุณาบันทึกร่างก่อนประกาศ');
    const s = d.summary;
    openSheet(sheetHead('ยืนยันการประกาศแบบประเมิน', `${lv} · ${s.have} ข้อ ประมาณ ${s.minutes} นาที`) + `
      <div class="notice">${s.openText ? 'เปิดให้ทำ ' + esc(s.openText) : 'เปิดให้ทำทันที'}${s.closeText ? ' · ปิดรับ ' + esc(s.closeText) : ' · ไม่กำหนดเวลาปิด'}</div>
      <p class="note">หลังประกาศจะแก้ไขข้อและสัดส่วนไม่ได้</p>
      ${s.have < s.need ? `<div class="notice wait">มีข้อ ${s.have} จาก ${s.need} ข้อ ยังไม่ครบตามสัดส่วน</div>` : ''}
      ${(d.uncovered || []).length ? `<div class="notice wait"><span><b>${d.uncovered.map(x => esc(x.room)).join(', ')}</b> ไม่มีครูประจำชั้นที่ส่งลิงก์ต่อได้</span></div>` : ''}
      ${!s.have ? '<div class="notice wait" role="alert">ยังไม่มีข้อในแบบประเมิน กดสุ่มเติมข้อก่อนจึงประกาศได้</div>' : ''}
      <span class="err" id="go-err" role="alert"></span><button class="btn-p" type="button" id="go"${s.have ? '' : ' disabled'}>${!s.have ? 'ประกาศไม่ได้' : s.have < s.need ? `ประกาศทั้งที่มี ${s.have} จาก ${s.need} ข้อ` : 'ประกาศ'}</button>`, () => {
      $('#go').onclick = async () => {
        $('#go').disabled = true;
        try { await api('adminAssessStatus', lv, 'เปิด'); } catch (e) { $('#go-err').textContent = failMsg(e); $('#go').disabled = false; return; }
        closeSheet(); toast('ประกาศแล้ว'); asmLoad(lv);
      };
    });
    return;
  }
  if (a === 'close') {
    if (!A.armClose) { A.armClose = true; asmRender(); setTimeout(() => { if (A.armClose) { A.armClose = false; if (A.page === 'assess') asmRender(); } }, 5000); return; }
    A.armClose = false;
    return asmBusy(btn, () => api('adminAssessStatus', lv, 'ปิด'), 'ปิดรับแล้ว');
  }
  if (a === 'reopen') {
    if (d.summary.closeMs && d.summary.closeMs <= Date.now()) return asmAct('extend', btn);
    return asmBusy(btn, () => api('adminAssessStatus', lv, 'เปิด'), 'เปิดรับอีกครั้งแล้ว');
  }
  if (a === 'todraft') {
    if (!confirm('ยืนยันการกลับเป็นร่าง นักเรียนจะเข้าทำไม่ได้จนกว่าจะประกาศใหม่')) return;
    return asmBusy(btn, () => api('adminAssessStatus', lv, 'ร่าง'), 'กลับเป็นร่างแล้ว');
  }
  if (a === 'newround') {
    if (!confirm('ยืนยันการเริ่มแบบประเมินรอบใหม่ของ ' + lv)) return;
    const t = A.cfg.title.replace(/ครั้งที่\s*(\d+)/, (x, n) => 'ครั้งที่ ' + (Number(n) + 1));
    return asmBusy(btn, () => api('adminAssessSave', lv, Object.assign({}, A.cfg, { title: t === A.cfg.title ? A.cfg.title + ' (รอบใหม่)' : t, openAt: '', closeAt: '', newRound: true })), 'สร้างรอบใหม่แล้ว (ร่าง)');
  }
  if (a === 'extend') {
    const reopen = d.summary.phase === 'closed';
    openSheet(sheetHead(reopen ? 'เปิดรับอีกครั้ง' : 'ขยายเวลา', lv) + `
      <div class="field"><label for="x-close">ปิดรับใหม่</label><input id="x-close" class="input" type="datetime-local" value="${esc(A.cfg.closeAt)}"><span class="date-hint" data-for="x-close" aria-live="polite">${dtHint(A.cfg.closeAt)}</span></div>
      <span class="err" id="go-err" role="alert"></span><button class="btn-p" type="button" id="go">${reopen ? 'บันทึกและเปิดรับ' : 'บันทึกเวลาใหม่'}</button>`, () => {
      $('#go').onclick = async () => {
        const v = $('#x-close').value;
        if (!v || new Date(v) <= new Date()) { $('#go-err').textContent = 'กรุณาเลือกเวลาปิดรับในอนาคต'; return; }
        $('#go').disabled = true;
        try {
          await api('adminAssessSave', lv, Object.assign({}, A.cfg, { closeAt: v }));
          if (reopen) await api('adminAssessStatus', lv, 'เปิด');
        } catch (e) { $('#go-err').textContent = failMsg(e); $('#go').disabled = false; return; }
        closeSheet(); toast('บันทึกเวลาปิดรับใหม่แล้ว'); asmLoad(lv);
      };
    });
    return;
  }
  if (a === 'poster') {
    const s = d.summary, pa = $('#print-area');
    pa.innerHTML = `<h1>${esc(s.title)}</h1><p>นักเรียนชั้น ${esc(lv)} · ${s.need} ข้อ ประมาณ ${s.minutes} นาที</p><div id="pa-qr"></div>
      <p>${s.closeText ? 'ปิดรับ ' + esc(s.closeText) : ''}</p><p style="font-size:11pt">${esc(s.link)}</p><p style="font-size:11pt">นักเรียนที่ไม่มีอุปกรณ์ ใช้ห้องคอมพิวเตอร์ของโรงเรียนได้ในช่วงพักกลางวัน</p>`;
    drawQr($('#pa-qr'), s.link, 600);
    setTimeout(() => window.print(), 300);
  }
}

function asmPreview() {
  const d = A.d, items = (d.items || []).filter(x => !x.missing);
  if (!items.length) return toast('ยังไม่มีข้อในชุด');
  let i = 0;
  const draw = () => {
    const it = items[i];
    openSheet(sheetHead('แบบที่นักเรียนเห็น', `ข้อ ${i + 1} / ${items.length}${A.cfg.tags ? '' : ' · ซ่อนป้ายประเภทและวิชา'}${A.cfg.shuffleOpts ? ' · ตัวเลือกสลับลำดับ' : ''}`) + `
      <div class="stu" style="padding:0">
        ${A.cfg.tags ? `<div class="qtags"><span class="ctag solid">${esc(it.exam)}</span><span class="sj">${esc(it.subject)}</span>${it.c ? '<span class="sep">·</span>' + cTag(it.c) : ''}</div>` : ''}
        ${it.q ? `<h1 class="sm">${esc(it.q)}</h1>` : ''}${it.img ? `<figure><img src="${esc(it.img)}" alt="รูปโจทย์" referrerpolicy="no-referrer"></figure>` : ''}
        <div inert>${ansBox(it, null)}</div></div>
      <div class="two" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn-s" type="button" id="pv-prev" ${i ? '' : 'disabled'}>ก่อนหน้า</button><button class="btn-p" type="button" id="pv-next" ${i < items.length - 1 ? '' : 'disabled'}>ข้อถัดไป</button></div>`, () => {
      $('#pv-prev').onclick = () => { i--; draw(); };
      $('#pv-next').onclick = () => { i++; draw(); };
    });
  };
  draw();
}

/* ----- รายงานการใช้ในคาบ (แดชบอร์ดรายระดับชั้น) ----- */
async function dbLoad(level) {
  adMain().innerHTML = '<div class="loading">กำลังโหลดรายงาน…</div>';
  try { DB.d = await api('dashboard', level || null); } catch (e) { if (!/^LOGIN:/.test(userMsg(e) || '')) adErr(e, () => dbLoad(level)); return; }
  DB.level = DB.d.level; if (DB.d.subjects.indexOf(DB.subject) < 0) DB.subject = 'all';
  dbRender();
}

function dbRender() {
  const D = DB.d, subj = DB.subject;
  const rows = D.rows.filter(r => subj === 'all' || r.s === subj);
  const used = v => v === 'p' || (typeof v === 'number' && v >= D.useMin);
  const cont = r => { const c = r.w.filter(v => v !== 'x' && v !== 'w'); return c.length ? Math.round(c.filter(used).length / c.length * 100) : null; };
  const measured = rows.filter(r => cont(r) !== null);
  const contRooms = measured.filter(r => cont(r) >= D.contMin).length;
  const teachers = [...new Set(measured.map(r => r.t))];
  const tUsing = teachers.filter(t => measured.filter(r => r.t === t).every(r => cont(r) >= D.contMin)).length;
  const pc = (a, b) => b ? Math.round(a / b * 100) : null;
  const k1 = pc(tUsing, teachers.length), k2 = pc(contRooms, measured.length), ap = D.assess && D.assess.progress;
  const kpi = (label, v, sub, ok) => `<div><span>${label}</span><b>${v}</b><span class="${ok === null ? '' : ok ? 'ok' : 'wait'}">${sub}</span></div>`;
  const cell = v => v === 'x' ? '<span class="cell off">หยุด</span>' : v === 'w' ? '<span class="cell off">รอ</span>' : v === 'p' ? '<span class="cell pp">กระดาษ</span>' : v >= D.useMin ? `<span class="cell ok">${v}%</span>` : `<span class="cell no">${v ? v + '%' : '—'}</span>`;
  const weak = D.weak.filter(x => subj === 'all' || x.s === subj).slice(0, 12);
  const reps = D.reports.filter(x => subj === 'all' || x.subject === subj);
  adMain().innerHTML = `
    <div class="pg-head"><div class="t"><h1>รายครู / รายห้อง</h1><p>${D.upto ? `ถึงสัปดาห์ที่ ${D.upto} · ` : ''}นับเป็นการใช้เมื่อนักเรียนตอบตั้งแต่ร้อยละ ${D.useMin} ของห้อง</p></div>
      <div class="acts"><select class="box" id="db-sub" aria-label="วิชา" style="width:auto;min-width:180px"><option value="all">ทุกวิชา</option>${D.subjects.map(s => `<option ${s === subj ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div></div>
    <div class="tabs" role="tablist" aria-label="ระดับชั้น">${D.levels.map(l => `<button type="button" role="tab" data-lvl="${esc(l)}" aria-selected="${l === D.level}">${esc(l)}</button>`).join('')}</div>
    ${!D.upto ? `<div class="notice wait">ยังไม่เริ่มนับโควตา${D.firstWeek ? ` (สัปดาห์ที่ 1 เริ่มวันจันทร์ที่ ${esc(D.firstWeek)})` : ''} ข้อมูลด้านล่างเป็นช่วงทดลองใช้</div>` : ''}
    <section class="sec"><div class="kpis">
      ${k1 === null ? kpi(`ครูนำไปใช้`, '—', 'ยังไม่มีสัปดาห์ที่วัดผลได้', null) : kpi(`ครูนำไปใช้ (${tUsing} จาก ${teachers.length} คน)`, k1 + '%', `เป้าหมาย ≥ ${D.goal}% · ${k1 >= D.goal ? 'ผ่าน' : 'ยังไม่ผ่าน'}`, k1 >= D.goal)}
      ${k2 === null ? kpi('ห้อง–วิชาใช้ต่อเนื่อง', '—', 'ยังไม่มีสัปดาห์ที่วัดผลได้', null) : kpi(`ห้อง–วิชาใช้ต่อเนื่อง (${contRooms} จาก ${measured.length})`, k2 + '%', `เป้าหมาย ≥ ${D.goal}% · ${k2 >= D.goal ? 'ผ่าน' : 'ยังไม่ผ่าน'}`, k2 >= D.goal)}
      ${!ap || ap.pct === null ? kpi('ทำแบบประเมินรวมแล้ว', '—', D.assess ? 'ยังไม่มีข้อมูลจำนวนนักเรียน' : 'ยังไม่ได้สร้างแบบประเมินของระดับชั้นนี้', null)
        : kpi(`ทำแบบประเมินรวมแล้ว (${ap.done} จาก ${ap.size} คน)`, ap.pct + '%', `เป้าหมาย 100% · ${ap.pct >= 100 ? 'ผ่าน' : 'ยังไม่ผ่าน'}`, ap.pct >= 100)}</div></section>
    <section class="sec" aria-labelledby="h-wk"><div class="sec-h"><div class="t"><h2 id="h-wk">การใช้รายสัปดาห์ · ${esc(D.level)}</h2>
        <span class="s">ใช้ต่อเนื่อง = ผ่านเกณฑ์ตั้งแต่ร้อยละ ${D.contMin} ของสัปดาห์ที่นับโควตา</span></div>
        ${rows.length ? '<button class="btn sm" type="button" id="db-copy">คัดลอกตาราง</button>' : ''}</div>
      <div class="strip"><span><span class="cell ok">≥${D.useMin}%</span> นับเป็นการใช้</span><span><span class="cell no">—</span> ไม่ถึงเกณฑ์</span><span><span class="cell pp">กระดาษ</span> แบบกระดาษ</span><span><span class="cell off">รอ</span> สัปดาห์ปัจจุบัน</span><span><span class="cell off">หยุด</span> ไม่นับโควตา</span></div>
      <div class="tw"><table class="tb">${rows.length ? `<thead><tr><th>ห้อง–วิชา</th><th>ครู</th>${D.weeks.map(w => `<th class="c">${esc(w)}</th>`).join('')}<th class="c">ต่อเนื่อง</th></tr></thead>
        <tbody>${rows.map(r => { const c = cont(r); return `<tr><td class="b">${esc(r.r)} ${esc(r.s)}</td><td class="m nw">${esc(r.t)}</td>${r.w.map(v => `<td class="c">${cell(v)}</td>`).join('')}<td class="c">${c === null ? '<span class="cell off">—</span>' : `<span class="cell ${c >= D.contMin ? 'ok' : 'no'}">${c}%</span>`}</td></tr>`; }).join('')}</tbody>`
        : '<tbody><tr><td class="m">ยังไม่มีห้อง–วิชาของระดับชั้นนี้ในชีตครูผู้สอน</td></tr></tbody>'}</table></div></section>
    <div class="cols">
      <section class="sec half" aria-labelledby="h-weak"><div class="sec-h"><div class="t"><h2 id="h-weak">ตัวชี้วัดที่ยังอ่อน</h2><span class="s">ร้อยละตอบถูก เรียงจากน้อยไปมาก · ผู้ตอบอย่างน้อย ${D.weakMin || 10} คน</span></div></div>
        <div class="sec-pad" style="padding-top:0">${weak.length ? weak.map(x => `<div class="meter" style="display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;font-size:14px">
          <span title="${esc(x.k)} · ${esc(x.s)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.k)} <span class="m" style="font-size:13px">${esc(x.s)} · ${x.n} คน</span></span>
          <div class="track${x.v < 50 ? ' low' : ''}"><span style="width:${x.v}%"></span></div><b class="num" style="text-align:right">${x.v}%</b></div>`).join('') : `<p class="m">${D.weakFew ? 'ยังไม่มีตัวชี้วัดที่มีผู้ตอบถึงเกณฑ์' : 'ยังไม่มีคำตอบของวิชานี้'}</p>`}
          ${D.weakFew ? `<p class="m" style="font-size:13px">ไม่แสดง ${D.weakFew} ตัวชี้วัดที่มีผู้ตอบน้อยกว่าเกณฑ์</p>` : ''}</div></section>
      <section class="sec half" aria-labelledby="h-bk"><div class="sec-h"><div class="t"><h2 id="h-bk">คลังข้อสอบ ${esc(D.level)}</h2></div></div>
        <div class="tw"><table class="tb"><thead><tr><th>ประเภท</th><th>วิชา</th><th class="r">ใช้ในคาบแล้ว</th><th class="r">ใช้ในคาบได้</th><th class="r">ใช้ในแบบประเมินได้</th></tr></thead>
          <tbody>${D.bank.length ? D.bank.map(b => `<tr><td><span class="etag">${esc(b.exam)}</span></td><td class="b">${esc(b.subject)}</td><td class="r num">${b.used}</td><td class="r num">${b.cls}</td><td class="r num">${b.assess}</td></tr>`).join('') : '<tr><td colspan="5" class="m">คลังข้อสอบของระดับชั้นนี้ยังว่าง</td></tr>'}</tbody></table></div></section>
    </div>
    <section class="sec" aria-labelledby="h-rp"><div class="sec-h"><div class="t"><h2 id="h-rp">รายงานคาบล่าสุด</h2></div></div>
      <div class="tw"><table class="tb">${reps.length ? `<thead><tr><th>วันที่</th><th>ห้อง–วิชา</th><th>ครู</th><th>ข้อสอบ</th><th>ระดับที่ใช้สอน</th><th>บันทึก</th></tr></thead>
        <tbody>${reps.map(x => `<tr class="top"><td class="nw m">${esc(x.at)}</td><td class="b">${esc(x.room)} ${esc(x.subject)}</td><td class="nw">${esc(x.t)}</td><td class="m" style="min-width:160px">${esc([x.exam, x.ind].filter(Boolean).join(' · '))}</td>
          <td>${cTag(x.c) || '—'}</td><td class="read">${esc([x.chips, x.note].filter(Boolean).join(' — ')) || '<span class="m">—</span>'}</td></tr>`).join('')}</tbody>`
        : '<tbody><tr><td class="m">ยังไม่มีรายงานคาบของระดับชั้นนี้</td></tr></tbody>'}</table></div></section>`;
  $('#db-sub').onchange = e => { DB.subject = e.target.value; dbRender(); };
  const cp = $('#db-copy');
  if (cp) cp.onclick = () => {
    const txt = v => v === 'x' ? 'หยุด' : v === 'w' ? 'รอ' : v === 'p' ? 'กระดาษ' : v ? v + '%' : '-';
    const lines = [['ห้อง', 'วิชา', 'ครู', ...D.weeks, 'ต่อเนื่อง'].join('\t')]
      .concat(rows.map(r => { const c = cont(r); return [r.r, r.s, r.t, ...r.w.map(txt), c === null ? '-' : c + '%'].join('\t'); }));
    copyText(lines.join('\n'), 'คัดลอกตารางแล้ว');
  };
  $$('[data-lvl]', adMain()).forEach(b => b.onclick = () => { if (b.dataset.lvl !== D.level) { DB.subject = 'all'; dbLoad(b.dataset.lvl); } });
}

/* ===================== หน้าฉาย QR (เปิดบนคอมห้องเรียน ไม่ต้องล็อกอิน) ===================== */
async function screenInit(token) {
  VIEW_IDS.forEach(x => { $('#view-' + x).hidden = true; });
  const fs = $('#fs'); fs.hidden = false;
  let drawn = false;
  const tick = async () => {
    let d;
    try { d = await run('screenData', token); } catch (e) { return; }
    if (d.closed) {
      const res = d.result, it = d.item;
      if (res && it && res.n) {
        const bars = res.dist ? it.opts.map((o, j) => { const n = res.dist[j] || 0, key = isKey(it, j);
          return `<div class="fs-bar${key ? ' key' : ''}"><span class="k">${OPT_L[j]}</span><span class="tx" title="${esc(o)}">${esc(o)}${key ? ' ✓' : ''}</span><span class="tr"><span style="width:${pct(n, res.n)}%"></span></span><span class="n">${n}</span></div>`; }).join('') : '';
        fs.innerHTML = `<div class="fs-top"><h2>${esc(d.subject || '')} · ห้อง ${esc(d.room)} · ปิดรับคำตอบแล้ว</h2></div>
          <div class="fs-res">${it.q ? `<p class="fs-q" style="max-width:none">${esc(it.q)}</p>` : ''}
            <div><span class="pct">${res.pct}%</span> <span class="sum">ตอบถูก ${res.ok} จาก ${res.n} คน</span></div>${bars}</div>
          <p class="fs-foot">${res.dist ? 'แถบสีเขียวคือคำตอบที่ถูก ตัวเลขคือจำนวนนักเรียนที่เลือก' : ''}</p>`;
      } else fs.innerHTML = `<div></div><div class="fs-closed"><b class="fs-room">${d.room ? 'ห้อง ' + esc(d.room) : ''}</b><span>ปิดรับคำตอบแล้ว</span></div><div></div>`;
      return true;
    }
    if (!drawn) {
      fs.innerHTML = `
        <div class="fs-top"><h2>${esc(d.subject)} · ข้อประจำคาบ</h2><span>ปิดรับอัตโนมัติ ${esc(d.deadline)}</span></div>
        <div class="fs-main">${d.q ? `<p class="fs-q">${esc(d.q)}</p>` : ''}<div class="fs-qr" id="fs-qr"></div>
          <div class="fs-side"><span class="fs-room">ห้อง ${esc(d.room)}</span>
            ${fsHow(d.link)}<span class="fs-code">${fmtCode(d.code)}</span>
            <span class="fs-count">ตอบแล้ว <b id="fs-count">${d.sent}</b> จาก ${d.size || '?'} คน</span></div></div>
        <p class="fs-foot">ใช้ได้เฉพาะห้อง ${esc(d.room)}</p>`;
      drawQr($('#fs-qr'), d.link); drawn = true;
    } else $('#fs-count').textContent = d.sent;
  };
  fs.innerHTML = '<div></div><div class="loading">กำลังโหลด…</div><div></div>';
  if (await tick()) return;
  const timer = setInterval(async () => { if (await tick()) clearInterval(timer); }, 6000);
}

/* ===================== เริ่มระบบ ===================== */
function startTeacher() { closeSheet(); go('teacher'); tInit(); }
function startStaff() {
  if (adminLink()) {
    if (ME.canDash) return startAdmin(PARAMS.page === 'dashboard' ? 'usage' : 'week');
    // ครูที่ไม่มีสิทธิ์เปิดลิงก์ผู้ดูแล: ออกจากระบบในลิงก์นี้ ไม่พาไปหน้าครู
    const t = TK.get(); TK.clear(); run('logout', t).catch(() => {});
    return showLogin('บัญชีนี้ไม่มีสิทธิ์เข้าหน้าผู้ดูแลระบบ กรุณาเข้าผ่านเมนูหน้าครูใน LINE OA');
  }
  startTeacher();
}

async function boot() {
  PARAMS = Object.fromEntries(new URLSearchParams(location.search));
  if (PARAMS.screen) return screenInit(PARAMS.screen);
  const asStudent = PARAMS.r || PARAMS.code || PARAMS.a || PARAMS.page === 'student';
  // นักเรียน: เปิดข้อสอบทันที ไม่รอ whoAmI (ใช้แค่ชื่อโรงเรียน) เน็ตช้าจะได้ไม่เห็นจอขาว
  if (asStudent) {
    run('whoAmI', '').then(m => { ME = m || {}; if (ME.school) document.title = 'ระบบฝึกข้อสอบระดับชาติ · ' + ME.school; }).catch(() => {});
    if (PARAMS.a) { go('assess'); return asInit(); }
    go('student'); return stuInit();
  }
  $('#view-login').innerHTML = '<main><div class="loading">กำลังเปิดระบบ…</div></main>'; go('login');
  try { ME = await run('whoAmI', TK.get()); } catch (e) { ME = {}; }
  if (ME.school) document.title = 'ระบบฝึกข้อสอบระดับชาติ · ' + ME.school;
  if (ME.canTeach) return startStaff();
  if (['teacher', 'dashboard', 'admin'].indexOf(PARAMS.page) >= 0) return showLogin(TK.get() ? 'หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบอีกครั้ง' : '');
  go('student'); stuInit();
}
boot();
</script>
